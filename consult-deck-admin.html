<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>상담자료 관리 · 송우찬수학학원</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#1A1230; --bg-2:#211839; --card:#251C40; --card-2:#2D2350;
  --line:rgba(240,237,248,.10); --line-2:rgba(240,237,248,.18);
  --text:#F0EDF8; --muted:rgba(240,237,248,.58); --gold:#F0C040; --danger:#FF8F7E; --ok:#8FD9A8;
  --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{height:40px;padding:0 16px;border-radius:9px;font-size:13.5px;font-weight:650;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  border:1px solid var(--line-2);transition:background .15s,border-color .15s,opacity .15s}
.btn:hover{border-color:rgba(240,192,64,.45)}
.btn.primary{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text)}
.ib{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--muted);flex:0 0 auto}
.ib:hover{background:rgba(255,255,255,.07);color:var(--text)}
.ib:disabled{opacity:.25;cursor:default;background:none}
.ib svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 헤더 */
header{position:sticky;top:0;z-index:10;background:rgba(26,18,48,.96);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:16px;padding:12px 22px;flex-wrap:wrap}
.hd .brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:16px;letter-spacing:-.02em;white-space:nowrap}
.hd .brand img{width:28px;height:28px;object-fit:contain}
.hd .brand a{color:var(--muted);font-size:12.5px;font-weight:600;text-decoration:none;margin-left:6px}
.hd .brand a:hover{color:var(--gold)}
.decks{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto}
.deck-tab{height:36px;padding:0 14px;border-radius:18px;font-size:13px;font-weight:650;color:var(--muted);white-space:nowrap;border:1px solid transparent}
.deck-tab.on{color:var(--bg);background:var(--gold)}
.deck-tab:disabled{opacity:.45;cursor:default}
.deck-tab small{font-size:11px;font-weight:600;margin-left:4px}
.hd .acts{display:flex;gap:8px;align-items:center}
.status{font-size:12.5px;color:var(--muted);white-space:nowrap}
.status.dirty{color:var(--gold)}

/* 본문 */
.wrap{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 65px)}
aside{border-right:1px solid var(--line);padding:16px 12px 40px;overflow:auto;max-height:calc(100vh - 65px);position:sticky;top:65px}
.tree-item{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 10px;border-radius:9px;cursor:pointer;min-height:42px}
.tree-item:hover{background:rgba(255,255,255,.04)}
.tree-item.sel{background:var(--card-2)}
.tree-item .nm{flex:1;min-width:0;font-size:13.5px;line-height:1.35}
.tree-item .nm small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-item.off .nm{opacity:.38;text-decoration:line-through}
.tree-sec{margin-top:10px}
.tree-sec>.tree-item .nm{font-weight:750}
.tree-sec>.tree-item .no{color:var(--gold);font-weight:800;font-size:12.5px;margin-right:6px;font-variant-numeric:tabular-nums}
.tree-sec .kids{margin-left:14px;border-left:1px solid var(--line);padding-left:6px}
.tree-sec.off .kids{opacity:.4}
.tree-label{font-size:11.5px;color:var(--muted);padding:14px 10px 6px;font-weight:600}
main{padding:26px clamp(18px,3vw,40px) 80px;min-width:0}
.panel{max-width:860px}
.panel h2{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px}
.panel .sub{font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.6}
.panel .sub b{color:var(--text)}
.panel-acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.fld{margin-bottom:18px}
.fld>label{display:block;font-size:12.5px;font-weight:650;color:var(--muted);margin-bottom:7px}
.fld>label em{font-style:normal;font-weight:500;opacity:.75;margin-left:6px}
input[type=text],input[type=number],input[type=email],input[type=password],textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line-2);border-radius:9px;
  color:var(--text);font:inherit;font-size:15px;line-height:1.6;padding:10px 12px;outline:none;transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:84px}
textarea.short{min-height:60px}
input[type=number]{width:140px}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.sw input{width:18px;height:18px;accent-color:var(--gold)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:start}
.li .ctl{display:flex;flex-direction:column;gap:2px}
.obj{border:1px solid var(--line-2);border-radius:12px;padding:14px 14px 4px;background:rgba(255,255,255,.02)}
.obj .oh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:12.5px;color:var(--gold);font-weight:750}
.obj .oh .ctl{display:flex;gap:2px}
.obj .fld{margin-bottom:12px}
.add{align-self:flex-start}
.img-fld{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start}
.img-fld .pv{width:150px;aspect-ratio:4/3;border-radius:9px;background:rgba(255,255,255,.04) center/contain no-repeat;border:1px solid var(--line-2);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.img-fld .ia{display:flex;flex-direction:column;gap:8px}
.img-fld .ia .row{display:flex;gap:6px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted);line-height:1.6}
.hint code{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:5px;color:var(--gold);font-size:12px}
.note-box{border:1px solid rgba(240,192,64,.25);background:rgba(240,192,64,.06);border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.7;color:var(--text);margin-bottom:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}

/* 모달 · 로그인 · 토스트 */
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,7,22,.72);display:none;place-items:center;padding:20px}
.modal.open{display:grid}
.modal .box{width:min(560px,100%);max-height:80vh;overflow:auto;background:var(--card);border:1px solid var(--line-2);border-radius:16px;padding:22px}
.modal h3{font-size:18px;font-weight:800;margin-bottom:6px}
.hist{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.hist .h{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.04);font-size:13.5px}
.hist .h span{flex:1}
.hist .h small{color:var(--muted);display:block;font-size:12px}
#gate{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;place-items:center;padding:24px}
#gate.open{display:grid}
#gate .box{width:min(400px,100%);text-align:center}
#gate img{width:52px;height:52px;margin:0 auto 16px;object-fit:contain}
#gate h1{font-size:22px;font-weight:800;margin-bottom:6px}
#gate p{font-size:13.5px;color:var(--muted);margin-bottom:22px}
#gate input{margin-bottom:10px;height:50px}
#gate .btn{width:100%;height:50px;justify-content:center;font-size:15px}
#gate .err{color:var(--danger);font-size:13px;margin-top:12px;min-height:18px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);z-index:50;background:var(--text);color:var(--bg);font-size:13.5px;font-weight:600;
  padding:11px 18px;border-radius:22px;opacity:0;transition:all .25s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.err{background:var(--danger)}
#loading{position:fixed;inset:0;z-index:45;background:var(--bg);display:grid;place-items:center;color:var(--muted);font-size:14px}
#loading.hide{display:none}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}
  .grid2{grid-template-columns:1fr}
  .img-fld{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header><div class="hd">
  <div class="brand"><img src="swc-logo.svg" alt="" onerror="this.style.display='none'">상담자료 관리<a href="admin.html">← 관리자 페이지</a></div>
  <div class="decks" id="decks">
    <button class="deck-tab on" data-deck="middle">중등 프로그램</button>
    <button class="deck-tab" disabled>고등 프로그램<small>준비 중</small></button>
    <button class="deck-tab" disabled>기타 상담자료<small>준비 중</small></button>
  </div>
  <div class="acts">
    <span class="status" id="status">불러오는 중</span>
    <button class="btn sm ghost" id="btnHistory">이전 버전</button>
    <button class="btn sm" id="btnOpen">상담자료 열기</button>
    <button class="btn sm" id="btnPreview">미리보기</button>
    <button class="btn primary" id="btnSave" disabled>저장</button>
  </div>
</div></header>

<div class="wrap">
  <aside id="tree"></aside>
  <main><div class="panel" id="panel"></div></main>
</div>

<div class="modal" id="histModal"><div class="box">
  <h3>이전 버전</h3>
  <p class="hint">저장할 때마다 바로 전 상태가 최근 10개까지 보관됩니다. 불러온 뒤 <b>저장</b>을 눌러야 실제로 적용됩니다.</p>
  <div class="hist" id="histList"></div>
  <div style="margin-top:16px;text-align:right"><button class="btn sm" data-close>닫기</button></div>
</div></div>

<div id="gate"><div class="box">
  <img src="swc-logo.svg" alt="" onerror="this.style.display='none'">
  <h1>상담자료 관리</h1>
  <p>관리자 계정으로 로그인해 주세요.</p>
  <form id="gateForm">
    <input type="email" id="gEmail" placeholder="관리자 이메일" autocomplete="username" required>
    <input type="password" id="gPw" placeholder="비밀번호" autocomplete="current-password" required>
    <button class="btn primary" type="submit" id="gBtn">로그인</button>
  </form>
  <div class="err" id="gErr"></div>
</div></div>
<div id="loading">불러오는 중…</div>
<div id="toast"></div>

<script>
/* ════════════════════════════════════════════════════
   상담자료 편집기
   - 데이터: Firestore consultDecks/{deck} (한 문서), 저장 직전 상태는 consultDecks/{deck}/history 에 보관
   - 이미지: Storage consultDecks/{deck}/{sceneId}/...
   - Scene의 레이아웃·모션은 consult-deck.html 코드에 고정, 여기서는 내용만 편집
   ════════════════════════════════════════════════════ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2, '0');
const clone = o => JSON.parse(JSON.stringify(o));
const DECK = (new URLSearchParams(location.search).get('deck') || 'middle').replace(/[^a-z0-9_-]/gi, '');

/* ── Scene 이름 (원본 PDF 페이지 표기) ── */
const NAMES = {
  'intro': ['표지', 'PDF 1p'], 'contents': ['목차 (Contents)', 'PDF 2p · 섹션 목록에서 자동 생성'],
  'learning-goals': ['두 가지 목표 · 4단계', 'PDF 3p 헤드라인·그림'], 'learning-text': ['체계적인 커리큘럼', 'PDF 3p 본문'], 'learning-table': ['학기별 흐름표', 'PDF 3p 표·주석'],
  'books-intro': ['교재 선정 원칙', 'PDF 4p 본문'], 'books-stages': ['단계별 대표교재', 'PDF 4p 표·교재 사진'],
  'daily-intro': ['데일리테스트 소개', 'PDF 5p 헤드라인·시험지'], 'daily-review': ['복습의 완성', 'PDF 5p 본문'],
  'clinic-why': ['맞춤식 수업의 의미', 'PDF 6p 헤드라인·본문1'], 'clinic-flow': ['개인별 클리닉 진행', 'PDF 6p 시험지·본문2·강조문구'],
  'exam-goal': ['최종 목표는 시험', 'PDF 7p 헤드라인·본문1'], 'exam-start': ['내신대비 START', 'PDF 7p 표지·본문2'], 'exam-process': ['시험 대비 과정', 'PDF 7p 본문3'],
  'mock-why': ['실전 연습의 중요성', 'PDF 8p 헤드라인·본문1'], 'mock-timeline': ['모의테스트 일정 (2회)', 'PDF 8p 본문2'], 'mock-notice': ['실시 공고', 'PDF 8p 공고 이미지'],
  'report-why': ['학습상황 파악', 'PDF 9p 본문'], 'report-weekly': ['학업 성취도 안내문자', 'PDF 9p 안내문자 이미지'], 'report-monthly': ['월말보고서', 'PDF 9p monthly report'],
  'online-site': ['온라인 학습관 화면', 'PDF 10p 헤드라인·홈페이지'], 'online-programs': ['온라인 강의 3종', 'PDF 10p 강의·주석'],
  'care-attendance': ['출결관리 시스템', 'PDF 11p 1번'], 'care-kakao': ['카카오톡 플러스친구', 'PDF 11p 2번·채팅 이미지'], 'care-friend': ['카톡친구맺기', 'PDF 11p 친구맺기·ID 이미지'],
  'thanks': ['감사합니다', 'PDF 12p'],
};

/* ── 필드 스키마: t = text | area | list | obj | img | num | bool ── */
const F = (k, l, t = 'text', x = {}) => ({ k, l, t, ...x });
const SCHEMA = {
  'intro': [],
  'contents': [F('heading', '제목')],
  'learning-goals': [F('headline', '헤드라인', 'area'), F('currentLabel', '왼쪽 위 단어'), F('currentGoal', '현행 목표'), F('advanceLabel', '왼쪽 아래 단어'), F('advanceGoal', '선행 목표'),
    F('stages', '4단계', 'obj', { fields: [F('name', '단계명'), F('ko', '한글명')], item: '단계' })],
  'learning-text': [F('subtitle', '소제목'), F('paragraphs', '본문 (한 칸 = 다음 버튼 한 번)', 'list')],
  'learning-table': [F('title', '화면 제목'), F('rowCurrent', '1행 이름'), F('rowAdvance', '2행 이름'),
    F('periods', '시기', 'obj', { item: '시기', fields: [F('label', '시기명'), F('sub', '보조 표기'), F('exam', '내신기간 강조', 'bool'), F('current', '현행 (줄마다 한 칸)', 'area'), F('advance', '선행 (줄마다 한 칸)', 'area')] }),
    F('note', '주석', 'area')],
  'books-intro': [F('subtitle', '소제목'), F('paragraphs', '본문', 'list')],
  'books-stages': [F('title', '화면 제목'), F('stages', '단계별 교재', 'obj', { item: '단계', fields: [F('name', '단계명'), F('desc', '설명', 'area'), F('books', '교재명'), F('image', '교재 사진', 'img')] })],
  'daily-intro': [F('titleEn', '영문 제목'), F('headline', '헤드라인 (줄 단위)', 'list'), F('image', '시험지 이미지', 'img'), F('imageCaption', '이미지 설명')],
  'daily-review': [F('subtitle', '소제목'), F('loopCenter', '원 가운데 글자'), F('loop', '원 위 단계 (3개)', 'list', { short: true }), F('paragraphs', '본문', 'list')],
  'clinic-why': [F('titleEn', '영문 제목'), F('headline', '헤드라인 (줄 단위)', 'list'), F('subtitle', '소제목'), F('compareLeft', '비교 왼쪽'), F('compareRight', '비교 오른쪽'), F('paragraphs', '본문', 'list')],
  'clinic-flow': [F('title', '화면 제목'), F('image', '클리닉 시험지 이미지', 'img'), F('imageCaption', '이미지 설명'),
    F('steps', '진행 단계', 'obj', { item: '단계', fields: [F('title', '단계명'), F('desc', '설명')] }), F('paragraph', '본문', 'area'), F('badge', '강조 문구')],
  'exam-goal': [F('headline', '헤드라인', 'area'), F('keyword', '크게 보여줄 단어'), F('paragraphs', '본문', 'list')],
  'exam-start': [F('title', '화면 제목'), F('image', '교재 표지 이미지', 'img'), F('imageCaption', '이미지 설명'), F('paragraphs', '본문', 'list')],
  'exam-process': [F('title', '화면 제목'), F('steps', '과정', 'obj', { item: '단계', fields: [F('title', '단계명'), F('desc', '설명')] }), F('paragraph', '본문', 'area')],
  'mock-why': [F('headline', '헤드라인 (줄 단위)', 'list'), F('subtitle', '소제목'), F('paragraphs', '본문', 'list')],
  'mock-timeline': [F('title', '화면 제목'), F('examLabel', '시험 표시'),
    F('rounds', '회차', 'obj', { item: '회차', fields: [F('label', '회차명'), F('when', '시기 표기'), F('weeks', '시험 몇 주 전', 'num'), F('desc', '설명', 'area')] }), F('paragraph', '본문', 'area')],
  'mock-notice': [F('title', '화면 제목'), F('noticeTitle', '공고 제목', 'area'),
    F('rounds', '일정', 'obj', { item: '회차', fields: [F('label', '회차'), F('date', '날짜')] }),
    F('rangeLabel', '시험범위 제목'), F('rangeText', '시험범위 내용', 'area'), F('bankPercent', '문제은행 비율 (%)', 'num'), F('bankLabel', '문제은행 표기'), F('otherLabel', '기타문제 표기'),

function fieldHTML(f, val, path) {

  if (rs) { const id = rs.dataset.resetScene, ds = S.def.scenes.find(s => s.id === id); if (!ds) return toast('기본값이 없는 화면입니다.', 1);

    const sc = S.deck.scenes.find(s => s.id === id); sc.data = clone(ds.data); renderPanel(); markDirty(); toast('기본값으로 되돌렸습니다. 저장해야 적용됩니다.'); return; }
  const imd = t.closest('[data-img-default]');
  if (imd) { const path = imd.dataset.imgDefault; const dv = getP(S.def, mapDefPath(path)); setP(S.deck, path, dv ?? ''); renderPanel(); markDirty(); return; }
  const imc = t.closest('[data-img-clear]');
  if (imc) { setP(S.deck, imc.dataset.imgClear, ''); renderPanel(); markDirty(); return; }
  const ps = t.closest('[data-preview-scene]'); if (ps) return preview(ps.dataset.previewScene);
  const pc = t.closest('[data-preview-section]'); if (pc) { const f = S.deck.scenes.find(s => s.section === pc.dataset.previewSection); return preview(f?.id); }
});
/* scenes.{i}.data... 경로를 기본 데이터의 같은 Scene 경로로 변환 */
function mapDefPath(path) {
  const m = path.match(/^scenes\.(\d+)\.(.*)$/); if (!m) return path;
  const id = S.deck.scenes[+m[1]].id; const di = S.def.scenes.findIndex(s => s.id === id);
  return di < 0 ? '__none__' : `scenes.${di}.${m[2]}`;
}
$('#panel').addEventListener('change', async e => {
  const inp = e.target.closest('[data-upload]'); if (!inp || !inp.files[0]) return;
  const path = inp.dataset.upload; const sceneId = (path.match(/^scenes\.(\d+)/) && S.deck.scenes[+path.match(/^scenes\.(\d+)/)[1]].id) || 'common';
  if (!S.fb) return toast('테스트 모드에서는 업로드할 수 없습니다.', 1);
  try {
    toast('이미지 올리는 중…');
    const { blob, ext } = await shrinkImage(inp.files[0], 2000);
    const { ref, uploadBytes, getDownloadURL, storage } = S.fb;
    const r = ref(storage, `consultDecks/${DECK}/${sceneId}/${Date.now()}.${ext}`);
    await uploadBytes(r, blob, { contentType: blob.type });
    const url = await getDownloadURL(r);
    setP(S.deck, path, url); renderPanel(); markDirty(); toast('이미지를 바꿨습니다. 저장해야 적용됩니다.');
  } catch (x) { console.error(x); toast('이미지를 올리지 못했습니다: ' + (x.code || x.message), 1); }
});
function shrinkImage(file, max) {
  return new Promise((res, rej) => {
    const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => {
      const sc = Math.min(1, max / Math.max(img.width, img.height)); const w = Math.round(img.width * sc), h = Math.round(img.height * sc);
      const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
      const png = /png|gif|webp/.test(file.type);
      if (!png) { g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); }
      g.drawImage(img, 0, 0, w, h); URL.revokeObjectURL(u);
      c.toBlob(b => b ? res({ blob: b, ext: png ? 'png' : 'jpg' }) : rej(new Error('변환 실패')), png ? 'image/png' : 'image/jpeg', 0.9);
    };
    img.onerror = () => rej(new Error('이미지를 읽을 수 없습니다.')); img.src = u;
  });
}

/* ── 미리보기 · 열기 ── */
function preview(sceneId) {
  try { localStorage.setItem('cd_draft_' + DECK, JSON.stringify(S.deck)); } catch (e) { return toast('미리보기 데이터를 저장하지 못했습니다.', 1); }
  window.open(`consult-deck.html?deck=${DECK}&preview=1${sceneId ? '#' + encodeURIComponent(sceneId) : ''}`, 'cdpreview');
}
$('#btnPreview').onclick = () => preview(S.sel.kind === 'scene' ? S.sel.id : S.sel.kind === 'section' ? S.deck.scenes.find(s => s.section === S.sel.id)?.id : '');
$('#btnOpen').onclick = () => {
  if (JSON.stringify(S.deck) !== S.savedJSON && !confirm('저장하지 않은 변경은 상담 화면에 반영되지 않습니다. 그래도 열까요?')) return;
  window.open(`consult-deck.html?deck=${DECK}`, '_blank');
};

/* ── 저장 · 이전 버전 ── */
function cleanForSave(d) { const o = clone(d); delete o.updatedAt; delete o.updatedBy; return o; }
$('#btnSave').onclick = async () => {

  const b = $('#btnSave'); b.disabled = true; b.textContent = '저장 중…';

    const ref = doc(db, 'consultDecks', DECK);

    await setDoc(ref, { ...cleanForSave(S.deck), updatedAt: serverTimestamp(), updatedBy: S.user?.email || '' });
    S.savedJSON = JSON.stringify(S.deck); S.existed = true; markDirty(); toast('저장했습니다. 상담 화면에 바로 반영됩니다.');

$('#btnHistory').onclick = async () => {

  try {
    const { db, collection, getDocs, query, orderBy, limit } = S.fb;
    const hs = await getDocs(query(collection(db, 'consultDecks', DECK, 'history'), orderBy('savedAt', 'desc'), limit(10)));
    if (hs.empty) { L.innerHTML = '<p class="hint">아직 보관된 이전 버전이 없습니다. 두 번째 저장부터 쌓입니다.</p>'; return; }
    S._hist = hs.docs.map(x => x.data());
    L.innerHTML = S._hist.map((h, i) => { const t = h.savedAt?.toDate ? h.savedAt.toDate() : null;
      return `<div class="h"><span>${t ? t.toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' }) : '시간 정보 없음'}<small>이 시점 직전 상태 · ${esc(h.savedBy || '')}</small></span><button class="btn sm" data-hist="${i}">불러오기</button></div>`; }).join('');
  } catch (x) { L.innerHTML = `<p class="hint">불러오지 못했습니다: ${esc(x.code || x.message)}</p>`; }
};
$('#histModal').addEventListener('click', e => {
  if (e.target.id === 'histModal' || e.target.closest('[data-close]')) { $('#histModal').classList.remove('open'); return; }
  const hb = e.target.closest('[data-hist]'); if (!hb) return;
  if (!confirm('이 버전을 편집 화면에 불러올까요? 저장을 눌러야 실제로 적용됩니다.')) return;
  S.deck = merge(S._hist[+hb.dataset.hist].deck, S.def); $('#histModal').classList.remove('open'); S.sel = { kind: 'common' }; renderTree(); renderPanel(); markDirty();
  toast('이전 버전을 불러왔습니다. 저장해야 적용됩니다.');
});

/* ── 기본값 병합 (consult-deck.html의 mergeDeck과 같은 규칙) ── */
function merge(saved, def) {
  if (!saved) return clone(def);
  const out = { ...clone(def), ...clone(saved), meta: { ...def.meta, ...(saved.meta || {}) }, contact: { ...def.contact, ...(saved.contact || {}) } };
  const ds = new Map(def.scenes.map(s => [s.id, s]));
  out.scenes = (saved.scenes || []).map(s => ds.has(s.id) ? { ...clone(ds.get(s.id)), ...clone(s), data: { ...clone(ds.get(s.id).data), ...clone(s.data || {}) } } : clone(s));
  def.scenes.forEach(s => { if (!out.scenes.some(x => x.id === s.id)) out.scenes.push({ ...clone(s), visible: false }); });
  const secIds = new Set((saved.sections || []).map(s => s.id));
  out.sections = [...clone(saved.sections || def.sections), ...clone(def.sections.filter(s => !secIds.has(s.id) && saved.sections))];
  delete out.updatedAt; delete out.updatedBy;
  return out;
}

if (window.__CD_TEST__) loadDefault().then(def => start(null, def));
</script>
