<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>수강료 결제 | 송우찬수학학원</title>
<link rel="icon" href="/logo.png">
<script src="https://js.tosspayments.com/v2/standard"></script>
<style>
  /* 학부모용 청구서 — 송우찬수학학원 보라·노랑 */
  :root{ --p:#3B2A73; --p2:#4B3391; --pl:#ECE9F4; --g:#F5C518; --gl:#FFF4CC; --ink:#1F1F27; --mut:#6A6878; --line:#DEDCE5; --red:#C8352E; --green:#23864A; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;background:#F4F3F8;color:var(--ink);font-size:15px;letter-spacing:-.2px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}
  header{background:var(--p);color:#fff;padding:18px 20px 16px;display:flex;align-items:center;gap:10px}
  header img{width:34px;height:34px;border-radius:50%;background:#fff;padding:3px}
  header .t{font-weight:800;font-size:17px}
  header .s{font-size:12px;opacity:.8;margin-top:2px}
  .test{background:var(--g);color:#1F1F27;font-weight:800;font-size:13px;padding:8px 20px}
  main{flex:1;padding:20px}
  h2{font-size:19px;margin:0 0 4px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:18px}
  .list{border-top:2px solid var(--p);margin-bottom:14px}
  .row{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer}
  .row input{width:20px;height:20px;accent-color:var(--p2);flex-shrink:0}
  .row .nm{flex:1;min-width:0}
  .row .nm b{display:block;font-size:15px;font-weight:700;word-break:keep-all}
  .row .nm small{color:var(--mut);font-size:12px}
  .row .nm small.over{color:var(--red);font-weight:700}
  .row .amt{font-weight:800;font-size:15px;white-space:nowrap}
  .allbar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin:0 0 6px 2px}
  .allbar input{width:18px;height:18px;accent-color:var(--p2)}
  .total{display:flex;justify-content:space-between;align-items:baseline;background:var(--pl);padding:14px 16px;margin:6px 0 18px}
  .total span{font-weight:700}
  .total b{font-size:24px;color:var(--p)}
  .label{font-weight:700;font-size:14px;margin:0 0 8px}
  .methods{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
  .methods button{height:48px;border:1px solid #BDB9CB;background:#fff;font-size:15px;font-weight:700;border-radius:4px;cursor:pointer;font-family:inherit;color:var(--ink)}
  .methods button.on{border:2px solid var(--p2);color:var(--p2);background:#F7F5FC}
  .notice{background:var(--gl);border-left:4px solid var(--g);padding:12px 14px;font-size:13px;line-height:1.6;white-space:pre-wrap;margin-bottom:18px}
  .notice b{display:block;margin-bottom:4px}
  .pay{width:100%;height:56px;border:0;border-radius:4px;background:var(--p2);color:#fff;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit}
  .pay:disabled{background:#B7B3C6;cursor:default}
  .foot{color:var(--mut);font-size:12px;line-height:1.6;margin-top:14px}
  .center{text-align:center;padding:50px 10px}
  .center .ic{font-size:46px;margin-bottom:10px}
  .center h2{margin-bottom:8px}
  .center p{color:var(--mut);font-size:14px;line-height:1.6;margin:0 0 6px;word-break:keep-all}
  .center .big{font-size:26px;font-weight:800;color:var(--p);margin:10px 0}
  .btn2{display:inline-block;margin-top:16px;padding:12px 20px;border:1px solid var(--p2);color:var(--p2);text-decoration:none;font-weight:700;border-radius:4px;background:#fff;font-size:14px;cursor:pointer;font-family:inherit}
  .spin{width:34px;height:34px;border:4px solid var(--pl);border-top-color:var(--p2);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px;text-align:center}
  footer{padding:16px 20px 26px;color:var(--mut);font-size:11px;line-height:1.6;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="/logo.png" alt=""><div><div class="t" id="hAcademy">송우찬수학학원</div><div class="s" id="hSub">수강료 결제</div></div></header>
  <div class="test" id="testBar" hidden>테스트 결제 화면이에요 — 실제로 돈이 나가지 않습니다</div>
  <main id="main"><div class="center"><div class="spin"></div><p>청구 내역을 불러오고 있어요...</p></div></main>
  <footer>송우찬수학학원 · 결제는 토스페이먼츠를 통해 안전하게 처리됩니다.<br>카드 정보는 학원에 저장되지 않습니다.</footer>
</div>
<script>
(function () {
  'use strict';
  var API = 'https://asia-northeast3-songmath.cloudfunctions.net/billPay';
  var qs = new URLSearchParams(location.search);
  var token = qs.get('t') || '';
  var main = document.getElementById('main');
  var state = { data: null, method: 'CARD', busy: false };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function won(n) { return (Number(n) || 0).toLocaleString('ko-KR'); }
  function today() { return new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); }
  function dot(d) { return d ? d.replace(/-/g, '.') : ''; }
  function msgView(ic, title, text, extra) {
    main.innerHTML = '<div class="center"><div class="ic">' + ic + '</div><h2>' + esc(title) + '</h2><p>' + esc(text) + '</p>' + (extra || '') + '</div>';
  }
  function api(method, body) {
    var opt = { method: method, headers: {} };
    var url = API;
    if (method === 'GET') url += '?t=' + encodeURIComponent(token);
    else { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(Object.assign({ t: token }, body)); }
    return fetch(url, opt).then(function (r) { return r.json().catch(function () { return { ok: false, msg: '서버 응답을 읽지 못했어요.' }; }); });
  }
  // 결제창에서 돌아온 주소에서 결제 정보 지우기 (새로고침해도 다시 승인 요청하지 않게)
  function cleanUrl() { try { history.replaceState(null, '', location.pathname + '?t=' + encodeURIComponent(token)); } catch (e) {} }

  // ── 청구서 ──
  function render() {
    var d = state.data;
    document.getElementById('hAcademy').textContent = d.academy || '송우찬수학학원';
    document.getElementById('hSub').textContent = (d.branch || '') + ' 수강료 결제';
    document.getElementById('testBar').hidden = !d.test;
    if (!d.charges.length) {
      msgView('✅', '결제할 청구가 없어요', (d.studentName || '') + ' 학생은 지금 남은 청구가 없습니다. 이미 납입하셨다면 따로 하실 일은 없어요.');
      return;
    }
    var t = today();
    main.innerHTML =
      '<h2>' + esc(d.studentName) + ' 학생 청구 내역</h2>' +
      '<div class="sub">결제할 항목을 확인하고 결제해 주세요.</div>' +
      (d.charges.length > 1 ? '<label class="allbar"><input type="checkbox" id="all" checked> 전체 선택</label>' : '') +
      '<div class="list">' + d.charges.map(function (c) {
        var over = c.dueDate && c.dueDate < t;
        return '<label class="row"><input type="checkbox" class="ck" value="' + esc(c.id) + '" data-amt="' + c.remain + '" checked>' +
          '<span class="nm"><b>' + esc(c.title) + '</b><small class="' + (over ? 'over' : '') + '">납입기한 ' + dot(c.dueDate) + (over ? ' · 기한 지남' : '') + '</small></span>' +
          '<span class="amt">' + won(c.remain) + '원</span></label>';
      }).join('') + '</div>' +
      '<div class="total"><span>결제 금액</span><b id="sum">0원</b></div>' +
      '<div class="label">결제 방법</div>' +
      '<div class="methods" id="methods"><button type="button" data-m="CARD" class="on">카드 · 간편결제</button><button type="button" data-m="TRANSFER">계좌이체</button></div>' +
      (d.notice ? '<div class="notice"><b>학원 안내</b>' + esc(d.notice) + '</div>' : '') +
      '<button class="pay" id="payBtn" type="button">결제하기</button>' +
      '<div class="err" id="err"></div>' +
      '<div class="foot">결제가 끝나면 학원 수납 기록에 바로 반영됩니다. 결제 취소·환불은 학원으로 문의해 주세요.</div>';
    if (!d.payReady) { document.getElementById('payBtn').disabled = true; document.getElementById('err').textContent = '아직 온라인 결제 준비가 안 됐어요. 학원으로 문의해 주세요.'; }
    var all = document.getElementById('all');
    var cks = [].slice.call(main.querySelectorAll('.ck'));
    function sync() {
      var sum = 0, n = 0;
      cks.forEach(function (x) { if (x.checked) { sum += Number(x.dataset.amt) || 0; n++; } });
      document.getElementById('sum').textContent = won(sum) + '원';
      if (all) all.checked = n === cks.length;
      var b = document.getElementById('payBtn');
      if (d.payReady) { b.disabled = !n || state.busy; b.textContent = n ? won(sum) + '원 결제하기' : '결제할 항목을 골라 주세요'; }
    }
    cks.forEach(function (x) { x.addEventListener('change', sync); });
    if (all) all.addEventListener('change', function () { cks.forEach(function (x) { x.checked = all.checked; }); sync(); });
    document.getElementById('methods').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      state.method = b.dataset.m;
      [].forEach.call(this.querySelectorAll('button'), function (x) { x.classList.toggle('on', x === b); });
    });
    document.getElementById('payBtn').addEventListener('click', function () {
      var ids = cks.filter(function (x) { return x.checked; }).map(function (x) { return x.value; });
      if (ids.length) startPay(ids);
    });
    sync();
  }

  // ── 결제 시작: 서버에 주문 만들기 → 토스 결제창 ──
  function startPay(ids) {
    var btn = document.getElementById('payBtn'), err = document.getElementById('err');
    state.busy = true; btn.disabled = true; btn.textContent = '결제창을 여는 중...'; err.textContent = '';
    api('POST', { action: 'order', chargeIds: ids }).then(function (o) {
      if (!o.ok) throw new Error(o.msg || '주문을 만들지 못했어요.');
      if (typeof TossPayments !== 'function') throw new Error('결제 모듈을 불러오지 못했어요. 새로고침해 주세요.');
      var tp = TossPayments(o.clientKey);
      var payment = tp.payment({ customerKey: TossPayments.ANONYMOUS });
      var base = location.origin + location.pathname + '?t=' + encodeURIComponent(token);
      var req = {
        method: state.method,
        amount: { currency: 'KRW', value: o.amount },
        orderId: o.orderId,
        orderName: o.orderName,
        successUrl: base + '&r=ok',
        failUrl: base + '&r=fail',
        customerName: o.customerName || undefined,
      };
      if (state.method === 'CARD') req.card = { useEscrow: false, flowMode: 'DEFAULT', useCardPoint: false, useAppCardOnly: false };
      if (state.method === 'TRANSFER') req.transfer = { cashReceipt: { type: '소득공제' }, useEscrow: false };
      return payment.requestPayment(req);
    }).catch(function (e) {
      state.busy = false;
      // 결제창을 그냥 닫은 경우
      var cancel = e && (e.code === 'USER_CANCEL' || e.code === 'PAY_PROCESS_CANCELED');
      err.textContent = cancel ? '결제를 취소하셨어요. 다시 결제하시려면 버튼을 눌러 주세요.' : (e && e.message) || '결제를 시작하지 못했어요.';
      btn.disabled = false;
      var n = main.querySelectorAll('.ck:checked').length;
      btn.textContent = n ? '결제하기' : '결제할 항목을 골라 주세요';
      if (n) { var s = 0; [].forEach.call(main.querySelectorAll('.ck:checked'), function (x) { s += Number(x.dataset.amt) || 0; }); btn.textContent = won(s) + '원 결제하기'; }
    });
  }

  // ── 결제창에서 돌아왔을 때: 서버에 최종 승인 요청 ──
  function confirmPay() {
    var paymentKey = qs.get('paymentKey'), orderId = qs.get('orderId'), amount = Number(qs.get('amount'));
    main.innerHTML = '<div class="center"><div class="spin"></div><h2>결제를 마무리하고 있어요</h2><p>창을 닫지 말고 잠시만 기다려 주세요.</p></div>';
    api('POST', { action: 'confirm', paymentKey: paymentKey, orderId: orderId, amount: amount }).then(function (r) {
      cleanUrl();
      if (!r.ok) {
        msgView('⚠️', '결제가 완료되지 않았어요', r.msg || '결제 승인 중 문제가 생겼어요.', '<button class="btn2" onclick="location.reload()">청구 내역으로 돌아가기</button>');
        return;
      }
      main.innerHTML = '<div class="center"><div class="ic">🎉</div><h2>결제가 완료됐어요</h2>' +
        '<div class="big">' + won(r.amount) + '원</div>' +
        '<p>' + esc(r.method || '') + '</p>' +
        '<p>학원 수납 기록에 반영되었습니다. 감사합니다.</p>' +
        (r.warn ? '<p style="color:#C8352E;font-weight:700">' + esc(r.warn) + '</p>' : '') +
        (r.receiptUrl ? '<a class="btn2" href="' + esc(r.receiptUrl) + '" target="_blank" rel="noopener">결제 영수증 보기</a>' : '') +
        '</div>';
    }).catch(function () {
      msgView('⚠️', '연결이 불안정해요', '결제 완료 여부를 확인하지 못했어요. 같은 금액으로 다시 결제하지 마시고, 잠시 후 이 화면을 새로고침하거나 학원으로 문의해 주세요.',
        '<button class="btn2" onclick="location.reload()">다시 확인하기</button>');
    });
  }

  function load() {
    if (!token) { msgView('🔗', '결제 링크가 올바르지 않아요', '문자로 받으신 링크를 다시 눌러 주세요.'); return; }
    var r = qs.get('r');
    if (r === 'ok' && qs.get('paymentKey')) { confirmPay(); return; }
    var failMsg = r === 'fail' ? (qs.get('message') || '결제가 완료되지 않았어요.') : '';
    if (r) cleanUrl();
    api('GET').then(function (d) {
      if (!d.ok) { msgView('🔗', '결제 링크를 열 수 없어요', d.msg || '학원으로 문의해 주세요.'); return; }
      state.data = d; render();
      if (failMsg && document.getElementById('err')) document.getElementById('err').textContent = failMsg;
    }).catch(function () { msgView('📶', '연결이 불안정해요', '인터넷 연결을 확인하고 새로고침해 주세요.', '<button class="btn2" onclick="location.reload()">새로고침</button>'); });
  }
  load();
})();
</script>
</body>
</html>
