<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>조교 | 송우찬수학학원</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="style.css">
<style>
.admin-wrap { max-width:960px; margin:0 auto; padding:100px 24px 96px; }
.admin-header { margin-bottom:40px; display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px; }
.admin-header h1 { font-size:26px; font-weight:700; margin-bottom:6px; }
.admin-header p { font-size:13px; color:var(--muted); }
.logout-btn { padding:8px 16px; background:rgba(30,24,56,0.06); border:1px solid var(--border-soft); border-radius:8px; color:var(--muted); font-size:12px; cursor:pointer; font-family:inherit; }
.logout-btn:hover { color:var(--off-white); border-color:rgba(30,24,56,0.3); }

.admin-tabs { display:flex; gap:0; border-bottom:2px solid var(--border-soft); margin-bottom:32px; flex-wrap:wrap; }
.admin-tab {
  padding:11px 24px; background:none; border:none;
  font-size:13px; font-weight:600; font-family:inherit;
  color:var(--muted); cursor:pointer; position:relative; transition:color 0.2s;
}
.admin-tab::after {
  content:''; position:absolute; bottom:-2px; left:0; right:0;
  height:2px; background:var(--gold);
  transform:scaleX(0); transition:transform 0.2s;
}
.admin-tab.active { color:var(--purple, #5B3FA6); }
.admin-tab.active::after { transform:scaleX(1); }
.tab-panel { display:none; }
.tab-panel.active { display:block; }

.card { background:var(--bg-card); border:1px solid var(--border-soft); border-radius:14px; padding:26px; margin-bottom:20px; }
.card h3 { font-size:15px; font-weight:600; margin-bottom:18px; color:var(--purple, #5B3FA6); }

.btn { padding:10px 20px; border:none; border-radius:8px; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; transition:all 0.2s; }
.btn-primary { background:var(--gold); color:var(--on-gold, #2A1E55); }
.btn-primary:hover { background:#E0B010; }
.btn-secondary { background:rgba(30,24,56,0.08); color:var(--off-white); border:1px solid var(--border-soft); text-decoration:none; display:inline-block; }
.btn-secondary:hover { background:rgba(30,24,56,0.14); }
.btn-sm { padding:6px 13px; font-size:12px; }

.item {
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:14px 16px; background:rgba(30,24,56,0.03);
  border:1px solid var(--border-soft); border-radius:10px; margin-bottom:8px;
}
.item-name { font-weight:600; font-size:14px; flex:1; min-width:120px; }
.item-meta { font-size:12px; color:var(--muted); }
.badge { font-size:11px; background:rgba(245,197,24,0.1); color:var(--purple, #5B3FA6); padding:3px 9px; border-radius:5px; font-weight:600; }
.badge-overdue { background:rgba(214,69,69,0.15); color:#D64545; }
.empty { color:var(--muted); font-size:13px; }

@media(max-width:640px){ .admin-tabs{ overflow-x:auto; flex-wrap:nowrap; } }

/* ── 📘 답지(시중교재) — 선생님 페이지 시중교재 탭과 같은 화면 ── */
.px-toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
.px-toolbar input { flex:1 1 200px; padding:10px 13px; background:rgba(30,24,56,0.05); border:1px solid var(--border-soft); border-radius:8px; color:var(--off-white); font-size:14px; font-family:inherit; outline:none; min-width:0; }
.px-toolbar input:focus { border-color:rgba(245,197,24,0.5); }
.px-chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.px-chip { padding:6px 14px; border-radius:99px; border:1px solid var(--border-soft); background:transparent; color:var(--muted); font-size:12.5px; font-weight:600; font-family:inherit; cursor:pointer; transition:all 0.15s; }
.px-chip:hover { color:var(--off-white); }
.px-chip.on { border-color:var(--gold); color:var(--purple, #5B3FA6); background:rgba(245,197,24,0.08); }
.px-chip .n { opacity:0.6; font-weight:500; margin-left:4px; }
.px-empty { color:var(--muted); font-size:13px; padding:24px 0; text-align:center; }
.px-meta { font-size:12px; color:var(--muted); margin-bottom:6px; }
.tb-sub-chips { margin-top:-2px; }
.tb-book { border:1px solid var(--border-soft); border-radius:10px; background:rgba(30,24,56,0.025); margin-bottom:8px; overflow:hidden; }
.tb-book > summary { list-style:none; cursor:pointer; padding:13px 16px; display:flex; align-items:center; gap:10px; font-size:14.5px; font-weight:600; color:var(--off-white); }
.tb-book > summary::-webkit-details-marker { display:none; }
.tb-book > summary::after { content:'›'; margin-left:auto; color:var(--muted); transition:transform 0.15s; font-size:18px; line-height:1; }
.tb-book[open] > summary { border-bottom:1px solid var(--border-soft); }
.tb-book[open] > summary::after { transform:rotate(90deg); }
.tb-book > summary small { color:var(--muted); font-weight:500; font-size:12px; }
.tb-book > summary .tb-path { color:var(--muted); font-weight:500; font-size:12px; }
.tb-body { padding:6px 10px 10px; }
.tb-subh { font-size:11.5px; font-weight:700; color:var(--purple, #5B3FA6); letter-spacing:0.5px; margin:10px 6px 4px; }
.tb-row { display:flex; align-items:center; gap:10px; padding:8px 6px; border-radius:8px; }
.tb-row + .tb-row { border-top:1px solid rgba(30,24,56,0.04); }
.tb-row:hover { background:rgba(30,24,56,0.03); }
.tb-name { flex:1; min-width:0; font-size:13.5px; color:var(--off-white); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tb-acts { display:flex; gap:6px; flex-shrink:0; }
.tb-btn { padding:6px 12px; border-radius:7px; font-size:12px; font-weight:600; font-family:inherit; cursor:pointer; border:1px solid var(--border-soft); background:transparent; color:var(--off-white); white-space:nowrap; transition:all 0.15s; }
.tb-btn:hover { border-color:var(--gold); color:var(--purple, #5B3FA6); }
.tb-btn.dl { background:rgba(245,197,24,0.12); border-color:rgba(245,197,24,0.4); color:var(--purple, #5B3FA6); }
.tb-btn.dl:hover { background:rgba(245,197,24,0.22); }
.tb-btn:disabled { opacity:0.55; cursor:wait; }
@media (max-width:560px) { .tb-btn { padding:6px 9px; } .tb-name { font-size:13px; } }

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, getDownloadURL, listAll } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyD_eYNKzfa-aT41E3Dqt_HyJc6UeSR5ErA",
  authDomain: "songmath.firebaseapp.com",
  projectId: "songmath",
  storageBucket: "songmath.firebasestorage.app",
  messagingSenderId: "936295436575",
  appId: "1:936295436575:web:d1e201508719850cfbe02a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

window.switchTab = function(id, btn) {
  document.querySelectorAll('.admin-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + id).classList.add('active');
};

window.doLogout = async function() {
  await signOut(auth);
};

// ── 엔터키 로그인 ──
['ta-name','ta-pw'].forEach(id => {
  document.getElementById(id)?.addEventListener('keydown', e => {
    if (e.key === 'Enter') window.loginTA();
  });
});

// 조교 로그인
window.loginTA = async function() {
  const name = document.getElementById('ta-name').value.trim();
  const pw   = document.getElementById('ta-pw').value;
  const err  = document.getElementById('ta-err');
  const btn  = document.getElementById('ta-loginBtn');
  if (!name || !pw) { err.textContent = '이름과 비밀번호를 입력해주세요.'; err.style.display='block'; return; }
  btn.textContent = '로그인 중...'; btn.disabled = true;
  try {
    await signInWithEmailAndPassword(auth, name + '@songmath.kr', pw);
    err.style.display = 'none';
  } catch(e) {
    err.textContent = '이름 또는 비밀번호가 올바르지 않습니다.'; err.style.display='block';
    btn.textContent = '로그인'; btn.disabled = false;
  }
};

function esc(s) {
  return (s || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 요일그룹 판별 및 시간표 계산 (admin.html과 동일한 로직)
function ttNormTeacher(name) { return (name || '').toString().trim().replace(/T$/,''); }
function ttDaysToGroup(days) {
  const s = new Set(days || []);
  const eq = arr => arr.length === s.size && arr.every(d => s.has(d));
  if (eq(['월','수','금'])) return '월수금';
  if (eq(['화','목'])) return '화목';
  if (eq(['화','목','토'])) return '화목토';
  return null;
}
function ttGroupActiveToday(group, weekday) {
  // weekday: 0=일 ... 6=토
  // '화목'은 등록된 학생 요일이 화목뿐이라도, 방학특강 등으로 토요일 특강 블록(특정요일:'토')이 붙을 수 있어 토요일도 활성 대상에 포함
  if (group === '월수금') return [1,3,5].includes(weekday);
  if (group === '화목') return [2,4,6].includes(weekday);
  if (group === '화목토') return [2,4,6].includes(weekday);
  return false;
}
function ttGradeMatches(studentGrade, blockGrade) {
  if (blockGrade === '초등') return (studentGrade || '').startsWith('초');
  return studentGrade === blockGrade;
}
const TT_DAY_NUM = {'일':0,'월':1,'화':2,'수':3,'목':4,'금':5,'토':6};
function ttBlockActiveToday(block, weekday) {
  if (block.day) return TT_DAY_NUM[block.day] === weekday;
  return weekday !== 6 && weekday !== 0;
}
function computeCurrentClinicStudents(students, timetables) {
  const now = new Date();
  const weekday = now.getDay();
  const todayStr = now.toISOString().slice(0,10);
  const hhmm = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

  const byKey = {};
  timetables.forEach(t => {
    if (!ttGroupActiveToday(t.dayGroup, weekday)) return;
    const key = t.teacherName + '|' + t.dayGroup;
    if (t.scheduleType === 'vacation') {
      if (t.validFrom && t.validTo && todayStr >= t.validFrom && todayStr <= t.validTo) byKey[key] = t;
    } else {
      if (!byKey[key] || byKey[key].scheduleType !== 'vacation') byKey[key] = t;
    }
  });

  const active = Object.values(byKey);
  const nowResults = [];
  const upcomingResults = [];
  active.forEach(t => {
    (t.blocks || []).forEach(b => {
      if (b.type !== 'clinic') return;
      if (!ttBlockActiveToday(b, weekday)) return;
      const isNow = hhmm >= b.start && hhmm < b.end;
      const isUpcoming = b.start > hhmm;
      if (!isNow && !isUpcoming) return;
      students.forEach(s => {
        if (ttNormTeacher(s.teacherName) !== ttNormTeacher(t.teacherName)) return;
        if (ttDaysToGroup(s.days) !== t.dayGroup) return;
        if (!ttGradeMatches(s.grade, b.grade)) return;
        const row = { name: s.name, grade: s.grade, classGroup: s.classGroup, teacherName: s.teacherName, startTime: b.start, endTime: b.end };
        if (isNow) nowResults.push(row); else upcomingResults.push(row);
      });
    });
  });
  upcomingResults.sort((a,b) => a.startTime.localeCompare(b.startTime));
  return { now: nowResults, upcoming: upcomingResults };
}

// 클리닉실 현황 (시간표 기반 자동 계산)
window.loadClinicRoom = async function() {
  const el = document.getElementById('crList');
  const upEl = document.getElementById('crUpcomingList');
  el.innerHTML = '<div class="empty">불러오는 중...</div>';
  upEl.innerHTML = '<div class="empty">불러오는 중...</div>';
  let students = [], timetables = [];
  try {
    const [studentsSnap, timetablesSnap] = await Promise.all([
      getDocs(collection(db, 'students')),
      getDocs(collection(db, 'timetables'))
    ]);
    studentsSnap.forEach(d => students.push({ id: d.id, ...d.data() }));
    timetablesSnap.forEach(d => timetables.push({ id: d.id, ...d.data() }));
  } catch (e) {
    const errMsg = `<div class="empty" style="color:#D64545;">불러오지 못했습니다. (${esc(e.message)})<br>원장님께 권한 설정(Firestore 보안규칙) 확인을 요청해주세요.</div>`;
    el.innerHTML = errMsg;
    upEl.innerHTML = errMsg;
    return;
  }

  const { now: nowRows, upcoming: upRows } = computeCurrentClinicStudents(students, timetables);

  document.getElementById('crCount').textContent = nowRows.length;
  if (!nowRows.length) { el.innerHTML = '<div class="empty">지금 이 시간에 클리닉인 학생이 없습니다.</div>'; }
  else {
    el.innerHTML = nowRows.map(r => `
      <div class="item">
        <div class="item-name">${esc(r.name)}</div>
        <span class="item-meta">${esc(r.grade)}</span>
        <span class="item-meta">${esc(r.classGroup)}</span>
        <span class="item-meta">${esc(r.teacherName)}</span>
        <span class="badge">~${esc(r.endTime)}</span>
      </div>`).join('');
  }

  document.getElementById('crUpcomingCount').textContent = upRows.length;
  if (!upRows.length) { upEl.innerHTML = '<div class="empty">오늘 예정된 클리닉이 더 없습니다.</div>'; }
  else {
    upEl.innerHTML = upRows.map(r => `
      <div class="item">
        <div class="item-name">${esc(r.name)}</div>
        <span class="item-meta">${esc(r.grade)}</span>
        <span class="item-meta">${esc(r.classGroup)}</span>
        <span class="item-meta">${esc(r.teacherName)}</span>
        <span class="badge">${esc(r.startTime)}~${esc(r.endTime)}</span>
      </div>`).join('');
  }
};

// 숙제 확인
// 관리자가 올린 날짜(요일)에 따라, 같은 요일그룹의 다음 등원일이 되어야 노출됨
// (예: 화요일에 올린 화목반 숙제 → 목요일에 노출 / 월요일에 올린 월수금반 숙제 → 수요일에 노출)
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

window.loadHomework = async function() {
  const el = document.getElementById('hwList');
  el.innerHTML = '<div class="empty">불러오는 중...</div>';
  const snap = await getDocs(query(collection(db, 'homeworks'), orderBy('createdAt', 'desc')));
  const rows = [];
  snap.forEach(d => rows.push({ id: d.id, ...d.data() }));
  const today = todayStr();
  // targetDate가 있으면 그 날짜부터 노출, 없는(기존) 자료는 그냥 노출

    <div class="item">

};

// ══════════════════════════════════════
// 🗂 답지 = 시중교재 — 선생님 페이지 "시중교재" 탭과 같은 자료·같은 화면
// Firebase Storage 경로: textbooks/학교급/(학년/)교재/(하위폴더/)파일.pdf
// (업로드·삭제는 관리자 페이지 "시중교재" 탭, 조교는 열람만)
// ══════════════════════════════════════
const TB_LEVEL_ORDER = ['초등', '중등', '고등'];
const TB_GRADE_RE = /^(초|중|고)\s*[1-6]/;
const PX_GRADE_ORDER = ['중1','중2','중3','고1','고2','고3'];
let tbFiles = null;   // [{ level, grade, book, sub, name, path }]
const tbState = { level: '', grade: '', q: '' };

function pxOrderSort(order) {
  return (a, b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    if (ia !== -1 || ib !== -1) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    return a.localeCompare(b, 'ko');
  };
}
function pxEsc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function tbParse(fullPath) {
  const parts = fullPath.split('/').slice(1);   // 'textbooks' 제거
  const name = parts.pop();
  const level = parts[0] || '기타';
  let grade = '', rest = parts.slice(1);
  if (rest.length && TB_GRADE_RE.test(rest[0])) { grade = rest[0]; rest = rest.slice(1); }
  return { level, grade, book: rest[0] || '(분류 없음)', sub: rest.slice(1).join(' / '), name, path: fullPath };
}

window.initTextbooksTab = async function (force = false) {
  const list = document.getElementById('tbList');
  if (tbFiles && !force) { tbRender(); return; }
  list.innerHTML = '<div class="px-empty">불러오는 중...</div>';
  const files = [];
  async function walk(r) {
    const res = await listAll(r);
    res.items.forEach(it => { if (/\.pdf$/i.test(it.name)) files.push(tbParse(it.fullPath)); });
    await Promise.all(res.prefixes.map(walk));
  }
  try { await walk(ref(storage, 'textbooks')); }
  catch (e) {
    tbFiles = null;
    list.innerHTML = `<div class="px-empty">목록을 불러오지 못했습니다 (${pxEsc(e.code || e.message)})</div>`;
    return;
  }
  tbFiles = files;
  tbRender();
};
window.tbSetLevel = function (lv) { tbState.level = lv; tbState.grade = ''; tbRender(); };
window.tbSetGrade = function (g) { tbState.grade = g; tbRender(); };
window.tbSetQuery = function (q) { tbState.q = q.trim().toLowerCase(); if (tbFiles) tbRender(); };

function tbSortName(a, b) { return a.localeCompare(b, 'ko', { numeric: true }); }

function tbRender() {
  const list = document.getElementById('tbList');
  const lvBox = document.getElementById('tbLevelChips');
  const gBox = document.getElementById('tbGradeChips');
  if (!tbFiles) return;
  if (!tbFiles.length) { lvBox.innerHTML = gBox.innerHTML = ''; list.innerHTML = '<div class="px-empty">아직 올라온 교재가 없습니다.</div>'; return; }

  const bookKey = f => f.level + '\u0000' + f.grade + '\u0000' + f.book;
  const countBooks = arr => new Set(arr.map(bookKey)).size;
  const chip = (label, active, onclick, n) =>
    `<button class="px-chip${active ? ' on' : ''}" onclick="${onclick}">${pxEsc(label)}<span class="n">${n}</span></button>`;

  // ① 학교급
  const levels = [...new Set(tbFiles.map(f => f.level))].sort(pxOrderSort(TB_LEVEL_ORDER));
  if (!levels.includes(tbState.level)) tbState.level = levels.includes('중등') ? '중등' : levels[0];
  lvBox.innerHTML = levels.map(lv => chip(lv, tbState.level === lv, `tbSetLevel('${pxEsc(lv)}')`, countBooks(tbFiles.filter(f => f.level === lv)))).join('');

  // ② 학년 (학교급 아래에 학년 폴더가 있는 경우만)
  const inLevel = tbFiles.filter(f => f.level === tbState.level);
  const grades = [...new Set(inLevel.map(f => f.grade).filter(Boolean))].sort(pxOrderSort(PX_GRADE_ORDER.concat(['초1','초2','초3','초4','초5','초6'])));
  if (grades.length) {
    if (!grades.includes(tbState.grade)) tbState.grade = grades[0];
    gBox.style.display = '';
    gBox.innerHTML = grades.map(g => chip(g, tbState.grade === g, `tbSetGrade('${pxEsc(g)}')`, countBooks(inLevel.filter(f => f.grade === g)))).join('');
  } else { tbState.grade = ''; gBox.style.display = 'none'; gBox.innerHTML = ''; }

  // ③ 교재 목록 (검색 중이면 전체에서 찾기)
  const q = tbState.q;
  let shown, searching = !!q;
  if (searching) {
    shown = tbFiles.filter(f => (f.book + ' ' + f.sub + ' ' + f.name).toLowerCase().includes(q));
    lvBox.style.opacity = gBox.style.opacity = '0.45';
  } else {
    shown = inLevel.filter(f => !grades.length || f.grade === tbState.grade);
    lvBox.style.opacity = gBox.style.opacity = '';
  }
  if (!shown.length) { list.innerHTML = `<div class="px-empty">${searching ? '검색 결과가 없습니다.' : '교재가 없습니다.'}</div>`; return; }

  const books = {};
  shown.forEach(f => { (books[bookKey(f)] = books[bookKey(f)] || []).push(f); });
  const keys = Object.keys(books).sort((a, b) => {
    const [la, ga, ba] = a.split('\u0000'), [lb, gb, bb] = b.split('\u0000');
    return pxOrderSort(TB_LEVEL_ORDER)(la, lb) || pxOrderSort(PX_GRADE_ORDER)(ga, gb) || tbSortName(ba, bb);
  });
  const head = searching
    ? `<div class="px-meta">검색 결과 · 교재 ${keys.length}종 · 파일 ${shown.length}개</div>`
    : `<div class="px-meta">${pxEsc(tbState.level)}${tbState.grade ? ' · ' + pxEsc(tbState.grade) : ''} · 교재 ${keys.length}종 · 교재를 누르면 파일이 펼쳐집니다</div>`;
  list.innerHTML = head + keys.map(k => {
    const fs = books[k];
    const f0 = fs[0];
    const subs = {};
    fs.forEach(f => { (subs[f.sub] = subs[f.sub] || []).push(f); });
    const subKeys = Object.keys(subs).sort(tbSortName);
    const row = f => `<div class="tb-row">
        <span class="tb-name" title="${pxEsc(f.name)}">📄 ${pxEsc(f.name.replace(/\.pdf$/i, ''))}</span>
        <span class="tb-acts">
          <button class="tb-btn" data-path="${pxEsc(f.path)}" onclick="pxOpen(this.dataset.path)">미리보기</button>
          <button class="tb-btn dl" data-path="${pxEsc(f.path)}" onclick="tbDownload(this)">다운로드</button>
        </span></div>`;
    const body = subKeys.map(s => (s ? `<div class="tb-subh">${pxEsc(s)}</div>` : '') +
      subs[s].sort((a, b) => tbSortName(a.name, b.name)).map(row).join('')).join('');
    const where = searching ? `<span class="tb-path">${pxEsc(f0.level)}${f0.grade ? ' · ' + pxEsc(f0.grade) : ''}</span>` : '';
    return `<details class="tb-book"${searching ? ' open' : ''}><summary>📘 ${pxEsc(f0.book)} <small>${fs.length}개</small>${where}</summary>
      <div class="tb-body">${body}</div></details>`;
  }).join('');
}

// 미리보기: 새 창에서 PDF 열기
window.pxOpen = async function (path) {
  const w = window.open('', '_blank');
  try {
    const url = await getDownloadURL(ref(storage, path));
    if (w) w.location.href = url; else location.href = url;
  } catch (e) {
    if (w) w.close();
    alert('파일을 열지 못했습니다 (' + (e.code || e.message) + ')');
  }
};

// 다운로드: 원래 파일명으로 저장. 브라우저가 막으면 버튼이 "눌러서 열기"로 바뀜
window.tbDownload = async function (btn) {
  if (btn.dataset.url) { window.open(btn.dataset.url, '_blank'); return; }
  const path = btn.dataset.path;
  const name = path.split('/').pop();
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = '받는 중...';
  let url = '';
  try {
    url = await getDownloadURL(ref(storage, path));
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    btn.textContent = label;
  } catch (e) {
    if (url) { btn.dataset.url = url; btn.textContent = '눌러서 열기'; }
    else { btn.textContent = label; alert('파일을 받지 못했습니다 (' + (e.code || e.message) + ')'); }
  } finally { btn.disabled = false; }
};

window.loadTasks = async function() {

// 로그인은 통합 로그인 페이지(login.html)에서 — 로그인 안 된 상태로 들어오면 그쪽으로 이동
function showLogin()  { document.getElementById('portalScreen').style.display='none'; location.replace('login.html'); }
function showPortal() { document.getElementById('loginScreen').style.display='none';  document.getElementById('portalScreen').style.display='block'; }

// 조교 권한 확인
onAuthStateChanged(auth, async (user) => {
  if (!user) { showLogin(); return; }
  const tDoc = await getDoc(doc(db, 'teachers', user.uid));
  if (!tDoc.exists() || tDoc.data().role !== 'ta') {
    await signOut(auth);
    showLogin();
    return;
  }
  document.getElementById('taName').textContent = `${tDoc.data().name} 조교님 · ${tDoc.data().branch || ''}`;
  showPortal();
  await Promise.all([loadClinicRoom(), loadHomework(), loadTasks(), loadTaMyboxLink()]);
});
