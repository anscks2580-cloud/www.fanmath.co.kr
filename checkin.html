<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출석 체크 | 송우찬수학학원</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mobile.css?v=1">
<style>
body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
.ck-wrap { width:100%; max-width:400px; }
.ck-card { background:#fff; border:1px solid var(--border); border-radius:22px; padding:30px 24px 26px; box-shadow:0 20px 60px rgba(30,24,56,.12); text-align:center; }
.ck-logo { width:64px; height:64px; border-radius:16px; box-shadow:0 4px 14px rgba(0,0,0,.12); }
.ck-title { font-size:22px; font-weight:800; margin:14px 0 4px; letter-spacing:-.5px; }
.ck-who { font-size:14px; color:var(--muted); margin-bottom:22px; }
.ck-who b { color:var(--purple); }
.ck-code { display:flex; gap:10px; justify-content:center; margin-bottom:16px; }
.ck-code input { width:100%; max-width:220px; font-size:34px; font-weight:800; letter-spacing:14px; text-align:center; padding:14px 10px 14px 24px; border:2px solid rgba(91,63,166,.25); border-radius:16px; outline:none; font-family:inherit; color:var(--off-white); background:#FAF8FF; }
.ck-code input:focus { border-color:var(--purple); box-shadow:0 0 0 4px rgba(91,63,166,.12); }
.ck-hint { font-size:12.5px; color:var(--muted); margin-bottom:18px; }
.ck-btn { width:100%; padding:16px; border:0; border-radius:14px; background:var(--purple); color:#fff; font-size:16.5px; font-weight:800; font-family:inherit; cursor:pointer; }
.ck-btn[disabled] { opacity:.6; cursor:default; }
.ck-err { color:#C8541F; font-size:13.5px; margin-top:12px; min-height:20px; }
.ck-done { padding:10px 0 4px; }
.ck-done .big { width:84px; height:84px; margin:0 auto 14px; border-radius:50%; background:#22B07D; color:#fff; font-size:46px; font-weight:900; display:flex; align-items:center; justify-content:center; animation:ckPop .45s cubic-bezier(.2,.9,.3,1.5); box-shadow:0 10px 30px rgba(34,176,125,.35); }
.ck-done .t { font-size:20px; font-weight:800; }
.ck-done .s { font-size:13.5px; color:var(--muted); margin-top:6px; line-height:1.6; }
.ck-link { display:block; margin-top:20px; font-size:13.5px; color:var(--purple); font-weight:700; text-decoration:none; }
@keyframes ckPop { from { transform:scale(0); } to { transform:scale(1); } }
</style>
<!-- 앱 설치(PWA) -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#4B3391">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="송우찬수학">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<script src="/pwa.js?v=7" defer></script>
</head>
<body>
<div class="ck-wrap">
  <div class="ck-card" id="ck">
    <img class="ck-logo" src="/assets/icons/apple-touch-icon.png" alt="">
    <div class="ck-title">출석 체크</div>
    <div class="ck-who" id="ckWho">확인 중…</div>
  </div>
  <a class="ck-link" href="index.html" style="text-align:center;">← 홈으로</a>
</div>

<script type="module">
// ══════════════════════════════════════
// 학생 출석 체크 (출결코드 방식)
//  · 관리자 페이지 「학생 출결」에서 그날 발급한 4자리 출결코드를 입력하면 출석 기록(attendance)이 생김
//  · 기록이 생기면 서버(학부모알림 함수)가 학부모 휴대폰으로 「등원 알림」을 보냄
//  · 하루에 한 번만 (문서 id = 학생uid_날짜)
// ══════════════════════════════════════
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyD_eYNKzfa-aT41E3Dqt_HyJc6UeSR5ErA",
  authDomain: "songmath.firebaseapp.com",
  projectId: "songmath",
  storageBucket: "songmath.firebasestorage.app",
  messagingSenderId: "936295436575",
  appId: "1:936295436575:web:d1e201508719850cfbe02a"
});
const auth = getAuth(app), db = getFirestore(app);
const $ck = document.getElementById('ck');
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let me = null, stu = null;

function todayKST() {
  const k = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
  return `${k.getFullYear()}-${String(k.getMonth() + 1).padStart(2, '0')}-${String(k.getDate()).padStart(2, '0')}`;
}
function nowKST() {
  return new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Seoul' });
}
const head = () => `<img class="ck-logo" src="/assets/icons/apple-touch-icon.png" alt=""><div class="ck-title">출석 체크</div>
  <div class="ck-who">${esc(stu.branch || '')} · ${esc(stu.grade || '')} <b>${esc(stu.name || '')}</b> 학생</div>`;

function showDone(time, already) {
  $ck.innerHTML = head() + `<div class="ck-done"><div class="big">✓</div>
    <div class="t">${already ? '오늘 이미 출석했어요' : '출석 완료!'}</div>
    <div class="s">${time ? esc(time) + ' 출석' : ''}${already ? '' : '<br>학부모님께 등원 알림이 전송돼요.'}</div></div>`;
}
function showForm() {
  $ck.innerHTML = head() + `
    <div class="ck-code"><input id="ckCode" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="0000"></div>
    <div class="ck-hint">선생님이 알려주신 오늘의 출결코드 4자리를 입력하세요.</div>
    <button class="ck-btn" id="ckBtn">출석하기</button>
    <div class="ck-err" id="ckErr"></div>`;
  const inp = document.getElementById('ckCode');
  inp.focus();
  inp.addEventListener('input', () => { inp.value = inp.value.replace(/\D/g, '').slice(0, 4); });
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  document.getElementById('ckBtn').onclick = submit;
}

async function submit() {
  const btn = document.getElementById('ckBtn'), err = document.getElementById('ckErr');
  const code = document.getElementById('ckCode').value.trim();
  err.textContent = '';
  if (code.length !== 4) { err.textContent = '4자리 숫자를 입력해 주세요.'; return; }
  btn.disabled = true; btn.textContent = '확인 중…';
  try {
    const today = todayKST();
    const cs = await getDoc(doc(db, 'settings', 'dailyCode'));
    if (!cs.exists() || cs.data().date !== today) throw new Error('오늘 출결코드가 아직 발급되지 않았어요. 선생님께 말씀해 주세요.');
    if (String(cs.data().code) !== code) throw new Error('출결코드가 맞지 않아요. 다시 확인해 주세요.');
    const time = nowKST();
    await setDoc(doc(db, 'attendance', `${me.uid}_${today}`), {
      uid: me.uid, name: stu.name || '', branch: stu.branch || '', grade: stu.grade || '', classGroup: stu.classGroup || '',
      date: today, time, method: 'code', createdAt: serverTimestamp(),
    });
    showDone(time, false);
  } catch (e) {
    // 이미 오늘 기록이 있으면 덮어쓰기가 막혀 권한 오류가 남 → 이미 출석으로 안내
    if (e && e.code === 'permission-denied') {
      try { const a = await getDoc(doc(db, 'attendance', `${me.uid}_${todayKST()}`)); if (a.exists()) { showDone(a.data().time, true); return; } } catch (x) {}
    }
    err.textContent = e.message && !e.code ? e.message : '출석하지 못했어요. 잠시 후 다시 시도해 주세요.';
    btn.disabled = false; btn.textContent = '출석하기';
  }
}

onAuthStateChanged(auth, async (user) => {
  if (!user) { location.replace('login.html' + (location.search.includes('app=1') ? '?app=1' : '')); return; }
  me = user;
  try {
    const sd = await getDoc(doc(db, 'students', user.uid));
    if (!sd.exists()) { $ck.innerHTML = `<div class="ck-title">출석 체크</div><div class="ck-who" style="margin-top:10px;">학생 계정으로 로그인해야 출석할 수 있어요.</div>`; return; }
    stu = sd.data();
    const a = await getDoc(doc(db, 'attendance', `${user.uid}_${todayKST()}`));
    if (a.exists()) showDone(a.data().time, true); else showForm();
  } catch (e) {
    $ck.innerHTML = `<div class="ck-title">출석 체크</div><div class="ck-err">불러오지 못했어요: ${esc(e.message)}</div>`;
  }
});
</script>
</body>
</html>
