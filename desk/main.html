<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>송우찬수학학원 업무시스템</title>
<link rel="icon" href="/assets/icons/icon-192.png">
<link rel="stylesheet" href="desk.css?v=2">
<script src="/session-limit.js?v=3"></script>
<style>
body{display:flex;height:100vh;overflow:hidden;background:#fff}
/* ── 왼쪽 사이드바 ── */
.sd{width:188px;flex:0 0 188px;background:#2E2160;color:#fff;display:flex;flex-direction:column;padding:10px 0 10px}
.sd-search{display:flex;margin:0 10px 10px;background:#fff;height:28px;border:1px solid #1E1545}
.sd-search input{flex:1;border:0;outline:none;padding:0 7px;color:var(--ink);min-width:0}
.sd-search button{width:28px;border:0;background:#fff;color:var(--p2);font-size:12px}
.sd-nav button{display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 14px;border:0;border-left:3px solid transparent;background:transparent;color:#E4E0F2;font-size:12px;text-align:left}
.sd-nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.sd-nav button.on{background:rgba(255,255,255,.12);border-left-color:var(--g);color:#fff;font-weight:700}
.sd-nav button .ic{width:14px;text-align:center;font-size:11px;opacity:.85}
.sd-nav button .bd{margin-left:auto;min-width:18px;height:16px;padding:0 5px;background:var(--g);color:#1F1F27;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center}
.sd-nav button .bd.show{display:inline-flex}
.sd-line{height:1px;background:rgba(255,255,255,.14);margin:8px 0}
.sd-sp{flex:1}
.sd-foot{display:flex;align-items:center;gap:8px;padding:10px 12px 0;border-top:1px solid rgba(255,255,255,.14)}
.sd-foot img{width:34px;height:34px;border-radius:50%;background:#fff}
.sd-foot .tx{font-size:10.5px;line-height:1.5;color:#CFC9E4}
.sd-foot .tx b{font-size:11.5px;color:#fff}
/* ── 가운데 ── */
.mn{flex:1;min-width:0;display:flex;flex-direction:column}
.tp{height:40px;flex:0 0 40px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line2);background:#fff}
.tp .who{font-size:13px;font-weight:700}
.tp .who small{display:inline-block;margin-left:6px;padding:1px 6px;border:1px solid var(--p3);color:var(--p2);font-size:11px;font-weight:700}
.tp .sp{flex:1}
.tp .clock{font-weight:700;color:#3A3848;font-size:12px;font-variant-numeric:tabular-nums}
.brsel{display:flex;border:1px solid var(--line)}
.brsel button{border:0;border-left:1px solid var(--line);background:#fff;padding:3px 10px;font-weight:700;color:var(--mut);font-size:11.5px}
.brsel button:first-child{border-left:0}
.brsel button.on{background:var(--p2);color:#fff}
.brsel button.on[data-b="산본관"]{background:var(--g);color:#1F1F27}
.body{flex:1;display:flex;min-height:0}
.body[hidden]{display:none}
/* ── 탭 (메뉴판 · 연 메뉴들) ── */
.tabs{height:30px;flex:0 0 30px;display:flex;align-items:flex-end;gap:2px;padding:0 10px;background:#E9E8EF;border-bottom:1px solid #B9B6C6;overflow-x:auto;overflow-y:hidden}
.tabs::-webkit-scrollbar{height:0}
.tab{display:flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 11px;border:1px solid #C3C0CF;border-bottom:0;background:#F4F4F7;color:#4A4858;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;flex:0 0 auto;max-width:200px}
.tab .tl{overflow:hidden;text-overflow:ellipsis}
.tab:hover{background:#fff}
.tab.on{background:#fff;color:var(--p2);border-color:#B9B6C6;border-top:2px solid var(--p2);height:28px;margin-bottom:-1px}
.tab.home{padding-right:11px}
.tab .x{width:16px;height:16px;border:0;background:none;color:#9A97A8;font-size:11px;line-height:16px;padding:0}
.tab .x:hover{background:#C8352E;color:#fff}
.work{flex:1;min-height:0;position:relative;background:#fff}
.work[hidden]{display:none}
.work iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.work iframe[hidden]{display:none}
/* ── 안쪽 창 (일일종합현황) — 업무시스템 화면 밖으로 못 나감 ── */
.mn{position:relative}
.mdi{position:absolute;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.iw{position:absolute;display:flex;flex-direction:column;background:#fff;border:1px solid #2E2160;box-shadow:0 6px 24px rgba(20,16,40,.28);pointer-events:auto;min-width:360px;min-height:260px;resize:both;overflow:hidden}
.iw[hidden]{display:none}
.iw-h{height:28px;flex:0 0 28px;display:flex;align-items:center;gap:6px;padding-left:9px;background:#2E2160;color:#fff;cursor:move;user-select:none}
.iw.back .iw-h{background:#5C557A}
.iw-h .t{flex:1;font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iw-h button{width:34px;height:28px;border:0;background:transparent;color:#fff;font-size:12px}
.iw-h button:hover{background:rgba(255,255,255,.15)}
.iw-h button.x:hover{background:#C8352E}
.iw-b{flex:1;position:relative;min-height:0}
.iw-b iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.iw.max{left:0!important;top:0!important;width:100%!important;height:100%!important;resize:none}
.mdi.dragging iframe{pointer-events:none}
.board{flex:1;min-width:0;overflow:auto;padding:14px 16px 24px}
.board h2{margin:0 0 10px;font-size:12px;color:var(--mut);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px 14px}
.grp{min-width:0}
.grp .hd{display:flex;align-items:center;height:24px;padding:0 8px;color:#fff;font-weight:700;font-size:12.5px;margin-bottom:4px}
.grp .it{display:flex;align-items:center;gap:4px;width:100%;padding:3px 6px;border:0;background:none;text-align:left;font-size:12.5px;color:#26242F}
.grp .it:hover{background:var(--pl);color:var(--p2);text-decoration:underline}
.grp .it .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp .it .tag{font-size:10px;color:var(--gd);font-weight:700}
.grp .it .st{opacity:0;color:#B9B6C6;font-size:12px}
.grp .it:hover .st{opacity:1}
.grp .it .st.on{opacity:1;color:#E0A800}
.grp .it.hit{background:var(--gl)}
.grp .it.dim{opacity:.28}
.empty{padding:28px;text-align:center;color:var(--mut);border:1px dashed var(--line)}
.favs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.fav{display:flex;flex-direction:column;gap:2px;padding:9px 11px;border:1px solid var(--line2);border-left:3px solid var(--p2);background:#fff;text-align:left}
.fav:hover{border-color:var(--p3);background:var(--pll)}
.fav b{font-size:12.5px}.fav small{font-size:11px}
/* ── 오른쪽 ── */
.rt{width:220px;flex:0 0 220px;padding:14px 14px 14px 0;overflow:auto;display:flex;flex-direction:column;gap:6px}
.card{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:1px solid var(--line2);border-left:4px solid var(--p2);background:#fff;padding:8px 10px;text-align:left;position:relative}
.card[hidden]{display:none}
.card:hover{background:var(--pll);border-color:var(--p3)}
.card b{font-size:12.5px;margin-bottom:2px}
.card small{font-size:11px;color:var(--mut);line-height:1.4}
.card .em{display:none}
.card .n{position:absolute;right:8px;top:8px;background:#C8352E;color:#fff;font-size:10px;font-weight:700;padding:0 5px;display:none}
.card .n.show{display:block}
.c1{border-left-color:#4B3391}.c2{border-left-color:#E0A800}.c3{border-left-color:#2463B8}.c4{border-left-color:#23864A}.c5{border-left-color:#3A3848}
.sched{border:1px solid var(--line2);background:#fff}
.sched .h{font-weight:700;padding:6px 9px;border-bottom:1px solid var(--line2);background:#F7F7FA;display:flex;justify-content:space-between;font-size:12px}
.sched #sched{padding:2px 9px 4px}
.sched .ev{font-size:11.5px;padding:4px 0;border-top:1px solid #EEEDF2;display:flex;gap:6px}
.sched .ev:first-child{border-top:0}
.sched .ev .tm{color:var(--mut);flex:0 0 34px}
.sched .none{font-size:11.5px;color:var(--mut);padding:5px 0}
</style>
</head>
<body>
<aside class="sd">
  <div class="sd-search"><input id="q" placeholder="메뉴 검색 (Ctrl+K)" autocomplete="off"><button id="qBtn" title="검색">🔍</button></div>
  <nav class="sd-nav">
    <button class="on" data-view="all"><span class="ic">■</span>모든 메뉴 보기</button>
    <button data-view="fav"><span class="ic">★</span>나의 메뉴</button>
    <button data-view="recent"><span class="ic">◷</span>최근 사용</button>
    <div class="sd-line"></div>
    <button data-act="today"><span class="ic">▤</span>일일종합현황</button>
    <button data-act="chat"><span class="ic">✉</span>메신저<span class="bd" id="sdUnread"></span></button>
    <button data-act="web"><span class="ic">□</span>홈페이지 원래 화면</button>
    <div class="sd-line"></div>
    <button data-act="logout"><span class="ic">⎋</span>로그아웃</button>
  </nav>
  <div class="sd-sp"></div>
  <div class="sd-foot">
    <img src="/assets/icons/splash-logo.png" alt="">
    <div class="tx"><b>송우찬수학학원</b><br>평촌관 031-386-8899<br>산본관 031-346-8899</div>
  </div>
</aside>

<main class="mn">
  <div class="tp">
    <div class="who" id="who">불러오는 중…</div>
    <span class="sp"></span>
    <div class="brsel" id="brsel" title="일일종합현황·메신저에서 먼저 볼 관">
      <button data-b="전체">전체</button><button data-b="평촌관">평촌관</button><button data-b="산본관">산본관</button>
    </div>
    <div class="clock" id="clock"></div>
  </div>
  <div class="mdi" id="mdi"></div>
  <div class="tabs" id="tabs"></div>
  <div class="work" id="work" hidden></div>
  <div class="body" id="boardView">
    <section class="board" id="board"></section>
    <aside class="rt">
      <div class="box" style="display:contents">
        <button class="card c1" data-act="today"><b>일일종합현황</b><small>오늘 학생·출결·상담·보고 현황을<br>한 화면에서</small><span class="em">📊</span></button>
        <button class="card c2" data-act="chat"><b>메신저</b><small>선생님 · 관리부 · 조교<br>파일 보내기 · 3개월 보관</small><span class="em">💬</span><span class="n" id="cardUnread"></span></button>
        <div class="sched"><div class="h"><span>오늘 일정</span><span id="schedDate" class="mut"></span></div><div id="sched"><div class="none">불러오는 중…</div></div></div>
        <button class="card c3" data-act="web"><b>홈페이지 원래 화면</b><small id="webSub">관리자 페이지를 통째로 열기</small><span class="em">🖥</span></button>
        <button class="card c5" data-act="director" id="cardDirector" hidden><b>원장 보고</b><small>원장 전용 보고 화면</small><span class="em">👑</span></button>
        <button class="card c4" data-act="site"><b>학원 홈페이지</b><small>www.fanmath.co.kr</small><span class="em">🏫</span></button>
      </div>
    </aside>
  </div>
</main>

<script type="module">
import { auth, db, APP, IN_PROGRAM, requireStaff, signOut, collection, doc, getDocs, query, where, onSnapshot,
  esc, ymd, pad, normBr, openWork, openDeskWindow, toast } from './desk-fb.js?v=4';
import { ADMIN_GROUPS, ROLE_PRESETS, TEACHER_GROUPS, TA_GROUPS } from './menu.js?v=5';

const $ = (id) => document.getElementById(id);
let P = null, GROUPS = [], PAGE = 'admin.html', view = 'all';
const FAV_KEY = () => 'swc_desk_fav_' + P.uid, REC_KEY = () => 'swc_desk_recent_' + P.uid;
const readArr = (k) => { try { const a = JSON.parse(localStorage.getItem(k) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } };
const writeArr = (k, a) => { try { localStorage.setItem(k, JSON.stringify(a)); } catch (e) {} };

// 시계
setInterval(tick, 1000); tick();
function tick() { const d = new Date(), h = d.getHours(); $('clock').textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]}) ${h < 12 ? '오전' : '오후'} ${pad(h % 12 || 12)}:${pad(d.getMinutes())}`; }

// 관 선택 (일일종합현황 · 메신저에서 먼저 볼 관)
let br = localStorage.getItem('swc_desk_branch') || '전체';
function paintBr() { $('brsel').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.b === br)); }
$('brsel').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; br = b.dataset.b; localStorage.setItem('swc_desk_branch', br); paintBr(); APP && APP.broadcast && APP.broadcast('branch', br); try { const f = window.deskInner && window.deskInner.frame('today'); f && f.contentWindow.postMessage({ branch: br }, location.origin); } catch (e) {} });
paintBr();

requireStaff((p, user) => {
  // 원래 홈페이지 화면과 같은 8시간 자동 로그아웃 규칙 (프로그램 안에서는 session-limit.js 가 알아서 건너뜀)
  if (window.swcSessionGuard && window.swcSessionGuard(user, () => logout(true))) return;
  P = p;
  PAGE = p.kind === 'admin' ? 'admin.html' : p.kind === 'ta' ? 'ta.html' : 'teacher.html';
  if (p.kind === 'admin') {
    const vis = p.menuGroups.length ? p.menuGroups : ROLE_PRESETS[p.role];
    GROUPS = ADMIN_GROUPS.filter((g) => g.id === 'home' || !vis || vis.includes(g.id))
      .map((g) => ({ ...g, items: g.items.filter((m) => !m.emails || m.emails.includes(p.email)) }));
  } else GROUPS = p.kind === 'ta' ? TA_GROUPS : TEACHER_GROUPS;
  $('who').innerHTML = `${esc(p.name)} ${p.kind === 'admin' ? '' : '선생님'}<small>${esc(p.roleLabel)}</small>`;
  $('webSub').textContent = p.kind === 'admin' ? '관리자 페이지를 메뉴째 열기' : p.kind === 'ta' ? '조교 페이지를 메뉴째 열기' : '선생님 페이지를 메뉴째 열기';
  $('cardDirector').hidden = !p.director;
  document.title = `송우찬수학학원 업무시스템 — ${p.name}`;
  render();
  loadSchedule();
  watchUnread();
  if (new URLSearchParams(location.search).get('start') === '1') { inner.mount('today', true, '?auto=1'); history.replaceState(null, '', 'main.html'); }
});

/* ── 안쪽 창 관리: 업무시스템 화면 안에서만 움직이고, 밖으로 빠져나가지 않음 ── */
const inner = (() => {
  const W = {};   // name → { el, frame }
  const DEF = {
    today: { title: '일일종합현황', src: 'today.html', w: 1180, h: 760, pos: 'center' },
  };
  let z = 40;
  const box = () => $('mdi').getBoundingClientRect();
  function clamp(el) {
    if (el.classList.contains('max')) return;
    const b = box(); const w = Math.min(el.offsetWidth, b.width), h = Math.min(el.offsetHeight, b.height);
    if (el.offsetWidth > b.width) el.style.width = b.width + 'px';
    if (el.offsetHeight > b.height) el.style.height = b.height + 'px';
    el.style.left = Math.max(0, Math.min(parseFloat(el.style.left) || 0, b.width - w)) + 'px';
    el.style.top = Math.max(0, Math.min(parseFloat(el.style.top) || 0, b.height - h)) + 'px';
  }
  function front(el) { el.style.zIndex = ++z; Object.values(W).forEach((x) => x.el.classList.toggle('back', x.el !== el)); }
  function mount(name, show, q) {
    if (W[name]) { if (show) open(name); return W[name]; }
    const d = DEF[name], b = box();
    const el = document.createElement('div'); el.className = 'iw'; el.hidden = !show;
    const w = Math.min(d.w, b.width - 20), h = Math.min(d.h, b.height - 20);
    el.style.width = w + 'px'; el.style.height = h + 'px';
    el.style.left = (d.pos === 'br' ? b.width - w - 10 : (b.width - w) / 2) + 'px';
    el.style.top = (d.pos === 'br' ? b.height - h - 10 : Math.max(10, (b.height - h) / 2)) + 'px';
    el.innerHTML = `<div class="iw-h"><span class="t">${esc(d.title)}</span><button data-a="max" title="크게/원래대로">□</button><button class="x" data-a="close" title="닫기">✕</button></div><div class="iw-b"><iframe src="${d.src}${q || ''}"></iframe></div>`;
    $('mdi').appendChild(el);
    const frame = el.querySelector('iframe');
    frame.addEventListener('load', () => { try { hookOpen(frame.contentWindow); } catch (e) {} });
    W[name] = { el, frame };
    el.addEventListener('mousedown', () => front(el), true);
    el.querySelector('[data-a=close]').onclick = () => hide(name);
    el.querySelector('[data-a=max]').onclick = () => { el.classList.toggle('max'); clamp(el); };
    // 제목 줄을 끌어서 이동 (업무시스템 화면 안에서만)
    const hd = el.querySelector('.iw-h');
    hd.addEventListener('dblclick', (e) => { if (!e.target.closest('button')) { el.classList.toggle('max'); clamp(el); } });
    hd.addEventListener('mousedown', (e) => {
      if (e.target.closest('button') || el.classList.contains('max')) return;
      e.preventDefault();
      const sx = e.clientX, sy = e.clientY, ox = parseFloat(el.style.left) || 0, oy = parseFloat(el.style.top) || 0;
      $('mdi').classList.add('dragging');
      const mv = (ev) => { el.style.left = ox + ev.clientX - sx + 'px'; el.style.top = oy + ev.clientY - sy + 'px'; clamp(el); };
      const up = () => { $('mdi').classList.remove('dragging'); window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); };
      window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up);
    });
    // 크기 조절 뒤에도 화면 밖으로 나가지 않게
    new ResizeObserver(() => clamp(el)).observe(el);
    if (show) front(el);
    return W[name];
  }
  function open(name) { const x = W[name] || mount(name, true); x.el.hidden = false; clamp(x.el); front(x.el); if (name === 'today' && x.opened) try { x.frame.contentWindow.location.reload(); } catch (e) {} x.opened = true; }
  function hide(name) { const x = W[name]; if (!x) return; x.el.hidden = true; x.opened = true; }
  window.addEventListener('resize', () => Object.values(W).forEach((x) => clamp(x.el)));
  return { mount, show: open, hide, frame: (n) => W[n] && W[n].frame };
})();
window.deskInner = inner;
// 프로그램 메뉴(F2)로 부를 때
if (APP && APP.onInner) APP.onInner((name) => { if (name === 'today') inner.show('today'); });

// ── 메뉴판 그리기 ──
function allItems() { const a = []; GROUPS.forEach((g, gi) => g.items.forEach((m) => a.push({ ...m, g, gi }))); return a; }
function itemKey(m) { return m.id; }
function render() {
  const q = $('q').value.trim().toLowerCase().replace(/\s+/g, '');
  const favs = readArr(FAV_KEY());
  const board = $('board');
  if (view === 'fav' || view === 'recent') {
    const ids = view === 'fav' ? favs : readArr(REC_KEY());
    const items = ids.map((id) => allItems().find((m) => m.id === id)).filter(Boolean);
    board.innerHTML = `<h2>${view === 'fav' ? '★ 나의 메뉴 — 모든 메뉴에서 ☆를 눌러 추가하세요' : '🕘 최근 사용한 메뉴'}</h2>` +
      (items.length ? `<div class="favs">${items.map((m) => `<button class="fav" data-open="${esc(m.id)}"><b>${esc(m.label)}</b><small style="color:${m.g.color}">${esc(m.g.label)}</small></button>`).join('')}</div>`
        : `<div class="empty">${view === 'fav' ? '아직 나의 메뉴가 없어요. 「모든 메뉴 보기」에서 메뉴 오른쪽 ☆를 눌러 보세요.' : '아직 사용한 메뉴가 없어요.'}</div>`);
    return;
  }
  board.innerHTML = '<div class="grid">' + GROUPS.map((g, gi) => `
    <div class="grp"><div class="hd" style="background:${g.color}">${gi + 1}. ${esc(g.label)}</div>
      ${g.items.map((m) => {
        const hay = (m.label + ' ' + (m.k || '') + ' ' + g.label).toLowerCase().replace(/\s+/g, '');
        const cls = q ? (hay.includes(q) ? ' hit' : ' dim') : '';
        return `<button class="it${cls}" data-open="${esc(m.id)}"><span class="lb">${esc(m.label)}</span>${m.desc ? `<span class="tag">${esc(m.desc)}</span>` : ''}<span class="st${favs.includes(m.id) ? ' on' : ''}" data-fav="${esc(m.id)}" title="나의 메뉴">${favs.includes(m.id) ? '★' : '☆'}</span></button>`;
      }).join('')}
    </div>`).join('') + '</div>';
}
function openItem(id) {
  if (id === '@today') return inner.show('today');
  if (id === '@chat') return openDeskWindow('chat');
  // 수납처럼 따로 있는 화면 (메뉴에 url 이 있으면 이 창 안의 탭으로 열림)
  const um = allItems().find((x) => x.id === id && x.url);
  if (um) { writeArr(REC_KEY(), [id].concat(readArr(REC_KEY()).filter((x) => x !== id)).slice(0, 12)); openViewTab(location.origin + um.url, um.label); return; }
  writeArr(REC_KEY(), [id].concat(readArr(REC_KEY()).filter((x) => x !== id)).slice(0, 12));
  openTab(PAGE, id);
}

/* ── 탭: 메뉴를 누르면 새 창이 아니라 이 창 안에서 열림 ──
   홈페이지 관리자·선생님 화면을 한 번만 불러 두고(페이지마다 화면 1개) 메뉴만 바꿔 끼움 → 빠름
   그 화면의 왼쪽 메뉴·윗줄은 숨기고 내용만 보여줌 (메뉴 이동은 위쪽 탭과 메뉴판으로) */
const tabs = [];            // { key, page, id, label }
const frames = {};          // page → iframe
let activeTab = 'board';
function labelOf(page, id) {
  if (id === '@full') return '홈페이지 원래 화면';
  if (page === 'r-038e0aee5f139320.html') return '원장 보고';
  const m = allItems().find((x) => x.id === id);
  if (m) return m.label;
  return id ? id : page === 'admin.html' ? '관리자 화면' : page === 'ta.html' ? '조교 화면' : '선생님 화면';
}
function openTab(page, id) {
  id = id || '';
  const key = page + '#' + id;
  if (!tabs.find((t) => t.key === key)) tabs.push({ key, page, id, label: labelOf(page, id) });
  activate(key);
}
// 자료 보기 탭 (PDF·이미지·상담자료 미리보기 등 — 홈페이지 화면에서 「새 창」으로 열던 것)
let viewN = 0;
function openViewTab(url, label) {
  const ex = tabs.find((t) => t.view && t.url === url);
  if (ex) { activate(ex.key); return; }
  const key = 'view:' + (++viewN);
  let nm = label;
  if (!nm) { try { const u = new URL(url); nm = decodeURIComponent((u.pathname.split('/').pop() || '').replace(/^.*%2F/i, '')).split('/').pop() || '자료 보기'; } catch (e) { nm = '자료 보기'; } }
  tabs.push({ key, page: key, id: '', view: true, url, label: '📄 ' + nm.slice(0, 40) });
  activate(key);
}
// 홈페이지 화면 안의 window.open(새 창)을 → 이 창 안의 자료 보기 탭으로
function inAppUrl(u) { try { const x = new URL(u, location.href); return x.protocol === 'blob:' || x.protocol === 'data:' || /(^|\.)fanmath\.co\.kr$|firebasestorage\.googleapis\.com$|\.firebasestorage\.app$|\.firebaseapp\.com$/.test(x.hostname) || x.origin === location.origin; } catch (e) { return false; } }
function hookOpen(win) {
  if (!win || win.__deskHooked) return;
  win.__deskHooked = true;
  const go = (u) => {
    if (!u) return;
    const abs = new URL(u, win.location.href).href;
    if (!inAppUrl(abs)) { APP && APP.openExternal ? APP.openExternal(abs) : window.open(abs, '_blank'); return; }
    const page = new URL(abs).pathname.replace(/^\//, '');
    if (new URL(abs).origin === location.origin && /^(admin|teacher|ta)\.html$/.test(page)) { openTab(page, new URL(abs).hash.replace('#', '')); return; }
    openViewTab(abs);
  };
  win.open = function (url) {
    // 「빈 창 먼저 열고 나중에 주소 넣기」 방식과 document.write 방식도 받아 줌
    let html = '', opened = false;
    const doc = { write: (x) => { html += x; }, writeln: (x) => { html += x + '\n'; }, open: () => {}, close: () => { if (html && !opened) { opened = true; go(URL.createObjectURL(new Blob([html], { type: 'text/html' }))); } }, title: '', body: null };
    const fake = {
      closed: false, opener: win, document: doc,
      close() { this.closed = true; }, focus() {}, blur() {}, print() {}, postMessage() {},
      location: { set href(u) { opened = true; go(u); }, get href() { return url || 'about:blank'; }, assign(u) { opened = true; go(u); }, replace(u) { opened = true; go(u); } },
    };
    if (url && url !== 'about:blank') { opened = true; go(url); }
    setTimeout(() => { if (html && !opened) doc.close(); }, 1200);
    return fake;
  };
  // target="_blank" 링크도 같은 방식으로
  win.document.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a[target="_blank"], a[target="_new"]');
    if (!a || a.hasAttribute('download') || !a.href || a.href.startsWith('javascript:')) return;
    e.preventDefault(); go(a.href);
  }, true);
}
const HIDE_CSS = `nav.ad-top,.ad-side,.ad-backdrop,#adMenuBtn,#tnavMenuBtn{display:none!important}
  .ad-main,html[class*="pv2-"] .ad-main{margin-left:0!important;padding-top:14px!important}
  body{padding-top:0!important}`;
function frameFor(t) {
  const fk = t.view ? t.key : t.id === '@full' ? 'full:' + t.page : t.page;
  let f = frames[fk];
  if (f && f.isConnected) return f;
  f = document.createElement('iframe');
  f.src = t.view ? t.url : '/' + t.page + (t.id && t.id !== '@full' ? '#' + t.id : '');
  f.addEventListener('load', () => {
    try {
      const d = f.contentDocument; if (!d) return;
      hookOpen(f.contentWindow);
      if (t.id !== '@full' && !t.view && !d.getElementById('deskHide')) { const st = d.createElement('style'); st.id = 'deskHide'; st.textContent = HIDE_CSS; (d.head || d.documentElement).appendChild(st); }
      // 홈페이지 화면 안에서 로그인 화면으로 넘어가면(로그아웃 등) 프로그램도 로그인 창으로
      if (/\/login\.html$/.test(f.contentWindow.location.pathname)) location.replace('login.html');
    } catch (e) {}
  });
  frames[fk] = f; $('work').appendChild(f);
  return f;
}
const frameKey = (t) => (t.view ? t.key : t.id === '@full' ? 'full:' + t.page : t.page);
function activate(key) {
  activeTab = key;
  const t = tabs.find((x) => x.key === key);
  $('boardView').hidden = !!t; $('work').hidden = !t;
  if (t) {
    const f = frameFor(t);
    Object.values(frames).forEach((x) => (x.hidden = x !== f));
    if (!t.view && t.id !== '@full') try { if (f.contentWindow && f.contentWindow.location.pathname.endsWith(t.page) && (f.contentWindow.location.hash || '').replace('#', '') !== t.id) f.contentWindow.location.hash = t.id; } catch (e) {}
  }
  paintTabs();
}
function closeTab(key) {
  const i = tabs.findIndex((t) => t.key === key); if (i < 0) return;
  const [t] = tabs.splice(i, 1);
  // 같은 화면을 쓰는 탭이 하나도 안 남으면 그 화면도 닫음
  const fk = frameKey(t);
  if (!tabs.some((x) => frameKey(x) === fk) && frames[fk]) { frames[fk].remove(); delete frames[fk]; }
  if (activeTab === key) activate(tabs.length ? tabs[Math.max(0, i - 1)].key : 'board');
  else paintTabs();
}
function paintTabs() {
  $('tabs').innerHTML = `<div class="tab home${activeTab === 'board' ? ' on' : ''}" data-tab="board"><span class="tl">■ 메뉴판</span></div>` +
    tabs.map((t) => `<div class="tab${activeTab === t.key ? ' on' : ''}" data-tab="${esc(t.key)}" title="${esc(t.label)}"><span class="tl">${esc(t.label)}</span><button class="x" data-close="${esc(t.key)}" title="닫기">✕</button></div>`).join('');
}
$('tabs').addEventListener('click', (e) => {
  const c = e.target.closest('[data-close]'); if (c) { e.stopPropagation(); closeTab(c.dataset.close); return; }
  const t = e.target.closest('[data-tab]'); if (t) activate(t.dataset.tab);
});
$('tabs').addEventListener('auxclick', (e) => { const t = e.target.closest('[data-tab]'); if (e.button === 1 && t && t.dataset.tab !== 'board') closeTab(t.dataset.tab); });
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key.toLowerCase() === 'w' && activeTab !== 'board') { e.preventDefault(); closeTab(activeTab); }
});
// 일일종합현황 등 다른 창에서 「바로가기」를 누르면 여기 탭으로 열림
function openUrl(url) {
  try {
    const u = new URL(url, location.origin);
    const page = u.pathname.replace(/^\//, '');
    if (/^(admin|teacher|ta)\.html$|^r-[0-9a-f]+\.html$/.test(page)) { openTab(page, u.hash.replace('#', '')); return true; }
  } catch (e) {}
  return false;
}
window.deskOpen = (url) => { if (!openUrl(url)) { if (inAppUrl(url)) openViewTab(url); else if (APP && APP.openExternal) APP.openExternal(url); } inner.hide('today'); window.focus(); };
if (APP && APP.onOpenWork) APP.onOpenWork((url) => window.deskOpen(url));
paintTabs();
$('board').addEventListener('click', (e) => {
  const f = e.target.closest('[data-fav]');
  if (f) { e.stopPropagation(); const id = f.dataset.fav, a = readArr(FAV_KEY()); writeArr(FAV_KEY(), a.includes(id) ? a.filter((x) => x !== id) : a.concat(id)); toast(a.includes(id) ? '나의 메뉴에서 뺐어요' : '나의 메뉴에 넣었어요'); render(); return; }
  const b = e.target.closest('[data-open]'); if (b) openItem(b.dataset.open);
});
document.querySelectorAll('.sd-nav [data-view]').forEach((b) => b.addEventListener('click', () => {
  view = b.dataset.view; document.querySelectorAll('.sd-nav [data-view]').forEach((x) => x.classList.toggle('on', x === b)); render(); activate('board');
}));
// 검색: 입력하면 맞는 메뉴를 노랗게, 엔터 = 첫 번째 메뉴 열기
$('q').addEventListener('input', () => { if (view !== 'all') document.querySelector('[data-view=all]').click(); else { render(); activate('board'); } });
$('q').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { $('q').value = ''; render(); }
  if (e.key === 'Enter') { const h = document.querySelector('.grp .it.hit'); if (h) { openItem(h.dataset.open); $('q').value = ''; render(); } }
});
$('qBtn').onclick = () => $('q').dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('q').focus(); $('q').select(); } });

// ── 버튼들 ──
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b || !P) return;
  const a = b.dataset.act;
  if (a === 'today') inner.show('today');
  else if (a === 'chat') openDeskWindow('chat');   // 메신저는 따로 창
  else if (a === 'web') openTab(PAGE, '@full');
  else if (a === 'director') openTab('r-038e0aee5f139320.html', '');
  else if (a === 'site') { const u = location.origin + '/'; APP && APP.openExternal ? APP.openExternal(u) : window.open(u, '_blank'); }
  else if (a === 'logout') { if (confirm('로그아웃할까요?')) logout(false); }
});
async function logout(expired) {
  await signOut(auth).catch(() => {});
  if (IN_PROGRAM && APP.logout) APP.logout(); else location.replace('login.html');
}

// ── 오늘 일정 (관리부 달력 + 학원 일정) ──
async function loadSchedule() {
  const today = ymd(new Date());
  $('schedDate').textContent = today.slice(5).replace('-', '/');
  const evs = [];
  const office = P.kind === 'admin'
    ? query(collection(db, 'officeCalendar'), where('date', '==', today))
    : query(collection(db, 'officeCalendar'), where('visibility', '==', 'teachers'), where('date', '==', today));
  const [oc, se] = await Promise.all([getDocs(office).catch(() => null), getDocs(collection(db, 'scheduleEvents')).catch(() => null)]);
  if (oc) oc.forEach((d) => { const x = d.data(); evs.push({ t: x.startTime || '', title: (x.type ? `[${x.type}] ` : '') + (x.title || x.studentName || ''), br: x.branch }); });
  if (se) se.forEach((d) => {
    const x = d.data(), s = x.start || x.date || '', e2 = x.end || s;
    if (!s || s > today || e2 < today) return;
    if (P.kind !== 'admin' && x.target === 'teachers' && Array.isArray(x.teacherUids) && !x.teacherUids.includes(P.uid)) return;
    evs.push({ t: x.time || '', title: '[학원] ' + (x.title || ''), br: x.branch });
  });
  evs.sort((a, b) => (a.t || '99').localeCompare(b.t || '99'));
  $('sched').innerHTML = evs.length ? evs.slice(0, 8).map((e) => `<div class="ev"><span class="tm">${esc(e.t || '종일')}</span><span class="${e.br ? (normBr(e.br) === '산본관' ? 'br-sb' : 'br-pc') : ''}">${esc(e.title)}</span></div>`).join('') + (evs.length > 8 ? `<div class="none">외 ${evs.length - 8}건</div>` : '')
    : '<div class="none">오늘 등록된 일정이 없어요</div>';
}

// ── 메신저 안 읽은 대화 수 ──
function watchUnread() {
  const rooms = new Map(); let reads = {};
  const paint = () => {
    let n = 0;
    rooms.forEach((r, id) => { const at = r.lastAt?.toMillis ? r.lastAt.toMillis() : 0; const rd = reads[id]?.toMillis ? reads[id].toMillis() : 0; if (at && r.lastBy !== P.uid && at > rd) n++; });
    ['sdUnread', 'cardUnread'].forEach((id) => { const el = $(id); el.textContent = n; el.classList.toggle('show', n > 0); });
  };
  const put = (snap) => { snap.docChanges().forEach((c) => { if (c.type === 'removed') rooms.delete(c.doc.id); else rooms.set(c.doc.id, c.doc.data()); }); paint(); };
  onSnapshot(query(collection(db, 'chatRooms'), where('type', '==', 'channel')), put, () => {});
  onSnapshot(query(collection(db, 'chatRooms'), where('members', 'array-contains', P.uid)), put, () => {});
  onSnapshot(doc(db, 'chatReads', P.uid), (d) => { reads = d.exists() ? d.data() : {}; paint(); }, () => {});
}
