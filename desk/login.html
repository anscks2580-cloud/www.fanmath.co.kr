<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>송우찬수학학원 업무시스템 · 로그인</title>
<link rel="icon" href="/assets/icons/icon-192.png">
<link rel="stylesheet" href="desk.css?v=2">
<style>
html,body{background:#fff;overflow:hidden}
body.web{display:flex;align-items:center;justify-content:center;background:#E6E5EC;min-height:100vh}
.lg{width:420px;height:244px;background:#fff;display:flex;flex-direction:column;border:1px solid #2E2160}
body.web .lg{box-shadow:0 10px 30px rgba(0,0,0,.18)}
.lg-body{flex:1;display:flex;gap:18px;padding:20px 22px 0 20px;position:relative}
.lg-logo{flex:0 0 96px;display:flex;flex-direction:column;align-items:center;gap:6px}
.lg-logo img{width:92px;height:92px;border-radius:50%}
.lg-logo small{font-size:11px;color:var(--mut);white-space:nowrap}
.lg-form{flex:1;min-width:0}
.lg-form h1{margin:2px 0 12px;font-size:14px;font-weight:700;color:var(--p);padding-bottom:7px;border-bottom:2px solid var(--p)}
.row{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:6px;margin-bottom:7px}
.row label{font-weight:700;color:#3A3848}
.row .dk-in{width:100%;height:27px}
.btn{width:100%;height:30px;margin-top:4px;border:1px solid var(--p);border-radius:2px;background:var(--p2);color:#fff;font-weight:700;font-size:13px}
.btn:hover{background:var(--p)}
.btn:disabled{opacity:.6}
.msg{min-height:16px;margin-top:7px;font-size:11px;font-weight:700}
.msg.err{color:var(--red)} .msg.ok{color:var(--green)}
.foot{display:flex;justify-content:space-between;padding:6px 10px;border-top:1px solid var(--line2);background:#F7F7FA;font-size:10.5px;color:var(--mut)}
</style>
</head>
<body>
<div class="lg">
  <div class="dk-titlebar" id="tbar">
    <img src="/assets/icons/splash-logo.png" alt="">
    <span class="t" id="ttl">송우찬수학학원 업무시스템</span>
    <span class="sp"></span>
    <button type="button" title="최소화" id="btnMin">─</button>
    <button type="button" class="x" title="닫기" id="btnClose">✕</button>
  </div>
  <div class="lg-body">
    <div class="lg-logo"><img src="/assets/icons/splash-logo.png" alt="송우찬수학학원"><small>평촌관 · 산본관</small></div>
    <div class="lg-form">
      <h1 id="hd">업무시스템 로그인</h1>
      <div class="row"><label for="uid">아이디</label><input class="dk-in" id="uid" autocomplete="username" spellcheck="false"></div>
      <div class="row"><label for="upw">암호</label><input class="dk-in" id="upw" type="password" autocomplete="current-password"></div>
      <button class="btn" id="btnLogin" type="button">로그인</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>
  <div class="foot"><span>평촌관 031-386-8899 · 산본관 031-346-8899</span><span id="ver"></span></div>
</div>

<script type="module">
import { auth, APP, IN_PROGRAM, idToEmail, staffProfile, onAuthStateChanged, signInWithEmailAndPassword, signOut,
  setPersistence, browserLocalPersistence } from './desk-fb.js?v=2';

const $ = (id) => document.getElementById(id);
const NEXT = new URLSearchParams(location.search).get('next') === 'chat' ? 'chat' : 'main';
if (NEXT === 'chat') { $('ttl').textContent = '송우찬수학학원 메신저'; $('hd').textContent = '메신저 로그인'; }
if (!IN_PROGRAM) { document.body.classList.add('web'); $('btnMin').style.display = $('btnClose').style.display = 'none'; }
$('ver').textContent = IN_PROGRAM ? 'v' + (APP.version || '') : '';
$('btnMin').onclick = () => APP && APP.winMinimize && APP.winMinimize();
$('btnClose').onclick = () => (APP && APP.winClose ? APP.winClose() : window.close());

// 마지막으로 쓴 아이디는 기억 (암호는 저장하지 않음)
const ID_KEY = 'swc_desk_saved_id';
try { const sid = localStorage.getItem(ID_KEY); if (sid) $('uid').value = sid; } catch (e) {}
(($('uid').value ? $('upw') : $('uid'))).focus();

function msg(t, kind = 'err') { const m = $('msg'); m.textContent = t || ''; m.className = 'msg ' + (t ? kind : ''); }
try { if (sessionStorage.getItem('swc_session_expired')) { sessionStorage.removeItem('swc_session_expired'); msg('로그인한 지 8시간이 지나 자동으로 로그아웃되었습니다.'); } } catch (e) {}

// 프로그램을 새로 켰을 때는 무조건 다시 로그인 (예전 계정으로 자동 로그인 방지)
let checked = false;
onAuthStateChanged(auth, async (user) => {
  if (checked) return; checked = true;
  if (!user) return;
  const fresh = IN_PROGRAM && APP.freshRun ? await APP.freshRun().catch(() => true) : true;
  if (fresh) await signOut(auth).catch(() => {});
});

async function doLogin() {
  const id = $('uid').value.trim(), pwRaw = $('upw').value.trim();
  if (!id || !pwRaw) { msg('아이디와 암호를 입력해 주세요.'); return; }
  const btn = $('btnLogin'); btn.disabled = true; btn.textContent = '확인 중…'; msg('');
  try {
    await setPersistence(auth, browserLocalPersistence);
    let cred = null, last = null;
    for (const pw of pwRaw.includes('-') ? [pwRaw, pwRaw.replace(/-/g, '')] : [pwRaw]) {
      try { cred = await signInWithEmailAndPassword(auth, idToEmail(id), pw); break; } catch (e) { last = e; if (e.code === 'auth/user-disabled') break; }
    }
    if (!cred) throw last;
    const p = await staffProfile(cred.user);
    if (!p) { await signOut(auth); msg('관리부·선생님·조교 계정만 쓸 수 있어요.'); return; }
    try { localStorage.setItem(ID_KEY, id); } catch (e) {}
    const info = { uid: p.uid, name: p.name, kind: p.kind, roleLabel: p.roleLabel, director: p.director, next: NEXT };
    if (IN_PROGRAM && APP.loginDone) { APP.markLogin && APP.markLogin(); APP.loginDone(info); }
    else location.replace(NEXT === 'chat' ? 'chat.html' : 'main.html');
  } catch (e) {
    msg(e && e.code === 'auth/user-disabled' ? '사용이 중지된 계정입니다. 원장님께 문의해 주세요.'
      : e && e.code === 'auth/too-many-requests' ? '여러 번 틀려 잠시 막혔어요. 잠시 뒤 다시 해 주세요.'
      : '아이디 또는 암호가 올바르지 않습니다.');
  } finally { btn.disabled = false; btn.textContent = '로그인'; }
}
$('btnLogin').onclick = doLogin;
$('uid').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('upw').focus(); });
$('upw').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
