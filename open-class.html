  .chip-opt input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
  .chip-opt:has(input:checked) { border-color: var(--gold); color: var(--purple, #5B3FA6); background: var(--gold-glow); }

  .agree-box {
    display:flex; align-items:flex-start; gap:10px; cursor:pointer;

  .submit-btn:disabled { opacity:0.5; cursor:not-allowed; }
  .submit-btn:hover:not(:disabled) { opacity:0.9; }

  .contact-line { text-align:center; font-size:12.5px; color:var(--muted); margin-top:18px; line-height:1.8; }

  .result-box { text-align:center; padding: 50px 24px; }
  .result-box .emoji { font-size: 44px; margin-bottom: 16px; }
  .result-box h2 { font-size:20px; margin-bottom:12px; }
  .result-box p { font-size:13px; color:var(--muted); line-height:1.8; }
  .result-box .r-card {

    background: var(--gold-glow); border:1px solid var(--border); text-align:left;
  }
  .result-box .r-card b { color:var(--off-white); }
  .result-box .r-card .when { font-size:15px; font-weight:800; color:var(--purple, #5B3FA6); margin-top:4px; }
  .result-box .home-btn {

  /* 이 페이지: 입력칸 이름 글씨를 더 진하게 */

<body>

<nav>
  <a href="index.html" style="display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#1E1838;flex-shrink:0;overflow:hidden;max-width:100%;">

<div class="page">
  <div class="form-wrap">
    <div class="form-header">
      <div class="form-badge">산본관 · 예비고1</div>
      <h1>예비고1 공개특강 수강 신청</h1>
      <p>아래 내용을 남겨 주시면<br>확인 후 산본관에서 안내 연락을 드리겠습니다.</p>
    </div>

    <form id="openClassForm">

      <!-- 학생 정보 -->
      <div class="f-section">
        <div class="f-label">학생 정보</div>
        <div class="f-row">
          <div class="f-field">
            <label>이름<span class="req">*</span></label>
            <input type="text" name="studentName" required maxlength="40" placeholder="학생 이름" autocomplete="off">
          </div>
          <div class="f-field">
            <label>학교<span class="req">*</span></label>
            <input type="text" name="school" required maxlength="40" placeholder="예: ○○중학교" autocomplete="off">
          </div>
        </div>
      </div>

      <!-- 연락처 -->
      <div class="f-section">
        <div class="f-label">연락처</div>
        <div class="f-row">
          <div class="f-field">
            <label>학부모 번호<span class="req">*</span></label>
            <input type="tel" name="parentPhone" required maxlength="20" placeholder="010-0000-0000" inputmode="numeric" autocomplete="off">
          </div>
          <div class="f-field">
            <label>학생 번호<span class="f-sub">(선택)</span></label>
            <input type="tel" name="studentPhone" maxlength="20" placeholder="010-0000-0000" inputmode="numeric" autocomplete="off">
          </div>
        </div>
      </div>

      <!-- 진도 -->
      <div class="f-section">
        <div class="f-label">현재 진도</div>
        <div class="f-row">
          <div class="f-field">
            <label>진도가 어디까지 나갔나요?<span class="req">*</span></label>
            <input type="text" name="progress" required maxlength="200" placeholder="예: 공통수학1 다항식까지 / 중3-2 끝냄" autocomplete="off">
          </div>
        </div>
      </div>

      <!-- 개인정보 동의 -->
      <div class="f-section">
        <label class="agree-box">
          <input type="checkbox" name="agree" required>
          <span>개인정보 수집·이용에 동의합니다. <span class="req" style="color:var(--purple, #5B3FA6);">*</span></span>
        </label>
        <div class="agree-detail">
          수집 항목: 학생 이름, 학교, 학부모 전화번호, 학생 전화번호(선택), 현재 진도 &nbsp;|&nbsp; 이용 목적: 공개특강 수강 신청 접수·안내 연락 &nbsp;|&nbsp; 보유 기간: 특강 종료 후 3개월 이내 파기
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">공개특강 수강 신청하기</button>
    </form>

    <div class="contact-line" id="contactLine">
      📞 문의 &nbsp;·&nbsp; 산본관 <a href="tel:031-346-8899">031-346-8899</a>
    </div>

    <div class="result-box hidden" id="resultBox">
      <div class="emoji">✅</div>
      <h2>수강 신청이 접수되었습니다</h2>
      <p>확인 후 산본관에서 안내 연락을 드리겠습니다.</p>
      <br>
      <a href="index.html" class="home-btn">홈으로 돌아가기</a>
    </div>
  </div>
</div>

<script>
// ── 텔레그램 알림 (수리논술 상담 신청과 같은 컨설트봇·채팅방) — 신청 내용은 텔레그램으로만 전달 ──
const TELEGRAM_BOT_TOKEN = '8802440196:AAHh9EWYtR7ITLkXYlbYe5N4xD_sQ2JSS78';
const TELEGRAM_CHAT_ID = '8913371664';

// ── 전화번호 자동 하이픈 ──
function formatPhone(v) {
  const n = v.replace(/\D/g, '').slice(0, 11);
  if (n.length < 4) return n;
  if (n.length < 8) return n.slice(0, 3) + '-' + n.slice(3);
  if (n.length < 11) return n.slice(0, 3) + '-' + n.slice(3, 6) + '-' + n.slice(6);
  return n.slice(0, 3) + '-' + n.slice(3, 7) + '-' + n.slice(7);
}
document.querySelectorAll('input[type=tel]').forEach((el) => {
  el.addEventListener('input', () => { el.value = formatPhone(el.value); });
});

function buildTelegramMessage(d) {
  const v = (x) => (x ? x : '-');
  return [
    '📣 예비고1 공개특강 수강 신청 [산본관]',
    '',
    '🧑‍🎓 이름: ' + v(d.studentName),
    '🏫 학교: ' + v(d.school),
    '👨‍👩‍👧 학부모 번호: ' + v(d.parentPhone),
    '📱 학생 번호: ' + v(d.studentPhone),
    '📚 진도: ' + v(d.progress),
    '',
    '🕒 ' + new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' }),
  ].join('\n');
}
async function sendTelegram(d) {
  const res = await fetch('https://api.telegram.org/bot' + TELEGRAM_BOT_TOKEN + '/sendMessage', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: buildTelegramMessage(d) })
  });
  if (!res.ok) throw new Error('Telegram ' + res.status);
}

const form = document.getElementById('openClassForm');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(form);
  const parentPhone = (fd.get('parentPhone') || '').trim();
  const studentPhone = (fd.get('studentPhone') || '').trim();
  if (parentPhone.replace(/\D/g, '').length < 9) { alert('학부모 번호를 정확히 입력해 주세요.'); return; }
  if (studentPhone && studentPhone.replace(/\D/g, '').length < 9) { alert('학생 번호를 정확히 입력해 주세요. (없으면 비워 두셔도 됩니다)'); return; }

  const data = {
    studentName: (fd.get('studentName') || '').trim(),
    school: (fd.get('school') || '').trim(),
    parentPhone, studentPhone,
    progress: (fd.get('progress') || '').trim(),
  };

  submitBtn.disabled = true;
  submitBtn.textContent = '신청 중...';
  try {
    await sendTelegram(data);
    form.classList.add('hidden');
    document.getElementById('contactLine').classList.add('hidden');
    document.getElementById('resultBox').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (err) {
    console.error(err);
    alert('신청이 전달되지 않았습니다. 잠시 후 다시 시도하시거나 산본관(031-346-8899)으로 전화 주세요.');
    submitBtn.disabled = false;
    submitBtn.textContent = '공개특강 수강 신청하기';
  }
});
</script>
