<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, setDoc, collection, query, where, orderBy, limit, addDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getMessaging, getToken, onMessage, isSupported } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js";
import { dueInfo, mdw as shMdw } from "./sheet-core.js?v=1794660000";   // HCS 시험지 연동(기한·제출 여부)

const app = initializeApp({ apiKey: "AIzaSyD_eYNKzfa-aT41E3Dqt_HyJc6UeSR5ErA", authDomain: "songmath.firebaseapp.com", projectId: "songmath", storageBucket: "songmath.firebasestorage.app", messagingSenderId: "936295436575", appId: "1:936295436575:web:d1e201508719850cfbe02a" });
const auth = getAuth(app), db = getFirestore(app);
const $app = document.getElementById('app');
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let hwChecks = {};
let pSheets = [];   // sheetTasks — HCS에서 출제된 시험지(어떤 시험지인지 + 답안 제출 여부만 보임. 채점 결과는 선생님만)
let cur = 'homework', child = null, weekly = [], monthly = [], comments = [], homework = [], me = null, attDays = [], notices = [], attErr = '', absences = [];
{ const t = new URLSearchParams(location.search).get('tab'); if (['homework', 'att', 'weekly', 'monthly', 'notice'].includes(t)) cur = t; }
const openReports = new Set();   // 펼쳐진 보고서 id (최신 달은 자동)
const frameHeights = {};
window.addEventListener('message', (e) => { if (e.data && e.data.type === 'reportHeight' && e.data.id) { frameHeights[e.data.id] = e.data.h; const f = document.getElementById('rf-' + e.data.id); if (f) f.style.height = (e.data.h + 4) + 'px'; } });
window.pToggleReport = (id) => { if (openReports.has(id)) openReports.delete(id); else openReports.add(id); render(); };
// viewer: 'parent'(학부모 본인) | 'student'(학생 계정) | 'teacher'(선생님·관리자가 ?student=학생uid 로 열어봄 — 답글 작성용)
let viewer = { role: 'parent', name: '' };
const params = new URLSearchParams(location.search);
const openThreads = new Set();

onAuthStateChanged(auth, async (user) => {
  if (!user) { location.replace('login.html'); return; }
  me = user;
  try {
    const p = await getDoc(doc(db, 'parents', user.uid));
    let studentId;
    if (p.exists()) { studentId = p.data().studentId; viewer = { role: 'parent', name: '' }; savedFcm = p.data().fcmToken || null; }
    else {
      const s = await getDoc(doc(db, 'students', user.uid));
      if (s.exists()) { studentId = user.uid; viewer = { role: 'student', name: s.data().name || '' }; } // 학생 계정으로도 열람 가능
      else if (params.get('student')) {
        // 선생님·관리자가 특정 학생의 학부모 화면을 열어 답글 작성
        const t = await getDoc(doc(db, 'teachers', user.uid));
        const a = t.exists() ? null : await getDoc(doc(db, 'admins', user.uid));
        if (t.exists() || (a && a.exists())) { studentId = params.get('student'); viewer = { role: 'teacher', name: (t.exists() ? t.data().name : a.data().name) || '', isTeacher: t.exists() }; }
      }
    }
    if (!studentId) { $app.innerHTML = '<div class="empty">학부모 계정이 아닙니다. 학원에 문의해 주세요.</div>'; return; }
    const sd = await getDoc(doc(db, 'students', studentId));
    child = { id: studentId, ...(sd.exists() ? sd.data() : {}) };
    if (child.status === '퇴원' && viewer.role !== 'teacher') { $app.innerHTML = '<div class="empty">퇴원 처리된 학생입니다. 학원에 문의해 주세요.</div>'; try { await auth.signOut(); } catch (e) {} return; }
    const [ws, ms, cs, hs] = await Promise.all([
      getDocs(query(collection(db, 'weeklyReports'), where('studentId', '==', studentId))),
      getDocs(query(collection(db, 'studentReports'), where('studentId', '==', studentId), where('status', '==', 'sent'))),
      // 선생님은 규칙상 본인 담당 댓글만 읽을 수 있으므로 조건을 좁혀서 조회 (관리자는 전체)
      getDocs(viewer.role === 'teacher' && viewer.isTeacher
        ? query(collection(db, 'reportComments'), where('studentId', '==', studentId), where('teacherUid', '==', user.uid))
        : query(collection(db, 'reportComments'), where('studentId', '==', studentId))),
      getDocs(query(collection(db, 'homeworkLogs'), where('studentIds', 'array-contains', studentId))),
    ]);
    homework = []; hs.forEach((d) => homework.push({ id: d.id, ...d.data() }));
    // 학생이 학원 앱에서 누른 숙제 완료 체크 (homeworkChecks)
    hwChecks = {};
    try { const hc = await getDocs(query(collection(db, 'homeworkChecks'), where('studentId', '==', studentId))); hc.forEach((d) => { const x = d.data(); if (x.logId && x.done) hwChecks[x.logId] = x; }); } catch (e) { console.warn('[숙제 체크]', e.message); }
    homework.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    pSheets = [];
    try { const sh = await getDocs(query(collection(db, 'sheetTasks'), where('studentId', '==', studentId))); sh.forEach((d) => pSheets.push({ id: d.id, ...d.data() })); } catch (e) { console.warn('[시험지]', e.message); }
    pSheets.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    comments = []; cs.forEach((d) => comments.push({ id: d.id, ...d.data() }));
    comments.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
    weekly = []; ws.forEach((d) => weekly.push({ id: d.id, ...d.data() }));
    weekly.sort((a, b) => (b.weekKey || '').localeCompare(a.weekKey || ''));
    monthly = []; ms.forEach((d) => monthly.push({ id: d.id, ...d.data() }));
    monthly.sort((a, b) => (b.month || '').localeCompare(a.month || ''));
    await Promise.all([loadAttendance(), loadNotices(), loadAbsences()]);
    if (cur === 'notice') markNoticesSeen();
    render();
    pushInit();
  } catch (e) { $app.innerHTML = `<div class="empty">불러오지 못했습니다.<br><small>${esc(e.message)}</small></div>`; }
});


// ══ 출결: 최근 14일 등원·하원 (문서 id = 학생uid_날짜) ══
function kstDateStr(offsetDays) {
  const k = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
  k.setDate(k.getDate() - (offsetDays || 0));
  return `${k.getFullYear()}-${String(k.getMonth() + 1).padStart(2, '0')}-${String(k.getDate()).padStart(2, '0')}`;
}
async function loadAttendance() {
  attDays = []; attErr = '';
  try {
    const days = Array.from({ length: 14 }, (_, i) => kstDateStr(i));
    const snaps = await Promise.all(days.map((d) => getDoc(doc(db, 'attendance', `${child.id}_${d}`)).catch(() => null)));
    snaps.forEach((sn, i) => { if (sn && sn.exists()) attDays.push({ date: days[i], ...sn.data() }); });
  } catch (e) { attErr = e.message; }
}
// ══ 공지: 우리 아이에게 해당하는 공지만 (전체 / 우리 관 / 우리 반 / 우리 아이) ══
async function loadNotices() {
  notices = [];
  try {
    const ns = await getDocs(query(collection(db, 'notices'), orderBy('createdAt', 'desc'), limit(40)));
    ns.forEach((d) => {
      const n = d.data();

      ${th.map((c) => { const mine = c.authorUid === me.uid; const editing = editingId === c.id; return `<div class="cm ${c.authorRole}" id="cm-${c.id}">
        <div class="who"><span>${esc(c.authorName || (c.authorRole === 'teacher' ? '선생님' : '학부모'))} · ${c.createdAt?.seconds ? new Date(c.createdAt.seconds * 1000).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' }) : ''}${c.editedAt ? ' · 수정됨' : ''}</span>
          ${mine && !editing ? `<span class="act"><button onclick="pEdit('${c.id}')">수정</button><button onclick="pDelete('${c.id}')">삭제</button></span>` : ''}</div>
${editing ? `<textarea id="cm-edit-${c.id}">${esc(c.text)}</textarea><div class="eact"><button onclick="pEditCancel()">취소</button><button class="ok" onclick="pEditSave('${c.id}')">저장</button></div>` : `<div class="txt">${esc(c.text)}</div>`}</div>`; }).join('')}
      <div class="cm-form"><textarea id="cm-ta-${type}-${id}" placeholder="${isTeacherView() ? '답글을 입력하세요' : '댓글을 입력하세요'}" onfocus="pMarkRead('${key}')"></textarea><button onclick="pSend('${type}','${id}','${esc(teacherUid || '')}','${esc(teacherName || '')}','${esc(label)}')">보내기</button></div>
    </div>`;
}
window.pLogout = async () => { await signOut(auth); location.replace('login.html'); };

const tabDot = (type) => comments.some((c) => c.targetType === type && (isTeacherView() ? (c.authorRole === 'parent' && !c.readByTeacher) : (c.authorRole === 'teacher' && !c.readByParent))) ? ' <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#C8541F;vertical-align:middle;margin-left:2px;"></span>' : '';
// ══ 앱 알림(등원·하원·숙제·주간성취도·월간보고서·선생님 답글·공지) ══
//  · 학부모가 「알림 켜기」를 누르면 이 휴대폰의 알림 주소를 parents/{uid}.fcmToken 에 저장
//  · 서버(학부모알림 함수)가 일이 생기면 그 주소로 알림을 보냄
//  · 아이폰은 홈 화면에 설치한 앱에서만 알림을 받을 수 있음
let savedFcm = null, pushState = 'hidden', pushErr = '', pushListening = false;
const isIOSdev = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAppMode = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
// 앱을 열면 휴대폰 알림창에 쌓인 학원 알림은 지움 (이미 앱에서 확인하므로)
async function clearShownNotifications() {
  try { const reg = await navigator.serviceWorker.getRegistration('/'); if (!reg) return; (await reg.getNotifications()).forEach((n) => n.close()); } catch (e) {}
}
async function pushInit() {
  if (viewer.role !== 'parent') { pushState = 'hidden'; return; }
  clearShownNotifications();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) clearShownNotifications(); });
  let ok = ('Notification' in window) && ('serviceWorker' in navigator);
  if (ok) { try { ok = await isSupported(); } catch (e) { ok = false; } }
  if (!ok) { pushState = (isIOSdev && !isAppMode()) ? 'need-app' : 'unsupported'; render(); return; }
  if (Notification.permission === 'granted') { pushState = 'on'; render(); try { await pushSaveToken(); } catch (e) { pushState = 'error'; pushErr = e.message; render(); } }
  else if (Notification.permission === 'denied') { pushState = 'denied'; render(); }
  else { pushState = 'off'; render(); }
}
async function pushSaveToken() {
  const reg = await navigator.serviceWorker.register('/sw.js', { scope: '/' });
  await navigator.serviceWorker.ready;
  const messaging = getMessaging(app);
  const token = await getToken(messaging, { serviceWorkerRegistration: reg });
  if (token && token !== savedFcm) { await updateDoc(doc(db, 'parents', me.uid), { fcmToken: token }); savedFcm = token; }
  try { await setDoc(doc(db, 'appStatus', me.uid), { role: 'parent', studentId: child.id, pushOn: true, lastSeen: serverTimestamp() }, { merge: true }); } catch (e) {}
  if (!pushListening) {
    pushListening = true;
    // 앱을 보고 있는 중에 온 알림은 화면 위에 잠깐 띄움
    onMessage(messaging, (m) => {
      const n = m.notification || m.data || {};
      const t = document.createElement('div');
      t.style.cssText = 'position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 12px);z-index:9999;background:#1A1230;color:#fff;border-radius:14px;padding:13px 16px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:14px;line-height:1.45;';
      t.innerHTML = `<b>${esc(n.title || '알림')}</b><div style="opacity:.85;margin-top:2px;">${esc(n.body || '')}</div>`;
      t.onclick = () => location.reload();
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 6000);
    });
  }
}
window.pEnablePush = async () => {
  try {
    const perm = await Notification.requestPermission();
    if (perm === 'granted') { pushState = 'working'; render(); await pushSaveToken(); pushState = 'on'; }
    else pushState = perm === 'denied' ? 'denied' : 'off';
  } catch (e) { pushState = 'error'; pushErr = e.message; }
  render();
};
window.pInstallApp = () => { if (window.swcOpenInstall) window.swcOpenInstall(); };
function pushHtml() {
  if (isTeacherView() || pushState === 'hidden') return '';
  const box = (bg, bd, inner) => `<div class="card" style="background:${bg};border-color:${bd};display:flex;align-items:center;gap:12px;">${inner}</div>`;
  const what = '등원·하원 · 숙제 · 주간 성취도 · 월간 보고서 · 선생님 답글 · 공지';
  if (pushState === 'off') return box('#FFF9E6', '#F0C040', `<div style="font-size:26px;">🔔</div><div style="flex:1;"><div style="font-weight:800;font-size:14.5px;">앱 알림 켜기</div><div style="font-size:12px;color:var(--ink-2);margin-top:2px;">${what}을 휴대폰 알림으로 바로 받아보세요.</div></div><button onclick="pEnablePush()" style="background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-family:inherit;font-weight:800;font-size:13.5px;cursor:pointer;white-space:nowrap;">알림 켜기</button>`);
  if (pushState === 'need-app') return box('#FFF9E6', '#F0C040', `<div style="font-size:26px;">📲</div><div style="flex:1;"><div style="font-weight:800;font-size:14.5px;">앱으로 설치하면 알림을 받을 수 있어요</div><div style="font-size:12px;color:var(--ink-2);margin-top:2px;">아이폰은 홈 화면에 설치한 앱에서만 알림이 와요. 설치 후 앱에서 다시 로그인해 주세요.</div></div><button onclick="pInstallApp()" style="background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-family:inherit;font-weight:800;font-size:13.5px;cursor:pointer;white-space:nowrap;">앱 설치</button>`);
  if (pushState === 'working') return box('#F7F5FC', '#E3DDF3', `<div style="font-size:22px;">⏳</div><div style="font-size:13.5px;">알림을 켜는 중이에요…</div>`);
  if (pushState === 'on') return `<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--good);background:var(--good-soft);border-radius:10px;padding:8px 12px;margin-bottom:10px;"><span>🔔</span><span style="color:var(--ink-2);"><b style="color:var(--good);white-space:nowrap;">알림 켜짐</b> · 이 휴대폰으로 ${what} 알림을 받아요</span></div>`;
  if (pushState === 'denied') return box('#FBE9E0', '#F0B9A0', `<div style="font-size:24px;">🔕</div><div style="flex:1;font-size:12.5px;color:var(--ink-2);"><b style="color:var(--warn);font-size:14px;">알림이 꺼져 있어요</b><br>휴대폰 설정 → 알림 → 송우찬수학에서 알림을 허용한 뒤 앱을 다시 열어 주세요.</div>`);
  if (pushState === 'unsupported') return box('#F7F5FC', '#E3DDF3', `<div style="font-size:24px;">ℹ️</div><div style="flex:1;font-size:12.5px;color:var(--ink-2);">이 화면에서는 알림을 받을 수 없어요. 홈페이지 첫 화면의 <b>앱 다운로드</b>로 앱을 설치해서 이용해 주세요.</div>`);
  if (pushState === 'error') return box('#FBE9E0', '#F0B9A0', `<div style="font-size:24px;">⚠️</div><div style="flex:1;font-size:12.5px;color:var(--ink-2);">알림을 켜지 못했어요. 잠시 후 다시 시도해 주세요.<br><small style="color:var(--muted);">${esc(pushErr)}</small></div><button onclick="pEnablePush()" style="background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 12px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;">다시</button>`);
  return '';
}

function render() {
  const lvl = (v) => v >= 4 ? 'hi' : v <= 2 ? 'lo' : '';
  $app.innerHTML = `
    <div class="head">
      <div><div class="brand">SONGMATH · 학부모${isTeacherView() ? ` <span style="background:#C8541F;color:#fff;padding:1px 8px;border-radius:999px;font-size:10px;letter-spacing:0;">선생님 보기 · ${esc(viewer.name)}</span>` : ''}</div><h1>${esc(child.name)} 학생</h1><div class="sub">${esc(child.grade || '')}${child.classGroup ? ' · ' + esc(child.classGroup) : ''}${child.teacherName ? ' · ' + esc(child.teacherName) + ' 선생님' : ''}</div></div>
      ${isTeacherView() ? '' : '<button onclick="pLogout()">로그아웃</button>'}
    </div>
    ${pushHtml()}
    ${notiHtml()}
    ${attTodayHtml()}
    <div class="tabs">
      <button class="tab ${cur === 'homework' ? 'active' : ''}" onclick="pTab('homework')">숙제</button>
      <button class="tab ${cur === 'att' ? 'active' : ''}" onclick="pTab('att')">출결</button>
      <button class="tab ${cur === 'weekly' ? 'active' : ''}" onclick="pTab('weekly')">주간 성취도${tabDot('weekly')}</button>
      <button class="tab ${cur === 'monthly' ? 'active' : ''}" onclick="pTab('monthly')">월간 보고서${tabDot('monthly') || (newReports().length ? ' <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#C8541F;vertical-align:middle;margin-left:2px;"></span>' : '')}</button>
      <button class="tab ${cur === 'notice' ? 'active' : ''}" onclick="pTab('notice')">공지${newNoticeCount() ? ' <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#C8541F;vertical-align:middle;margin-left:2px;"></span>' : ''}</button>
    </div>
    ${cur === 'att' ? attTabHtml() : ''}
    ${cur === 'notice' ? noticeTabHtml() : ''}
    ${cur === 'homework' && pSheets.length ? `<div class="card"><h2>출제된 시험지</h2><div style="font-size:12.5px;color:var(--muted);margin:-4px 0 10px;">선생님이 내 준 프린트 시험지입니다. 학생이 학원 앱에서 답안을 제출했는지 볼 수 있어요.</div>${pSheets.slice(0, 30).map((s) => { const di = dueInfo(s.dueDate, s.submitted); const t = s.submittedAt?.toDate ? s.submittedAt.toDate() : null; return `
        <div class="wk">
          <div class="t"><span>📄 ${esc(s.title || '시험지')}</span><small>${esc(s.teacherName || '')} 선생님 · ${shMdw(s.date)} 출제</small></div>
          <div style="font-size:13px;color:var(--muted);margin-top:5px;">${s.count || 0}문제${s.range ? ' · ' + esc(s.range) : ''}${di ? ` · 기한 <b style="color:${di.late ? '#D64545' : 'var(--ink)'};">${di.text}</b>` : ''}</div>
          ${s.submitted ? `<div style="margin-top:8px;font-size:12.5px;font-weight:700;color:#2E8B57;">✅ 답안 제출 완료${t ? ` · ${t.getMonth() + 1}/${t.getDate()} ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}` : ''}</div>` : `<div style="margin-top:8px;font-size:12.5px;font-weight:700;color:${di && di.late ? '#D64545' : 'var(--muted)'};">⏳ 아직 답안을 제출하지 않았어요${di && di.late ? ' (기한 지남)' : ''}</div>`}
        </div>`; }).join('')}</div>` : ''}
    ${cur === 'homework' ? `<div class="card"><h2>숙제</h2>${homework.length ? homework.slice(0, 60).map((h) => { const d = new Date(h.date + 'T00:00:00'); const dow = ['일','월','화','수','목','금','토'][d.getDay()]; const isToday = h.date === new Date().toISOString().slice(0, 10); return `
        <div class="wk" style="${isToday ? 'border-color:var(--accent);' : ''}">
          <div class="t"><span>${d.getMonth() + 1}월 ${d.getDate()}일 (${dow})${isToday ? ' <span class="pill" style="font-size:11px;">오늘</span>' : ''}</span><small>${esc(h.teacherName || '')} 선생님 · ${esc(h.classGroup || '')}</small></div>
          <div style="font-size:14.5px;color:var(--ink);margin-top:6px;white-space:pre-wrap;">${esc(h.content)}</div>
          ${!h.absent && h.dueDate ? `<div style="margin-top:6px;font-size:12.5px;color:var(--muted);">기한 <b style="color:var(--ink);">${dueInfo(h.dueDate, true).text}</b></div>` : ''}
          ${h.absent ? '' : hwChecks[h.id] ? (() => { const t = hwChecks[h.id].checkedAt?.toDate ? hwChecks[h.id].checkedAt.toDate() : null; return `<div style="margin-top:8px;font-size:12.5px;font-weight:700;color:#2E8B57;">✅ 학생이 완료 체크했어요${t ? ` · ${t.getMonth() + 1}/${t.getDate()} ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}` : ''}</div>`; })() : '<div style="margin-top:8px;font-size:12.5px;color:var(--muted);">⏳ 아직 완료 체크 안 함</div>'}
        </div>`; }).join('') : '<div class="empty">아직 등록된 숙제가 없습니다.</div>'}</div>` : ''}
    ${cur === 'monthly' ? `<div class="card"><h2>월간 학습보고서</h2>${monthly.length ? monthly.map((r, i) => { const open = i === 0 || openReports.has(r.id); return `
        <div class="item-wrap ${i === 0 ? 'latest' : ''}">
        <a class="item" href="#" onclick="${i === 0 ? 'return false;' : `pToggleReport('${r.id}');return false;`}">
          <div><div class="t">${r.month.replace('-', '년 ')}월 보고서${i === 0 ? '<span class="rep-tag">최신</span>' : ''}</div><div class="s">일일테스트 ${r.summary?.tests ?? 0}회 · ${r.summary?.total ?? 0}문항 · ${r.summary?.gradeBand ?? '-'}등급</div></div>
          <div class="r"><div class="pct">${r.summary?.pct ?? '-'}%</div><div class="go">${i === 0 ? '' : open ? '접기 ▲' : '보기 ▼'}</div></div>
        </a>
        ${open ? `<iframe class="rep-frame" id="rf-${r.id}" src="report.html?id=${encodeURIComponent(r.id)}&embed=1" style="height:${(frameHeights[r.id] || 900) + 4}px" title="보고서"></iframe>` : ''}
        ${threadHtml('monthly', r.id, r.teacherUid, r.teacherName, `${r.month.replace('-', '년 ')}월 보고서`)}
        </div>`; }).join('') : '<div class="empty">아직 공개된 보고서가 없습니다.<br><small>매달 초에 지난달 보고서가 올라옵니다.</small></div>'}</div>`
    : cur === 'weekly' ? `<div class="card"><h2>주간 성취도</h2>${weekly.length ? weekly.map((w) => { const rl = w.ratingsLabel || {}, rt = w.ratings || {}; return `
        <div class="wk">
          <div class="t"><span>${esc(w.weekLabel || w.weekKey)}</span><small>${esc(w.teacherName || '')} 선생님</small></div>
          <div class="pills"><span class="pill ${lvl(rt.homework)}">과제 ${esc(rl.homework || '-')}</span><span class="pill ${lvl(rt.attitude)}">수업태도 ${esc(rl.attitude || '-')}</span><span class="pill ${lvl(rt.clinic)}">클리닉 ${esc(rl.clinic || '-')}</span></div>
          ${w.memo ? `<div class="memo">${esc(w.memo)}</div>` : ''}
          ${threadHtml('weekly', w.id, w.teacherUid, w.teacherName, `주간성취도 ${w.weekLabel || w.weekKey}`)}
        </div>`; }).join('') : '<div class="empty">아직 등록된 주간 성취도가 없습니다.</div>'}</div>` : ''}
    <p class="foot">송우찬수학학원 ${child.branch === '산본관' ? '산본관 · 031-346-8899' : '평촌관 · 031-386-8899'}</p>`;
}
</script>
