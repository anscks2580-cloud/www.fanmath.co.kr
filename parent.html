<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>학부모 페이지 | 송우찬수학학원</title>
<link rel="icon" href="swc-logo.svg">
<style>
  :root { --ink:#1A1230; --ink-2:#4A4160; --muted:#8B86A0; --line:#E8E5F0; --paper:#F6F5FA; --card:#FFFFFF;
          --accent:#5B3FA6; --accent-soft:#EEE9F8; --gold:#C49A28; --gold-soft:#FBF3DA; --good:#2E8B57; --good-soft:#E3F3EA; --warn:#C8541F; --warn-soft:#FBE9E0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:var(--paper); color:var(--ink); line-height:1.5; }
  .wrap { max-width:720px; margin:0 auto; padding:16px 16px 48px; }
  .head { background:var(--ink); color:#fff; border-radius:16px; padding:20px; margin-bottom:14px; display:flex; align-items:center; gap:12px; }
  .head .brand { font-size:11px; letter-spacing:2px; color:#F0C040; font-weight:700; }
  .head h1 { font-size:20px; font-weight:800; margin-top:2px; }
  .head .sub { font-size:12px; opacity:.65; margin-top:2px; }
  .head button { margin-left:auto; background:transparent; border:1px solid rgba(255,255,255,.3); color:#fff; border-radius:8px; padding:6px 10px; font-size:12px; font-family:inherit; cursor:pointer; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tab { flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--card); font-size:14px; font-weight:700; color:var(--muted); font-family:inherit; cursor:pointer; }
  .tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:10px; }
  .card h2 { font-size:14px; font-weight:800; margin-bottom:10px; }
  .item { display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--line); border-radius:12px; margin-bottom:8px; text-decoration:none; color:inherit; }
  .item:hover { border-color:var(--accent); }
  .item .t { font-weight:700; font-size:14.5px; }
  .item .s { font-size:12px; color:var(--muted); margin-top:2px; }
  .item .r { margin-left:auto; text-align:right; }
  .item .pct { font-size:18px; font-weight:800; color:var(--accent); }
  .item .go { font-size:12px; color:var(--accent); font-weight:700; white-space:nowrap; }
  .wk { padding:12px 14px; border:1px solid var(--line); border-radius:12px; margin-bottom:8px; }
  .wk .t { font-weight:700; font-size:14px; display:flex; justify-content:space-between; }
  .wk .t small { color:var(--muted); font-weight:500; }
  .pills { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 6px; }
  .pill { font-size:12px; padding:3px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .pill.lo { background:var(--warn-soft); color:var(--warn); } .pill.hi { background:var(--good-soft); color:var(--good); }
  .memo { font-size:13.5px; color:var(--ink-2); background:var(--gold-soft); border-left:3px solid var(--gold); padding:8px 12px; border-radius:8px; margin-top:6px; white-space:pre-wrap; }
  .empty { text-align:center; color:var(--muted); padding:36px 0; font-size:14px; }
  .noti { background:#C8541F; color:#fff; border-radius:14px; padding:14px 16px; margin-bottom:12px; box-shadow:0 8px 24px rgba(200,84,31,0.3); animation:notiIn .4s ease; }
  @keyframes notiIn { from { transform:translateY(-8px); opacity:0; } to { transform:none; opacity:1; } }
  .noti h3 { font-size:15px; font-weight:800; display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .noti h3 .dot { width:10px; height:10px; border-radius:50%; background:#fff; animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }
  .noti button { display:flex; width:100%; align-items:center; gap:8px; background:rgba(255,255,255,.15); border:none; color:#fff; border-radius:10px; padding:9px 12px; margin-top:6px; font-family:inherit; font-size:13px; cursor:pointer; text-align:left; }
  .noti button:hover { background:rgba(255,255,255,.25); }
  .noti button b { white-space:nowrap; }
  .noti button span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; opacity:.9; }
  .cm-box { margin-top:10px; background:#F7F5FC; border:1px solid #E3DDF3; border-radius:12px; padding:10px 12px; }
  .cm-head { display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:800; color:var(--accent); margin-bottom:6px; }
  .cm-head small { font-weight:500; color:var(--muted); }
  .cm-new { background:var(--warn); color:#fff; font-size:10px; padding:1px 7px; border-radius:999px; }
  .cm { padding:8px 10px; border-radius:10px; margin-bottom:6px; font-size:13px; line-height:1.55; }
  .cm .txt { white-space:pre-wrap; }
  .cm.parent { background:var(--accent-soft); margin-left:24px; }
  .cm.teacher { background:var(--gold-soft); margin-right:24px; }
  .cm .who { font-size:11px; color:var(--muted); margin-bottom:2px; display:flex; gap:8px; align-items:center; }
  .cm .who .act { margin-left:auto; display:flex; gap:8px; }
  .cm .who .act button { background:none; border:none; color:var(--muted); font-size:11px; font-family:inherit; cursor:pointer; padding:0; }
  .cm .who .act button:hover { color:var(--accent); }
  .cm textarea { width:100%; min-height:48px; padding:8px 10px; border:1px solid var(--accent); border-radius:8px; font-family:inherit; font-size:13px; resize:vertical; outline:none; margin-top:4px; }
  .cm .eact { display:flex; gap:6px; justify-content:flex-end; margin-top:4px; }
  .cm .eact button { font-family:inherit; font-size:12px; border-radius:8px; padding:5px 10px; cursor:pointer; border:1px solid var(--line); background:#fff; }
  .cm .eact button.ok { background:var(--accent); color:#fff; border-color:var(--accent); }
  .cm-form { display:flex; gap:6px; margin-top:4px; }
  .cm-form textarea { flex:1; min-height:42px; padding:9px 12px; border:1.5px solid #CFC6EA; background:#fff; border-radius:10px; font-family:inherit; font-size:13.5px; resize:vertical; outline:none; }
  .cm-form textarea::placeholder { color:#9A92B8; }
  .cm-form textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(91,63,166,.12); }
  .cm-form button { background:var(--accent); color:#fff; border:none; border-radius:10px; padding:0 16px; font-family:inherit; font-size:13.5px; font-weight:800; cursor:pointer; white-space:nowrap; }
  .cm-form button:hover { filter:brightness(1.08); }
  .item-wrap { border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
  .item-wrap.latest { border-color:var(--accent); box-shadow:0 4px 18px rgba(91,63,166,.12); }
  .rep-frame { width:100%; border:none; display:block; border-radius:12px; background:transparent; margin-top:10px; min-height:200px; }
  .rep-tag { font-size:10.5px; padding:2px 8px; border-radius:999px; background:var(--accent); color:#fff; font-weight:700; margin-left:6px; vertical-align:middle; }
  .item-wrap .item { border:none; padding:0; margin:0; }
  .foot { font-size:11px; color:var(--muted); text-align:center; margin-top:16px; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">불러오는 중...</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, collection, query, where, addDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({ apiKey: "AIzaSyD_eYNKzfa-aT41E3Dqt_HyJc6UeSR5ErA", authDomain: "songmath.firebaseapp.com", projectId: "songmath", storageBucket: "songmath.firebasestorage.app", messagingSenderId: "936295436575", appId: "1:936295436575:web:d1e201508719850cfbe02a" });
const auth = getAuth(app), db = getFirestore(app);
const $app = document.getElementById('app');
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let cur = 'homework', child = null, weekly = [], monthly = [], comments = [], homework = [], me = null;
const openReports = new Set();   // 펼쳐진 보고서 id (최신 달은 자동)
const frameHeights = {};
window.addEventListener('message', (e) => { if (e.data && e.data.type === 'reportHeight' && e.data.id) { frameHeights[e.data.id] = e.data.h; const f = document.getElementById('rf-' + e.data.id); if (f) f.style.height = (e.data.h + 4) + 'px'; } });
window.pToggleReport = (id) => { if (openReports.has(id)) openReports.delete(id); else openReports.add(id); render(); };
// viewer: 'parent'(학부모 본인) | 'student'(학생 계정) | 'teacher'(선생님·관리자가 ?student=학생uid 로 열어봄 — 답글 작성용)
let viewer = { role: 'parent', name: '' };
const params = new URLSearchParams(location.search);
const openThreads = new Set();

onAuthStateChanged(auth, async (user) => {
  if (!user) { location.replace('login.html'); return; }
  me = user;
  try {
    const p = await getDoc(doc(db, 'parents', user.uid));
    let studentId;
    if (p.exists()) { studentId = p.data().studentId; viewer = { role: 'parent', name: '' }; }
    else {
      const s = await getDoc(doc(db, 'students', user.uid));
      if (s.exists()) { studentId = user.uid; viewer = { role: 'student', name: s.data().name || '' }; } // 학생 계정으로도 열람 가능
      else if (params.get('student')) {
        // 선생님·관리자가 특정 학생의 학부모 화면을 열어 답글 작성
        const t = await getDoc(doc(db, 'teachers', user.uid));
        const a = t.exists() ? null : await getDoc(doc(db, 'admins', user.uid));
        if (t.exists() || (a && a.exists())) { studentId = params.get('student'); viewer = { role: 'teacher', name: (t.exists() ? t.data().name : a.data().name) || '', isTeacher: t.exists() }; }
      }
    }
    if (!studentId) { $app.innerHTML = '<div class="empty">학부모 계정이 아닙니다. 학원에 문의해 주세요.</div>'; return; }
    const sd = await getDoc(doc(db, 'students', studentId));
    child = { id: studentId, ...(sd.exists() ? sd.data() : {}) };
    const [ws, ms, cs, hs] = await Promise.all([
      getDocs(query(collection(db, 'weeklyReports'), where('studentId', '==', studentId))),
      getDocs(query(collection(db, 'studentReports'), where('studentId', '==', studentId), where('status', '==', 'sent'))),
      // 선생님은 규칙상 본인 담당 댓글만 읽을 수 있으므로 조건을 좁혀서 조회 (관리자는 전체)
      getDocs(viewer.role === 'teacher' && viewer.isTeacher
        ? query(collection(db, 'reportComments'), where('studentId', '==', studentId), where('teacherUid', '==', user.uid))
        : query(collection(db, 'reportComments'), where('studentId', '==', studentId))),
      getDocs(query(collection(db, 'homeworkLogs'), where('studentIds', 'array-contains', studentId))),
    ]);
    homework = []; hs.forEach((d) => homework.push({ id: d.id, ...d.data() }));
    homework.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    comments = []; cs.forEach((d) => comments.push({ id: d.id, ...d.data() }));
    comments.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
    weekly = []; ws.forEach((d) => weekly.push({ id: d.id, ...d.data() }));
    weekly.sort((a, b) => (b.weekKey || '').localeCompare(a.weekKey || ''));
    monthly = []; ms.forEach((d) => monthly.push({ id: d.id, ...d.data() }));
    monthly.sort((a, b) => (b.month || '').localeCompare(a.month || ''));
    render();
  } catch (e) { $app.innerHTML = `<div class="empty">불러오지 못했습니다.<br><small>${esc(e.message)}</small></div>`; }
});

window.pTab = (t) => { cur = t; render(); };
const threadOf = (type, id) => comments.filter((c) => c.targetType === type && c.targetId === id);
const isTeacherView = () => viewer.role === 'teacher';
// 안 읽은 글: 학부모 화면에선 선생님 답글, 선생님 화면에선 학부모 댓글
const unreadOf = (type, id) => threadOf(type, id).filter((c) => isTeacherView() ? (c.authorRole === 'parent' && !c.readByTeacher) : (c.authorRole === 'teacher' && !c.readByParent)).length;
window.pMarkRead = async (key) => {
  const [type, id] = key.split('|');
  const field = isTeacherView() ? 'readByTeacher' : 'readByParent';
  const unread = threadOf(type, id).filter((c) => isTeacherView() ? (c.authorRole === 'parent' && !c.readByTeacher) : (c.authorRole === 'teacher' && !c.readByParent));
  if (!unread.length) return;
  for (const c of unread) { try { await updateDoc(doc(db, 'reportComments', c.id), { [field]: true }); c[field] = true; } catch (e) {} }
  render(); try { window.parent.postMessage({ type: 'pcRead' }, '*'); } catch (e) {}
};
window.pToggle = async (key) => {
  if (openThreads.has(key)) openThreads.delete(key); else openThreads.add(key);
  render();
  // 열면 상대방 글 읽음 처리
  if (openThreads.has(key)) {
    const [type, id] = key.split('|');
    const field = isTeacherView() ? 'readByTeacher' : 'readByParent';
    const unread = threadOf(type, id).filter((c) => isTeacherView() ? (c.authorRole === 'parent' && !c.readByTeacher) : (c.authorRole === 'teacher' && !c.readByParent));
    for (const c of unread) { try { await updateDoc(doc(db, 'reportComments', c.id), { [field]: true }); c[field] = true; } catch (e) {} }
    if (unread.length) { render(); try { window.parent.postMessage({ type: 'pcRead' }, '*'); } catch (e) {} }
  }
};
let editingId = null;
window.pEdit = (id) => { editingId = id; render(); const ta = document.getElementById(`cm-edit-${id}`); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } };
window.pEditCancel = () => { editingId = null; render(); };
window.pEditSave = async (id) => {
  const c = comments.find((x) => x.id === id); if (!c) return;
  const text = (document.getElementById(`cm-edit-${id}`)?.value || '').trim();
  if (!text) { alert('내용을 적어주세요.'); return; }
  try { await updateDoc(doc(db, 'reportComments', id), { text, editedAt: new Date().toISOString() }); c.text = text; c.editedAt = new Date().toISOString(); editingId = null; render(); }
  catch (e) { alert('수정하지 못했습니다: ' + e.message); }
};
window.pDelete = async (id) => {
  const c = comments.find((x) => x.id === id); if (!c) return;
  if (!confirm('이 글을 삭제할까요?')) return;
  try { await deleteDoc(doc(db, 'reportComments', id)); comments = comments.filter((x) => x.id !== id); render(); try { window.parent.postMessage({ type: 'pcRead' }, '*'); } catch (e) {} }
  catch (e) { alert('삭제하지 못했습니다: ' + e.message); }
};
window.pSend = async (type, id, teacherUid, teacherName, label) => {
  const ta = document.getElementById(`cm-ta-${type}-${id}`);
  const text = (ta?.value || '').trim();
  if (!text) return;
  ta.disabled = true;
  try {
    const asTeacher = isTeacherView();
    const data = {
      targetType: type, targetId: id, targetLabel: label,
      studentId: child.id, studentName: child.name || '',
      teacherUid: asTeacher ? me.uid : (teacherUid || child.teacherUid || ''), teacherName: asTeacher ? viewer.name : (teacherName || child.teacherName || ''),
      authorRole: asTeacher ? 'teacher' : 'parent', authorUid: me.uid, authorName: asTeacher ? `${viewer.name} 선생님` : `${child.name} 학부모`,
      text, readByTeacher: asTeacher, readByParent: !asTeacher, createdAt: serverTimestamp(),
    };
    const ref = await addDoc(collection(db, 'reportComments'), data);
    comments.push({ id: ref.id, ...data, createdAt: { seconds: Date.now() / 1000 } });
    if (asTeacher) { // 답글 달면 그 대화의 학부모 댓글은 읽음 처리
      for (const c of threadOf(type, id).filter((c) => c.authorRole === 'parent' && !c.readByTeacher)) { try { await updateDoc(doc(db, 'reportComments', c.id), { readByTeacher: true }); c.readByTeacher = true; } catch (e) {} }
      try { window.parent.postMessage({ type: 'pcRead' }, '*'); } catch (e) {}
    }
    render();
  } catch (e) { alert('댓글을 보내지 못했습니다: ' + e.message); ta.disabled = false; }
};
// 들어오자마자 보이는 알림: 안 읽은 상대방 글을 대화별로 모아 맨 위에
function notiHtml() {
  const unread = comments.filter((c) => isTeacherView() ? (c.authorRole === 'parent' && !c.readByTeacher) : (c.authorRole === 'teacher' && !c.readByParent));
  if (!unread.length) return '';
  const groups = {};
  unread.forEach((c) => { const k = `${c.targetType}|${c.targetId}`; (groups[k] = groups[k] || { c, n: 0 }).n++; });
  return `<div class="noti">
    <h3><span class="dot"></span>${isTeacherView() ? `학부모 댓글 ${unread.length}개가 답글을 기다려요` : `선생님 답글 ${unread.length}개가 도착했어요`}</h3>
    ${Object.entries(groups).map(([k, g]) => `<button onclick="pGoThread('${k}')"><b>${esc(g.c.targetLabel || '')}</b><span>${esc(g.c.authorName || '')}: ${esc(g.c.text)}</span><b>›</b></button>`).join('')}
  </div>`;
}
window.pGoThread = async (key) => {
  const [type] = key.split('|');
  cur = type === 'weekly' ? 'weekly' : type === 'monthly' ? 'monthly' : cur;
  await pMarkRead(key); render();
  setTimeout(() => { const el = document.getElementById(`th-${key.replace(/[^a-zA-Z0-9]/g, '_')}`); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 50);
};
function threadHtml(type, id, teacherUid, teacherName, label) {
  const key = `${type}|${id}`, th = threadOf(type, id), unread = unreadOf(type, id);
  const who = isTeacherView() ? '학부모님께 답글' : '선생님께 한마디';
  return `<div class="cm-box" id="th-${key.replace(/[^a-zA-Z0-9]/g, '_')}">
      <div class="cm-head">💬 ${who} ${th.length ? `<small>대화 ${th.length}개</small>` : `<small>${isTeacherView() ? '' : '궁금한 점이나 전하실 말씀을 남겨주세요'}</small>`} ${unread ? `<span class="cm-new">${isTeacherView() ? '새 댓글' : '새 답글'} ${unread}</span>` : ''}</div>
      ${th.map((c) => { const mine = c.authorUid === me.uid; const editing = editingId === c.id; return `<div class="cm ${c.authorRole}" id="cm-${c.id}">
        <div class="who"><span>${esc(c.authorName || (c.authorRole === 'teacher' ? '선생님' : '학부모'))} · ${c.createdAt?.seconds ? new Date(c.createdAt.seconds * 1000).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' }) : ''}${c.editedAt ? ' · 수정됨' : ''}</span>
          ${mine && !editing ? `<span class="act"><button onclick="pEdit('${c.id}')">수정</button><button onclick="pDelete('${c.id}')">삭제</button></span>` : ''}</div>
${editing ? `<textarea id="cm-edit-${c.id}">${esc(c.text)}</textarea><div class="eact"><button onclick="pEditCancel()">취소</button><button class="ok" onclick="pEditSave('${c.id}')">저장</button></div>` : `<div class="txt">${esc(c.text)}</div>`}</div>`; }).join('')}
      <div class="cm-form"><textarea id="cm-ta-${type}-${id}" placeholder="${isTeacherView() ? '답글을 입력하세요' : '예: 요즘 집에서 숙제를 힘들어해요…'}" onfocus="pMarkRead('${key}')"></textarea><button onclick="pSend('${type}','${id}','${esc(teacherUid || '')}','${esc(teacherName || '')}','${esc(label)}')">보내기</button></div>
    </div>`;
}
window.pLogout = async () => { await signOut(auth); location.replace('login.html'); };

const tabDot = (type) => comments.some((c) => c.targetType === type && (isTeacherView() ? (c.authorRole === 'parent' && !c.readByTeacher) : (c.authorRole === 'teacher' && !c.readByParent))) ? ' <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#C8541F;vertical-align:middle;margin-left:2px;"></span>' : '';
function render() {
  const lvl = (v) => v >= 4 ? 'hi' : v <= 2 ? 'lo' : '';
  $app.innerHTML = `
    <div class="head">
      <div><div class="brand">SONGMATH · 학부모${isTeacherView() ? ` <span style="background:#C8541F;color:#fff;padding:1px 8px;border-radius:999px;font-size:10px;letter-spacing:0;">선생님 보기 · ${esc(viewer.name)}</span>` : ''}</div><h1>${esc(child.name)} 학생</h1><div class="sub">${esc(child.grade || '')}${child.classGroup ? ' · ' + esc(child.classGroup) : ''}${child.teacherName ? ' · ' + esc(child.teacherName) + ' 선생님' : ''}</div></div>
      ${isTeacherView() ? '' : '<button onclick="pLogout()">로그아웃</button>'}
    </div>
    ${notiHtml()}
    <div class="tabs">
      <button class="tab ${cur === 'homework' ? 'active' : ''}" onclick="pTab('homework')">숙제</button>
      <button class="tab ${cur === 'weekly' ? 'active' : ''}" onclick="pTab('weekly')">주간 성취도${tabDot('weekly')}</button>
      <button class="tab ${cur === 'monthly' ? 'active' : ''}" onclick="pTab('monthly')">월간 보고서${tabDot('monthly')}</button>
    </div>
    ${cur === 'homework' ? `<div class="card"><h2>숙제</h2>${homework.length ? homework.slice(0, 60).map((h) => { const d = new Date(h.date + 'T00:00:00'); const dow = ['일','월','화','수','목','금','토'][d.getDay()]; const isToday = h.date === new Date().toISOString().slice(0, 10); return `
        <div class="wk" style="${isToday ? 'border-color:var(--accent);' : ''}">
          <div class="t"><span>${d.getMonth() + 1}월 ${d.getDate()}일 (${dow})${isToday ? ' <span class="pill" style="font-size:11px;">오늘</span>' : ''}</span><small>${esc(h.teacherName || '')} 선생님 · ${esc(h.classGroup || '')}</small></div>
          <div style="font-size:14.5px;color:var(--ink);margin-top:6px;white-space:pre-wrap;">${esc(h.content)}</div>
        </div>`; }).join('') : '<div class="empty">아직 등록된 숙제가 없습니다.</div>'}</div>` : ''}
    ${cur === 'monthly' ? `<div class="card"><h2>월간 학습보고서</h2>${monthly.length ? monthly.map((r, i) => { const open = i === 0 || openReports.has(r.id); return `
        <div class="item-wrap ${i === 0 ? 'latest' : ''}">
        <a class="item" href="#" onclick="${i === 0 ? 'return false;' : `pToggleReport('${r.id}');return false;`}">
          <div><div class="t">${r.month.replace('-', '년 ')}월 보고서${i === 0 ? '<span class="rep-tag">최신</span>' : ''}</div><div class="s">일일테스트 ${r.summary?.tests ?? 0}회 · ${r.summary?.total ?? 0}문항 · ${r.summary?.gradeBand ?? '-'}등급</div></div>
          <div class="r"><div class="pct">${r.summary?.pct ?? '-'}%</div><div class="go">${i === 0 ? '' : open ? '접기 ▲' : '보기 ▼'}</div></div>
        </a>
        ${open ? `<iframe class="rep-frame" id="rf-${r.id}" src="report.html?id=${encodeURIComponent(r.id)}&embed=1" style="height:${(frameHeights[r.id] || 900) + 4}px" title="보고서"></iframe>` : ''}
        ${threadHtml('monthly', r.id, r.teacherUid, r.teacherName, `${r.month.replace('-', '년 ')}월 보고서`)}
        </div>`; }).join('') : '<div class="empty">아직 공개된 보고서가 없습니다.<br><small>매달 초에 지난달 보고서가 올라옵니다.</small></div>'}</div>`
    : cur === 'weekly' ? `<div class="card"><h2>주간 성취도</h2>${weekly.length ? weekly.map((w) => { const rl = w.ratingsLabel || {}, rt = w.ratings || {}; return `
        <div class="wk">
          <div class="t"><span>${esc(w.weekLabel || w.weekKey)}</span><small>${esc(w.teacherName || '')} 선생님</small></div>
          <div class="pills"><span class="pill ${lvl(rt.homework)}">과제 ${esc(rl.homework || '-')}</span><span class="pill ${lvl(rt.attitude)}">수업태도 ${esc(rl.attitude || '-')}</span><span class="pill ${lvl(rt.clinic)}">클리닉 ${esc(rl.clinic || '-')}</span></div>
          ${w.memo ? `<div class="memo">${esc(w.memo)}</div>` : ''}
          ${threadHtml('weekly', w.id, w.teacherUid, w.teacherName, `주간성취도 ${w.weekLabel || w.weekKey}`)}
        </div>`; }).join('') : '<div class="empty">아직 등록된 주간 성취도가 없습니다.</div>'}</div>` : ''}
    <p class="foot">송우찬수학학원 평촌관 · 031-386-8899</p>`;
}
</script>
</body>
</html>
