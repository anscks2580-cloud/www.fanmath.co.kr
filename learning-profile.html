<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>상담 전 학습 성향 체크 | 송우찬수학학원 평촌관</title>
<meta name="description" content="상담 전 학생·학부모가 각각 작성하는 사실 기반 학습 성향 체크 — 송우찬수학학원 평촌관">
<meta name="theme-color" content="#F4F0E8">

<script>
/* =====================================================================
   ★ 콘텐츠 설정 — 문항·유형·문구는 이 영역만 수정하면 됩니다
   ---------------------------------------------------------------------
   설계 원칙 (사실 기반)
   1) 성격이 아닌 '행동'을 묻는다      — "나는 성실하다" ✕ / "숙제를 기한 내 낸 비율" ○
   2) 기간을 정한다                    — 최근 2주, 지난 시험
   3) 횟수·시점으로 답하게 한다         — 좋은 답이 티 나지 않도록
   4) 학부모는 '관찰한 것'만 답한다     — 모르면 '잘 모르겠다' (점수 계산에서 제외)
   5) 학생·학부모 문항은 같은 축을 거울처럼 측정 → 상담 때 응답 차이를 비교
   ===================================================================== */

const BRAND = {
  logo: 'assets/logo-watermark.png',
  consultUrl: 'consult.html',
  phone: '031-386-8899',
  kakao: 'https://pf.kakao.com/_KxaxdlX',
  saveCollection: 'learningProfiles'   // 참고용: 상담 기록과 연결된 결과는 consult-flow.js 에서 learningProfiles/{상담ID}_{역할} 로 저장 (보안 규칙과 연결되어 있어 이름 고정)
};

/* 4개 측정 축 — 각 축은 연구로 검증된 학습 요인에 근거 */
const AXES = {
  M: { name: '학습 동기', hi: 'I', lo: 'O', hiName: '자기주도', loName: '외부동기',
       basis: '자기결정성 이론 · Ryan & Deci (2000), American Psychologist — 스스로 선택한 학습이 지속성과 성취를 높인다',
       hiText: '누가 시키지 않아도 스스로 공부를 시작하는 편입니다. 목표와 도전 과제를 주면 더 크게 성장합니다.',
       loText: '공부 시작이 외부(학원·부모님·시험)에 의해 움직이는 편입니다. 작은 성공 경험과 명확한 단기 목표가 필요합니다.' },
  S: { name: '학습 전략', hi: 'A', lo: 'R', hiName: '능동인출', loName: '반복읽기',
       basis: 'Dunlosky 외 (2013), Psychological Science in the Public Interest — 10가지 학습법 비교에서 스스로 떠올려 풀기·간격 복습은 효과 "높음", 다시 읽기·밑줄은 "낮음"',
       hiText: '답을 가리고 다시 풀기, 며칠 뒤 다시 풀기처럼 효과가 검증된 방법을 쓰고 있습니다.',
       loText: '공부 시간에 비해 효과가 낮은 방법(다시 읽기·해설 보기) 비중이 큽니다. 공부량보다 공부 방식을 바꾸는 것이 먼저입니다.' },
  E: { name: '실행 관리', hi: 'P', lo: 'L', hiName: '계획실행', loName: '막판집중',
       basis: '자기조절학습 · Zimmerman (2002), Theory Into Practice / 미루기 메타분석 · Steel (2007), Psychological Bulletin',
       hiText: '숙제와 시험 준비를 미리 시작하고 끝까지 마무리하는 편입니다.',
       loText: '공부가 마감 직전에 몰리는 편입니다. 주 단위 계획과 중간 점검이 있으면 실력이 안정적으로 쌓입니다.' },
  T: { name: '실전 안정', hi: 'S', lo: 'N', hiName: '실전안정', loName: '실전긴장',
       basis: '수학 불안 · Ashcraft (2002), Current Directions in Psychological Science / AMAS 척도 · Hopko 외 (2003), Assessment',
       hiText: '시험장에서도 평소 실력을 비교적 그대로 발휘합니다.',
       loText: '알고 있는 문제를 시험에서 놓치는 경우가 있습니다. 실전 연습과 풀이 순서 전략으로 줄일 수 있습니다.' }
};

/* 공통 응답 옵션의 점수: 0~3 (높을수록 hi 성향), null = 모름(계산 제외) */
const STUDENT_Q = [
  { axis:'M', text:'최근 2주 동안, 누가 시키지 않았는데<br>스스로 수학 공부를 시작한 날은?',
    hint:'학원 수업·숙제 시간은 빼고 세어 보세요.',
    opts:[['없었다',0],['1~2일',1],['3~5일',2],['6일 이상',3]] },
  { axis:'M', text:'지난 한 달 동안, 시험 범위가 아닌<br>수학 문제를 스스로 풀어본 적이 있나요?',
    hint:'궁금해서, 더 어려운 걸 풀어보고 싶어서 등 이유는 상관없어요.',

    opts:[['교재·필기를 다시 읽기',0],['풀었던 문제의 해설 다시 보기',1],['새로운 문제를 많이 풀기',2],['풀었던 문제를 답 가리고 다시 풀기',3]] },
  { axis:'S', text:'틀린 문제는<br>보통 언제 다시 풀어보나요?',
    hint:'해설을 읽는 것이 아니라 직접 다시 푸는 것을 기준으로 답하세요.',
    opts:[['다시 풀지 않는다',0],['해설 보고 바로 끝낸다',1],['시험 직전에 몰아서',2],['며칠 뒤에 다시 푼다',3]] },
  { axis:'E', text:'최근 2주 동안, 학원 숙제를<br>기한 안에 다 해간 비율은?',
    opts:[['거의 못 해갔다',0],['절반 정도',1],['대부분',2],['전부',3]] },
  { axis:'E', text:'지난 시험,<br>시험 공부를 처음 시작한 시점은?',
    hint:'학원 정규 수업이 아니라, 시험을 위한 공부를 시작한 때예요.',
    opts:[['시험 3일 전 이내',0],['약 1주 전',1],['약 2주 전',2],['3주 이상 전',3]] },
  { axis:'T', text:'지난 시험에서 풀이법을 알았는데<br>실수로 틀린 문항은 몇 개인가요?',
    hint:'계산 실수, 문제 잘못 읽기, 옮겨 적기 실수 모두 포함해요.',
    opts:[['3개 이상',0],['2개',1],['1개',2],['없었다',3]] },
  { axis:'T', text:'시험 중 막히는 문제가 나왔을 때<br>실제로 어떻게 했나요?',
    hint:'지난 시험에서 실제로 했던 행동을 떠올려 보세요.',
    opts:[['머리가 하얘지고 뒷문제까지 흔들렸다',0],['한참 붙잡고 있었다',1],['조금 고민하다 넘겼다',2],['바로 표시하고 넘겼다',3]] },
  /* 참고 문항 (점수 계산 X, 상담 자료로만 표시) */
  { axis:null, key:'studyTime', text:'학원을 제외하고, 평일 하루<br>혼자 수학 공부하는 시간은?',
    opts:[['거의 없음',null],['30분 이내',null],['30분~1시간',null],['1시간 이상',null]] }
];

const PARENT_Q = [
  { axis:'M', text:'최근 2주 동안, 자녀가 시키지 않았는데<br>스스로 공부를 시작하는 모습을 본 날은?',
    opts:[['없었다',0],['1~2일',1],['3~5일',2],['6일 이상',3],['잘 모르겠다',null]] },
  { axis:'M', text:'평소 자녀에게<br>"공부하라"는 말을 하는 횟수는?',
    opts:[['하루 3번 이상',0],['하루 1~2번',1],['일주일에 몇 번',2],['거의 하지 않는다',3]] },
  { axis:'S', text:'시험 기간, 자녀가 공부하는 모습은<br>주로 어떤가요?',
    hint:'직접 본 모습을 기준으로 골라 주세요.',
    opts:[['책·필기를 읽고 있다',0],['해설이나 강의를 보고 있다',1],['문제를 풀고 있다',2],['잘 모르겠다',null]] },
  { axis:'S', text:'자녀가 틀린 문제를<br>다시 풀어보는 모습을 본 적이 있나요?',
    opts:[['본 적 없다',0],['드물게 본다',1],['시험 전에 몰아서 한다',2],['평소에 자주 한다',3],['잘 모르겠다',null]] },
  { axis:'E', text:'자녀가 학원 숙제를<br>부모님 확인 없이 끝내는 정도는?',
    opts:[['확인해도 잘 안 한다',0],['확인해야 한다',1],['가끔 확인하면 된다',2],['확인하지 않아도 한다',3],['잘 모르겠다',null]] },
  { axis:'E', text:'지난 시험, 자녀가 시험 공부를<br>시작한 시점은?',
    opts:[['시험 3일 전 이내',0],['약 1주 전',1],['약 2주 전',2],['3주 이상 전',3],['잘 모르겠다',null]] },
  { axis:'T', text:'시험이 끝난 뒤 자녀가<br>"아는 건데 실수했다"고 말한 적이 있나요?',
    hint:'최근 두 번의 시험을 기준으로 답해 주세요.',
    opts:[['매번 그렇다',0],['자주 그렇다',1],['가끔 있다',2],['거의 없다',3],['잘 모르겠다',null]] },
  { axis:'T', text:'시험 전날·당일<br>자녀의 모습은 어땠나요?',
    opts:[['잠을 못 자거나 많이 불안해했다',0],['평소보다 예민했다',1],['약간 긴장한 정도',2],['평소와 같았다',3],['잘 모르겠다',null]] },
  /* 참고 문항 */
  { axis:null, key:'manager', text:'현재 가정에서 자녀의 공부 관리는<br>주로 누가 하나요?',
    opts:[['자녀 스스로',null],['부모님이 체크',null],['학원에 맡기고 있음',null],['따로 관리하지 않음',null]] },
  { axis:null, key:'phone', text:'자녀의 휴대폰 사용에 대한<br>규칙이 있나요?',
    opts:[['정해진 규칙이 있고 잘 지킨다',null],['규칙은 있지만 잘 안 지켜진다',null],['규칙이 없다',null]] }
];


/* 처음 화면에 표시되는 연구 근거 (실제 학술지 게재 연구) */
const RESEARCH = [
  { axis:'M', no:'01', title:'학습 동기', theory:'자기결정성 이론',
    finding:'스스로 선택해서 시작한 공부가, 시켜서 하는 공부보다 오래 지속되고 성취도 높다.',
    cite:'Ryan & Deci (2000) · American Psychologist' },
  { axis:'S', no:'02', title:'학습 전략', theory:'학습법 효과 비교 연구',
    finding:'10가지 공부법을 비교한 결과, 답을 가리고 떠올려 풀기·간격 두고 복습하기는 효과가 높고 다시 읽기·밑줄 긋기는 낮다.',
    cite:'Dunlosky 외 (2013) · Psychological Science in the Public Interest' },
  { axis:'E', no:'03', title:'실행 관리', theory:'자기조절학습 · 미루기 연구',
    finding:'계획 → 실행 → 점검을 스스로 하는 학생이 성취가 높고, 미루는 습관은 성적과 부(-)의 관계를 보인다.',
    cite:'Zimmerman (2002) · Theory Into Practice / Steel (2007) · Psychological Bulletin' },
  { axis:'T', no:'04', title:'실전 안정', theory:'수학 불안 연구',

    cite:'Ashcraft (2002) · Current Directions in Psychological Science / Hopko 외 (2003) · Assessment' }

/* 16유형 이름 (동기 I/O · 전략 A/R · 실행 P/L · 실전 S/N) */
const TYPE_NAMES = {
  IAPS:'올라운더형',          IAPN:'실전 리허설 필요형',   IALS:'막판 스퍼트형',        IALN:'열정 과속형',
  IRPS:'성실한 복습러형',     IRPN:'꼼꼼한 걱정러형',      IRLS:'감 좋은 즉흥형',       IRLN:'의욕 앞선 출발형',
  OAPS:'가이드 최적화형',     OAPN:'신중한 모범생형',      OALS:'잠재력 대기형',        OALN:'시동 필요형',
  ORPS:'성실 루틴형',         ORPN:'노력 대비 아쉬움형',   ORLS:'여유만만형',           ORLN:'처음부터 설계형'
};
</script>

<style>
:root{
  --bg:#F4F0E8; --paper:#FBF9F4; --ink:#1E1733; --ink-2:#5A5370; --ink-3:#8E879E;
  --line:rgba(37,28,64,.12); --hair:rgba(37,28,64,.08);
  --purple:#2D2350; --purple-deep:#251C40; --purple-soft:#6B5A9E;
  --gold:#C9A24A; --gold-bright:#F0C040;
  --ease:cubic-bezier(.2,.7,.2,1);
  --serif:'Cormorant Garamond','Times New Roman',serif;
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;min-height:100svh;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(800px 800px at 100% -10%,rgba(107,90,158,.12),transparent 60%),radial-gradient(700px 700px at -10% 110%,rgba(201,162,74,.14),transparent 60%)}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--purple-soft);outline-offset:3px}

.top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:20px clamp(20px,4vw,48px)}
.brand{display:flex;align-items:center;gap:9px;font-size:15px;letter-spacing:-.02em}
.brand img{width:30px;height:30px;object-fit:contain}
.brand b{font-weight:800}.brand span{color:var(--ink-2);font-weight:500}
.top-tag{font-family:var(--serif);font-style:italic;color:var(--ink-3);font-size:15px}

.wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:12px 20px 60px}
.screen{animation:in .5s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.26em;color:var(--purple-soft)}
.eyebrow::before{content:"";width:18px;height:1px;background:currentColor;opacity:.5}
.eyebrow.gold{color:var(--gold)}
h1{margin-top:16px;font-size:clamp(28px,6vw,42px);font-weight:800;letter-spacing:-.045em;line-height:1.3}
h1 em{font-style:normal;color:var(--purple);background:linear-gradient(transparent 64%,rgba(201,162,74,.3) 64%,rgba(201,162,74,.3) 92%,transparent 92%)}
.lead{margin-top:14px;font-size:16px;line-height:1.75;color:var(--ink-2)}

.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 12px 30px -24px rgba(37,28,64,.4)}
.principles{margin-top:28px;display:grid;gap:10px}
.principle{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:rgba(251,249,244,.7);border:1px solid var(--hair)}
.principle b{font-family:var(--serif);font-size:22px;color:var(--gold);line-height:1;flex:none;width:26px}
.principle p{font-size:14.5px;line-height:1.6;color:var(--ink-2)}
.principle p strong{color:var(--ink)}

.roles{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.role{text-align:left;padding:22px 20px;border-radius:22px;background:var(--paper);border:1px solid var(--line);transition:transform .3s var(--ease),border-color .3s,box-shadow .3s}
.role .k{font-size:11px;font-weight:700;letter-spacing:.24em;color:var(--gold)}
.role .t{display:block;margin-top:10px;font-size:22px;font-weight:800;letter-spacing:-.04em}
.role .d{display:block;margin-top:6px;font-size:13px;color:var(--ink-3);line-height:1.5}
@media (hover:hover){.role:hover{transform:translateY(-3px);border-color:rgba(45,35,80,.4);box-shadow:0 20px 34px -22px rgba(37,28,64,.5)}}
.role:active{transform:scale(.98)}

<body>

<header class="top">
  <div class="brand"><img id="brandLogo" alt=""><b>송우찬수학학원</b><span>평촌관</span></div>
  <div class="top-tag">Learning Profile</div>
</header>

<nav class="steps" id="steps" aria-label="상담 진행 단계" hidden>
  <ol>
    <li><b>1</b><span class="lf">상담신청서</span><span class="ls">신청서</span></li>

    <li><b>3</b><span class="lf">결과 확인</span><span class="ls">결과</span></li>
    <li><b>4</b><span class="lf">안내 영상</span><span class="ls">영상</span></li>
  </ol>
</nav>

<main class="wrap"><div class="screen" id="screen"></div></main>

<script>
const ARROW = '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const BACK = '<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>';
const RETRY = '<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg>';
const PRINT = '<svg viewBox="0 0 24 24"><path d="M7 9V4h10v5M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v6H7z"/></svg>';

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const screen = $('#screen');
const state = { role:null, idx:0, answers:[], saving:false, saved:false };

if (BRAND.logo) $('#brandLogo').src = BRAND.logo; else $('#brandLogo').remove();
$('#brandLogo') && $('#brandLogo').addEventListener('error', e => e.target.remove());

const Q = () => state.role === 'student' ? STUDENT_Q : PARENT_Q;
function show(html){ screen.innerHTML = html; screen.style.animation = 'none'; void screen.offsetWidth; screen.style.animation = ''; window.scrollTo(0,0); }

/* ---------- 0. 상담 기록 연결 (URL 파라미터) ----------
   learning-profile.html                              → 단독 체험 모드 (저장 안 함, 기존과 동일)
   learning-profile.html?cid=상담ID&role=parent&flow=visit → 상담신청서 다음 단계 (학부모 설문 → 결과 → 안내 영상)
   learning-profile.html?cid=상담ID&role=student         → 관리자 화면에서 시작하는 학생 설문 (관리자 로그인 필요)
   ※ 학생 이름·연락처는 URL에 넣지 않고 상담 기록에서 불러옵니다. */
const PARAMS = new URLSearchParams(location.search);
const LINK = {
  cid: (PARAMS.get('cid') || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 40) || null,
  role: PARAMS.get('role'),
  flow: PARAMS.get('flow') === 'visit' ? 'visit' : 'admin',
  kiosk: PARAMS.get('kiosk') === '1',
  s: (PARAMS.get('s') || '').replace(/[^\w-]/g, '').slice(0, 40),
  src: PARAMS.get('src') === 'tablet' ? 'tablet' : ''
};
const CTX = { api:null, session:null, record:null, name:'', lastResult:null, videoSrc:undefined, videoErr:null, videoFinishing:false, admin:null };
if (LINK.kiosk) document.body.classList.add('kiosk');
const isVisitFlow = () => !!LINK.cid && LINK.flow === 'visit';
let apiPromise = null;
function loadApi(){ return apiPromise || (apiPromise = import('./consult-flow.js').then(m => (CTX.api = m)).catch(e => { apiPromise = null; throw e; })); }
function notifyParent(event, extra = {}){ try { if (window.parent !== window) window.parent.postMessage({ type:'swc-consult', event, ...extra }, location.origin); } catch(e){} }
function fmtTime(ts){
  const d = ts && ts.toDate ? ts.toDate() : (ts instanceof Date ? ts : null);
  if (!d) return '';
  const p = n => String(n).padStart(2, '0');
  return `${d.getMonth()+1}월 ${d.getDate()}일 ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function formUrl(){
  const q = new URLSearchParams();
  const b = CTX.record && CTX.record.branch; if (b) q.set('b', b);
  if (LINK.s) q.set('s', LINK.s);
  if (LINK.kiosk) q.set('kiosk', '1');
  if (LINK.src) q.set('src', LINK.src);
  return 'consult-visit.html' + (q.toString() ? '?' + q.toString() : '');
}
function setSteps(n){
  const el = $('#steps');
  if (!isVisitFlow() || !n){ el.hidden = true; return; }
  el.hidden = false;
  el.querySelectorAll('li').forEach((li, i) => {
    li.classList.toggle('on', i + 1 === n);
    li.classList.toggle('done', i + 1 < n);
    if (i + 1 === n) li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current');
  });
}

/* ---------- 1. 인트로 ---------- */
function renderIntro(){
  setSteps(0);
  show(`
    <p class="eyebrow">RESEARCH-BASED LEARNING PROFILE</p>
    <h1>감이 아니라 <em>연구</em>로,<br>우리 아이 공부 습관을 봅니다</h1>
    <p class="lead">교육심리학에서 성적과의 관계가 검증된 4가지 학습 요인을, 실제 행동을 묻는 문항으로 확인합니다.<br>학생과 학부모님이 각각 작성하시면 상담 때 두 결과를 함께 봅니다.</p>
    <div class="trust">

  screen.querySelectorAll('[data-role]').forEach(b => b.addEventListener('click', () => LINK.cid ? renderConfirm(b.dataset.role) : startSurvey(b.dataset.role)));

/* ---------- 2. 설문 시작 ---------- */
/* 상담 기록과 연결된 설문은 고른 답(번호만)을 이 탭에 잠시 보관 → 새로고침해도 이어서 진행 */
const ANS_TTL = 2 * 3600 * 1000;
const ansKey = role => `swc_lp_answers:${LINK.cid}:${role}`;
function saveAnswersLocal(){ if (!LINK.cid) return; try { sessionStorage.setItem(ansKey(state.role), JSON.stringify({ at: Date.now(), a: state.answers.map(x => x === undefined ? null : x) })); } catch(e){} }
function loadAnswersLocal(role){
  if (!LINK.cid) return null;
  try { const v = JSON.parse(sessionStorage.getItem(ansKey(role)) || 'null'); if (v && Date.now() - v.at < ANS_TTL && Array.isArray(v.a)) return v.a; } catch(e){}
  return null;
}
function clearAnswersLocal(role){ try { sessionStorage.removeItem(ansKey(role || state.role)); } catch(e){} }
function startSurvey(role, opts = {}){
  state.role = role; state.idx = 0; state.saved = false;
  state.answers = new Array(Q().length).fill(undefined);
  const kept = opts.resume ? loadAnswersLocal(role) : null;
  if (kept && kept.length === state.answers.length){
    state.answers = kept.map(x => (x === null || x === undefined) ? undefined : x);
    const first = state.answers.findIndex(x => x === undefined);
    if (first === -1){ state.idx = state.answers.length - 1; renderResult(); return; }
    state.idx = first;
  } else if (!opts.resume) clearAnswersLocal(role);
  renderQuestion();
}

/* ---------- 3. 문항 ---------- */
function renderQuestion(){
  setSteps(2);
  const list = Q(), q = list[state.idx], n = list.length;
  const axisLabel = q.axis ? AXES[q.axis].name : '참고 정보';
  const picked = state.answers[state.idx];
  const who = CTX.name ? `<span class="who">${esc(CTX.name)} 학생 · ${state.role === 'student' ? '학생' : '학부모'}</span>` : '';
  show(`
    <div class="qtop"><button class="back" id="bk">${BACK}이전</button>${who}<span class="count"><b>${String(state.idx+1).padStart(2,'0')}</b> / ${String(n).padStart(2,'0')}</span></div>
    <div class="progress"><i style="width:${(state.idx / n) * 100}%"></i></div>
    <p class="q-axis">${axisLabel}</p>
    <h2 class="q-text">${q.text}</h2>
    ${q.hint ? `<p class="q-hint">${q.hint}</p>` : ''}
    <div class="opts">
      ${q.opts.map((o, i) => `<button class="opt ${o[0]==='잘 모르겠다'?'unknown':''} ${picked===i?'on':''}" data-i="${i}"><span>${esc(o[0])}</span><span class="mk"></span></button>`).join('')}
    </div>`);
  requestAnimationFrame(() => { const p = $('.progress i'); if (p) p.style.width = ((state.idx + (picked!==undefined?1:0)) / n * 100) + '%'; });
  $('#bk').addEventListener('click', () => {
    if (state.idx > 0){ state.idx--; renderQuestion(); return; }
    if (isVisitFlow()) location.href = formUrl();          // 상담신청서로 돌아가기 (저장된 내용 그대로 불러옴)
    else if (LINK.cid) renderConfirm(state.role);
    else renderIntro();
  });
  let moving = false;
  screen.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    if (moving) return; moving = true;
    screen.querySelectorAll('.opt').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    state.answers[state.idx] = +b.dataset.i;
    saveAnswersLocal();
    $('.progress i').style.width = ((state.idx + 1) / n * 100) + '%';
    setTimeout(() => { if (state.idx < n - 1){ state.idx++; renderQuestion(); } else renderResult(); }, 260);
  }));
}

/* ---------- 4. 채점 ---------- */
function score(){
  const list = Q(), by = { M:[], S:[], E:[], T:[] }, extra = {};
  list.forEach((q, i) => {
    const o = q.opts[state.answers[i]];
    if (!o) return;
    if (q.axis){ if (o[1] !== null) by[q.axis].push(o[1]); }
    else extra[q.key] = o[0];
  });
  const axes = {};
  Object.keys(by).forEach(k => {
    const a = by[k];
    axes[k] = a.length ? Math.round(a.reduce((s, v) => s + v, 0) / (a.length * 3) * 100) : null;
  });
  const code = Object.keys(AXES).map(k => axes[k] === null ? '?' : (axes[k] >= 50 ? AXES[k].hi : AXES[k].lo)).join('');
  return { axes, code, extra };
}

/* ---------- 5. 결과 ---------- */
function renderResult(opts = {}){
  setSteps(3);
  const { axes, code, extra } = score();
  const isS = state.role === 'student', name = esc(CTX.name);
  const typeName = TYPE_NAMES[code] || '관찰 정보 보완 필요';
  const valid = Object.entries(axes).filter(([,v]) => v !== null);
  const weakest = valid.length ? valid.sort((a, b) => a[1] - b[1])[0] : null;

  const axisHtml = Object.keys(AXES).map(k => {
    const a = AXES[k], v = axes[k];
    if (v === null) return `<div class="axis"><div class="axis-top"><b>${a.name}</b><span>-</span></div>
      <p class="nodata">'잘 모르겠다' 응답이 많아 판단하지 않았습니다. 상담 때 함께 확인하겠습니다.</p></div>`;
    const hi = v >= 50, mid = v >= 40 && v <= 60;
    return `<div class="axis">
      <div class="axis-top"><b>${a.name}</b><span>${mid ? '균형에 가까움 · ' : ''}${hi ? a.hiName : a.loName}</span></div>
      <div class="bar"><i style="left:0%" data-v="${v}"></i></div>
      <div class="bar-lbl"><span>${a.loName}</span><span>${a.hiName}</span></div>

      <p class="basis">근거 · ${a.basis}</p>

  }).join('');

  const extraLabels = { studyTime:'평일 혼자 공부 시간', manager:'가정 내 공부 관리', phone:'휴대폰 사용 규칙' };
  const factsHtml = Object.keys(extra).length ? `
    <p class="sec-title">참고 정보</p>
    <div class="facts">${Object.entries(extra).map(([k, v]) => `<div class="fact"><span>${extraLabels[k] || k}</span><b>${esc(v)}</b></div>`).join('')}</div>` : '';

  const focusHtml = weakest && weakest[1] < 50 ? `
    <p class="sec-title">상담 때 집중할 부분</p>
    <div class="focus"><b>${AXES[weakest[0]].name.toUpperCase()}</b><p>${AXES[weakest[0]].loText}</p></div>` : '';

  let actions;
  if (isVisitFlow()) actions = `
    <div class="res-actions">
      <button class="cta full" id="toVideo" disabled style="margin-top:0">다음 단계로 · 안내 영상<span class="arw">${ARROW}</span></button>
      <div class="row">
        <button class="ghost" id="edit">${BACK}응답 수정</button>
        <button class="ghost" id="print">${PRINT}저장·인쇄</button>
      </div>
    </div>`;
  else if (LINK.cid) actions = `
    <div class="res-actions">
      <div class="handoff" id="handoff" hidden>저장되었습니다. 태블릿을 선생님께 전달해 주세요.</div>
      <div class="row">
        <button class="ghost" id="edit">${BACK}응답 수정</button>
        <button class="ghost" id="print">${PRINT}저장·인쇄</button>
        ${LINK.kiosk ? '' : '<a class="ghost" href="admin.html">관리자 화면으로</a>'}
      </div>
    </div>`;
  else actions = `
    <div class="res-actions">
      <a class="cta full" href="${esc(BRAND.consultUrl)}" style="margin-top:0">상담 신청하기<span class="arw">${ARROW}</span></a>
      <div class="row">
        <button class="ghost" id="other">${isS ? '학부모용도 작성하기' : '학생용도 작성하기'}</button>
        <button class="ghost" id="print">${PRINT}저장·인쇄</button>
        <button class="ghost" id="retry">${RETRY}처음으로</button>
      </div>
    </div>
    <div id="linkPanel"></div>`;

  show(`
    <div class="res-head">
      <p class="eyebrow gold">${isS ? 'MY LEARNING PROFILE' : 'OBSERVED PROFILE'}</p>
      <p class="res-who">${name ? name + ' · ' : ''}${isS ? '학생 응답' : '학부모 응답'}</p>
      <div class="code">${code.split('').map(c => `<span>${c}</span>`).join('')}</div>
      <h1 class="type-name">${esc(typeName)}</h1>
      <p class="res-sub">${isS ? '내가 답한 실제 학습 행동' : `학부모님이 관찰하신 ${name ? name + ' 학생' : '자녀'}의 학습 모습`}을 4개 축으로 정리했어요.</p>
    </div>
    <p class="disclaimer">이 결과는 응답한 행동을 바탕으로 한 <b>상담 참고 자료</b>이며 심리검사가 아닙니다. 학생용과 학부모용 결과가 다르게 나오는 부분이 상담에서 가장 중요한 이야깃거리가 됩니다.</p>
    <p class="sec-title">4가지 학습 축</p>
    ${axisHtml}
    ${focusHtml}
    ${factsHtml}
    <p class="save-state" id="saveState" aria-live="polite"></p>
    ${actions}
    <p class="foot">송우찬수학학원 평촌관 · <a href="tel:${BRAND.phone}">${BRAND.phone}</a></p>`);

  requestAnimationFrame(() => setTimeout(() => screen.querySelectorAll('.bar i').forEach(el => el.style.left = el.dataset.v + '%'), 60));
  $('#print').addEventListener('click', () => window.print());
  const edit = $('#edit');
  if (edit) edit.addEventListener('click', () => { state.idx = Q().length - 1; renderQuestion(); });
  if ($('#retry')) $('#retry').addEventListener('click', () => { state.role = null; renderIntro(); });
  if ($('#other')) $('#other').addEventListener('click', () => { startSurvey(isS ? 'parent' : 'student'); });
  const toVideo = $('#toVideo');
  if (toVideo) toVideo.addEventListener('click', () => { if (!toVideo.disabled) renderVideo(); });

  CTX.lastResult = buildPayload({ axes, code, extra, typeName, weakest });
  if (LINK.cid){
    if (opts.restored !== undefined) setSave('restored', opts.restored);
    else saveFlowResult();
  } else renderLinkPanel();
}

/* 저장용 결과 묶음 — 관리자 화면은 이 값을 그대로 보여줌 (새 진단을 따로 만들지 않음) */
function buildPayload({ axes, code, extra, typeName, weakest }){
  const list = Q();
  const answers = list.map((q, i) => ({ q: q.text.replace(/<br>/g, ' '), axis: q.axis, a: q.opts[state.answers[i]]?.[0] ?? null, score: q.opts[state.answers[i]]?.[1] ?? null }));
  const axisDetail = {};
  Object.keys(AXES).forEach(k => {
    const a = AXES[k], v = axes[k], hi = v !== null && v >= 50;
    axisDetail[k] = { name: a.name, value: v, hiName: a.hiName, loName: a.loName,
      side: v === null ? null : (hi ? a.hi : a.lo), sideName: v === null ? null : (hi ? a.hiName : a.loName),
      balanced: v !== null && v >= 40 && v <= 60, text: v === null ? null : (hi ? a.hiText : a.loText) };
  });
  const focus = weakest && weakest[1] < 50 ? { axis: weakest[0], name: AXES[weakest[0]].name, text: AXES[weakest[0]].loText } : null;
  return { code, typeName, axes, extra, answers, answerIdx: state.answers.map(x => x === undefined ? null : x), axisDetail, focus };
}

/* ---------- 6. 저장 (상담 기록에 연결) ---------- */
function setSave(kind, text){
  const el = $('#saveState'); if (!el) return;
  el.className = 'save-state ' + kind;
  if (kind === 'saving') el.innerHTML = '결과를 상담 기록에 저장하는 중…';
  else if (kind === 'ok') el.innerHTML = '✓ 결과가 상담 기록에 저장되었습니다.';
  else if (kind === 'restored') el.innerHTML = `✓ 저장된 결과입니다${text ? ' · ' + esc(text) : ''}`;
  else if (kind === 'err'){
    el.innerHTML = `<span>${esc(text)}</span><button class="ghost sm" id="saveRetry">${RETRY}다시 저장</button>`;
    $('#saveRetry').addEventListener('click', () => saveFlowResult());
  }
  const ok = kind === 'ok' || kind === 'restored';
  const next = $('#toVideo'); if (next) next.disabled = !ok;   // 저장이 확인돼야 다음 단계로
  const ho = $('#handoff'); if (ho) ho.hidden = kind !== 'ok';
}
async function saveFlowResult(){
  if (state.saving || !CTX.lastResult) return;
  state.saving = true; state.saved = false;
  setSave('saving');
  try {
    const api = await loadApi();
    CTX.record = await api.saveSurvey(CTX.session, LINK.cid, state.role, CTX.lastResult);
    state.saved = true;
    clearAnswersLocal();
    setSave('ok');
    notifyParent('survey_saved', { cid: LINK.cid, role: state.role });
  } catch(e){
    console.error('[설문 결과 저장 실패]', e);
    setSave('err', CTX.api ? CTX.api.errorMessage(e, '결과 저장') : '결과를 저장하지 못했습니다. 다시 시도해 주세요.');
  } finally { state.saving = false; }
}

/* ---------- 7. 안내 영상 ---------- */
const PLAYER = { el:null, api:null, timer:null, ended:false, unmute:null, tap:null, vimeoP:null, ytP:null };
function loadScript(src){
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = res; s.onerror = () => rej(new Error('script ' + src)); document.head.appendChild(s); });
}
function ensureVimeo(){ if (window.Vimeo && window.Vimeo.Player) return Promise.resolve(); return PLAYER.vimeoP || (PLAYER.vimeoP = loadScript('https://player.vimeo.com/api/player.js').catch(e => { PLAYER.vimeoP = null; throw e; })); }
function ensureYT(){
  if (window.YT && window.YT.Player) return Promise.resolve();
  return PLAYER.ytP || (PLAYER.ytP = new Promise((res, rej) => {
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (prev) prev(); res(); };
    loadScript('https://www.youtube.com/iframe_api').catch(e => { PLAYER.ytP = null; rej(e); });
  }));
}
async function prefetchVideo(){
  try {
    const api = await loadApi();
    const cfg = await api.loadVideoConfig(CTX.session);
    CTX.videoSrc = api.parseVideoSource(cfg); CTX.videoErr = null;
    if (CTX.videoSrc && CTX.videoSrc.kind === 'vimeo') ensureVimeo().catch(() => {});
    if (CTX.videoSrc && CTX.videoSrc.kind === 'youtube') ensureYT().catch(() => {});
  } catch(e){ console.error('[안내 영상 설정 불러오기 실패]', e); CTX.videoSrc = undefined; CTX.videoErr = e; }
}
function renderVideo(){
  setSteps(4);
  const name = esc(CTX.name);
  if (CTX.videoSrc === undefined){
    if (CTX.videoErr){
      show(`<div class="flow-msg"><p class="eyebrow gold">GUIDE VIDEO</p><h2>안내 영상 정보를 불러오지 못했습니다</h2>
        <p>${esc(CTX.api ? CTX.api.errorMessage(CTX.videoErr, '영상 정보 확인') : '인터넷 연결을 확인해 주세요.')}<br>상담 진행에는 문제가 없습니다.</p>
        <div class="res-actions"><button class="cta full" id="vRetry">${RETRY.replace('<svg', '<svg width="16" height="16"')} 다시 시도</button><button class="ghost" id="vSkip">영상 없이 완료하기</button></div></div>`);
      $('#vRetry').addEventListener('click', async () => { renderLoading('영상 정보를 확인하는 중…'); await prefetchVideo(); renderVideo(); });
      $('#vSkip').addEventListener('click', () => finishVideo('failed'));
      return;
    }
    renderLoading('영상 정보를 확인하는 중…');
    prefetchVideo().then(renderVideo);
    return;
  }
  if (!CTX.videoSrc){ finishVideo('none'); return; }   // 등록된 영상이 없으면 영상 단계 없이 완료
  const src = CTX.videoSrc;
  show(`
    <div class="vid-head">
      <p class="eyebrow gold">GUIDE VIDEO</p>
      <h2 class="vid-title">상담 전에 안내 영상을<br>잠시 봐 주세요</h2>
      ${name ? `<p class="res-who">${name} 학생 학부모님</p>` : ''}
    </div>
    <div class="vid-stage ${src.kind === 'file' ? 'file' : ''}" id="vidStage">
      <div class="vid-msg" id="vidMsg">영상을 불러오는 중…</div>
      <button class="vid-tap" id="vidTap" hidden aria-label="영상 재생"><span>▶</span>눌러서 재생</button>
    </div>
    <div class="vid-ctrl"><button class="ghost" id="vidSound" hidden>🔊 소리 켜기</button></div>
    <div class="res-actions"><div class="row"><button class="ghost" id="vidSkip">영상 건너뛰고 완료하기</button></div></div>`);
  $('#vidSkip').addEventListener('click', () => finishVideo('skipped'));
  $('#vidSound').addEventListener('click', () => PLAYER.unmute && PLAYER.unmute());
  $('#vidTap').addEventListener('click', () => PLAYER.tap && PLAYER.tap());
  mountPlayer(src);   // 버튼을 누른 직후 바로 재생 시도 (브라우저 자동 재생 정책상 소리 재생 가능성이 가장 높음)
}
function mountPlayer(src){
  const stage = $('#vidStage'), msg = $('#vidMsg');
  PLAYER.ended = false;
  const ui = {
    playing(){ clearTimeout(PLAYER.timer); if (msg) msg.hidden = true; const t = $('#vidTap'); if (t) t.hidden = true; },
    needTap(){ clearTimeout(PLAYER.timer); if (msg) msg.hidden = true; const t = $('#vidTap'); if (t) t.hidden = false; },
    muted(){ const b = $('#vidSound'); if (b) b.hidden = false; },
    ended(){ if (PLAYER.ended) return; PLAYER.ended = true; finishVideo('completed'); },
    error(why){ clearTimeout(PLAYER.timer); showVideoError(why); }
  };
  clearTimeout(PLAYER.timer);
  PLAYER.timer = setTimeout(() => ui.error('timeout'), 20000);
  if (src.kind === 'file'){
    const v = document.createElement('video');
    v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
    v.playsInline = true; v.controls = true; v.preload = 'auto';
    v.src = src.url;
    stage.appendChild(v); PLAYER.el = v;
    v.addEventListener('loadedmetadata', () => { if (src.start && v.currentTime < src.start) v.currentTime = src.start; }, { once:true });
    v.addEventListener('playing', ui.playing);
    v.addEventListener('ended', ui.ended);
    v.addEventListener('timeupdate', () => { if (src.end && v.currentTime >= src.end){ v.pause(); ui.ended(); } });
    v.addEventListener('error', () => ui.error('load'));
    const p = v.play();
    if (p && p.catch) p.catch(err => {
      if (err && err.name === 'NotAllowedError'){ v.muted = true; v.play().then(ui.muted).catch(ui.needTap); }
    });
    PLAYER.unmute = () => { v.muted = false; v.volume = 1; $('#vidSound').hidden = true; };
    PLAYER.tap = () => { v.muted = false; v.play().then(ui.playing).catch(() => { v.muted = true; v.play().then(() => { ui.playing(); ui.muted(); }).catch(() => ui.error('blocked')); }); };
  } else if (src.kind === 'vimeo'){
    const f = document.createElement('iframe');
    f.src = `https://player.vimeo.com/video/${encodeURIComponent(src.id)}?${src.hash ? 'h=' + encodeURIComponent(src.hash) + '&' : ''}autoplay=1&playsinline=1&title=0&byline=0&portrait=0&dnt=1${src.start ? '#t=' + Math.floor(src.start) + 's' : ''}`;
    f.allow = 'autoplay; fullscreen; picture-in-picture'; f.setAttribute('allowfullscreen', ''); f.title = src.title || '상담 안내 영상';
    stage.appendChild(f); PLAYER.el = f;
    ensureVimeo().then(() => {
      const pl = new Vimeo.Player(f); PLAYER.api = pl;
      pl.on('play', ui.playing); pl.on('ended', ui.ended); pl.on('error', () => ui.error('load'));
      if (src.end) pl.on('timeupdate', d => { if (d.seconds >= src.end){ pl.pause().catch(() => {}); ui.ended(); } });
      pl.ready().then(() => pl.play())
        .catch(() => pl.setMuted(true).then(() => pl.play()).then(ui.muted).catch(ui.needTap));
      PLAYER.unmute = () => { pl.setMuted(false).catch(() => {}); pl.setVolume(1).catch(() => {}); $('#vidSound').hidden = true; };
      PLAYER.tap = () => { pl.setMuted(false).then(() => pl.play()).then(ui.playing).catch(() => pl.setMuted(true).then(() => pl.play()).then(() => { ui.playing(); ui.muted(); }).catch(() => ui.error('blocked'))); };
    }).catch(() => ui.error('load'));
  } else if (src.kind === 'youtube'){
    const holder = document.createElement('div'); holder.id = 'ytHolder'; stage.appendChild(holder);
    ensureYT().then(() => {
      const vars = { autoplay:1, playsinline:1, rel:0, modestbranding:1 };
      if (src.start) vars.start = Math.floor(src.start);
      if (src.end) vars.end = Math.floor(src.end);
      const pl = new YT.Player('ytHolder', { videoId: src.id, playerVars: vars, events: {
        onReady: e => {
          e.target.playVideo();
          setTimeout(() => {
            const st = e.target.getPlayerState();
            if (st === YT.PlayerState.PLAYING || st === YT.PlayerState.BUFFERING) return;
            e.target.mute(); e.target.playVideo();
            setTimeout(() => { if (e.target.getPlayerState() === YT.PlayerState.PLAYING) ui.muted(); else ui.needTap(); }, 1500);
          }, 1500);
        },
        onStateChange: e => { if (e.data === YT.PlayerState.PLAYING) ui.playing(); if (e.data === YT.PlayerState.ENDED) ui.ended(); },
        onError: () => ui.error('load')
      }});
      PLAYER.api = pl;
      PLAYER.unmute = () => { pl.unMute(); pl.setVolume(100); $('#vidSound').hidden = true; };
      PLAYER.tap = () => { pl.unMute(); pl.playVideo(); };
    }).catch(() => ui.error('load'));
  }
}
function destroyPlayer(){
  clearTimeout(PLAYER.timer);
  try { if (PLAYER.api && PLAYER.api.destroy) PLAYER.api.destroy(); } catch(e){}
  try { if (PLAYER.el && PLAYER.el.pause) PLAYER.el.pause(); } catch(e){}
  PLAYER.el = null; PLAYER.api = null; PLAYER.unmute = null; PLAYER.tap = null;
}
function showVideoError(why){

  stage.classList.remove('file');

/* 영상 단계 마무리 — 영상 기록 저장에 실패해도 상담신청서·설문 결과는 이미 저장되어 있으므로 진행을 막지 않음 */
async function finishVideo(status){
  if (CTX.videoFinishing) return;
  CTX.videoFinishing = true;
  destroyPlayer();
  renderLoading('마무리하는 중…');
  let warn = '';
  try { const api = await loadApi(); await api.saveVideoStatus(CTX.session, LINK.cid, status); }
  catch(e){ console.error('[영상 단계 기록 실패]', e); warn = CTX.api ? CTX.api.errorMessage(e, '영상 진행 기록') : '영상 진행 기록을 저장하지 못했습니다.'; }
  CTX.videoStatus = status;
  CTX.videoFinishing = false;
  renderDone({ warn });
}

  // 공용 기기 보호: QR 방문자 세션은 여기서 종료 (같은 기기 다음 사용자가 이 기록을 열 수 없음)

/* 저장된 응답으로 결과 화면 다시 보기 (다시 저장하지 않음) */
async function showSavedResult(role){
  try {
    const api = await loadApi();
    const prof = await api.loadProfile(CTX.session, LINK.cid, role);
    const list = role === 'student' ? STUDENT_Q : PARENT_Q;
    if (!prof || !Array.isArray(prof.answerIdx) || prof.answerIdx.length !== list.length) return false;
    state.role = role;
    state.answers = prof.answerIdx.map(x => (x === null || x === undefined) ? undefined : x);
    state.idx = list.length - 1;
    const s = CTX.record && CTX.record[role + 'Survey'];
    renderResult({ restored: fmtTime((s && s.at) || prof.completedAt) });
    return true;
  } catch(e){ console.error('[저장된 응답 불러오기 실패]', e); return false; }
}

/* ---------- 10. 단독 결과 → 상담 기록 연결 (관리자 로그인 기기에서만 보임) ----------
   이름만 같은 기록은 자동 연결하지 않고, 이름·학교·연락처를 확인해 관리자가 직접 고릅니다. */
const LINKER = { list:null, done:false };
function renderLinkPanel(){
  const el = $('#linkPanel');
  if (!el || !CTX.admin) return;
  LINKER.done = false;
  const roleKo = state.role === 'student' ? '학생' : '학부모';
  el.innerHTML = `
    <p class="sec-title">관리자 · 상담 기록에 연결</p>
    <div class="axis link-box">
      <p class="note" style="margin-top:0">이 ${roleKo} 설문 결과를 상담 기록에 연결합니다. 이름 또는 연락처(4자리 이상)로 찾은 뒤 <b>학교·연락처를 확인해 직접 선택</b>해 주세요. 이름만 같은 기록은 자동으로 연결하지 않습니다.</p>
      <form class="link-row" id="lkForm"><input id="lkQ" type="search" placeholder="학생 이름 또는 연락처" autocomplete="off"><button class="ghost" type="submit">찾기</button></form>
      <div class="link-list" id="lkList"></div>
      <p class="link-msg" id="lkMsg"></p>
    </div>`;
  $('#lkForm').addEventListener('submit', async e => {
    e.preventDefault();
    const q = $('#lkQ').value.trim(), msg = $('#lkMsg'), listEl = $('#lkList');
    msg.className = 'link-msg'; listEl.innerHTML = '';
    if (!q){ msg.textContent = '이름 또는 연락처를 입력해 주세요.'; return; }
    msg.textContent = '찾는 중…';
    try {
      const api = await loadApi();
      if (!LINKER.list) LINKER.list = await api.listRecentConsults(CTX.admin, 400);
      const dq = api.digits(q);
      const hits = LINKER.list.filter(d => dq.length >= 4
        ? (api.digits(d.parentPhone).includes(dq) || api.digits(d.studentPhone).includes(dq))
        : String(d.studentName || '').replace(/\s/g, '').includes(q.replace(/\s/g, ''))).slice(0, 30);
      if (!hits.length){ msg.textContent = '일치하는 상담 기록이 없습니다.'; return; }
      msg.textContent = hits.length > 1 ? `${hits.length}건 — 학교·연락처를 확인해 선택해 주세요.` : '';
      listEl.innerHTML = hits.map(d => {
        const s = d[state.role + 'Survey'], has = s && s.status === 'completed';
        const dt = d.createdAt && d.createdAt.toDate ? d.createdAt.toDate().toLocaleDateString('ko-KR') : '';
        return `<button type="button" class="link-item" data-id="${esc(d.id)}">
          <b>${esc(d.studentName || '이름 없음')}</b> · ${esc(d.schoolGrade || '')} · ${esc(d.level ? d.level + '부' : '')} · ${esc(d.branch || '')}
          <small>학부모 ${esc(d.parentPhone || '-')} · 학생 ${esc(d.studentPhone || '-')} · 접수 ${esc(dt)}</small>
          ${has ? `<em>이미 ${roleKo} 설문(${esc(s.typeName || '')})이 있음 — 선택하면 새 결과로 바뀝니다</em>` : ''}</button>`;
      }).join('');
    } catch(x){ console.error(x); msg.className = 'link-msg err'; msg.textContent = CTX.api ? CTX.api.errorMessage(x, '상담 기록 조회') : '상담 기록을 불러오지 못했습니다.'; }
  });
  $('#lkList').addEventListener('click', async e => {
    const b = e.target.closest('.link-item'); if (!b || LINKER.done) return;
    const d = (LINKER.list || []).find(x => x.id === b.dataset.id); if (!d) return;
    const s = d[state.role + 'Survey'], has = s && s.status === 'completed';
    if (!confirm(`${d.studentName} (${d.schoolGrade || '-'}, 학부모 ${d.parentPhone || '-'}) 상담 기록에 이 ${roleKo} 설문 결과를 연결할까요?${has ? '\n기존 ' + roleKo + ' 결과는 새 결과로 바뀝니다. (다른 쪽 설문 결과는 그대로 유지)' : ''}`)) return;
    const msg = $('#lkMsg'); msg.className = 'link-msg'; msg.textContent = '연결하는 중…';
    LINKER.done = true;
    try {
      const api = await loadApi();
      await api.saveSurvey(CTX.admin, d.id, state.role, CTX.lastResult, { source:'standalone-link' });
      msg.className = 'link-msg ok'; msg.textContent = `✓ ${d.studentName} 학생 상담 기록에 ${roleKo} 설문 결과를 연결했습니다.`;
      $('#lkList').innerHTML = ''; LINKER.list = null;
    } catch(x){ LINKER.done = false; console.error(x); msg.className = 'link-msg err'; msg.textContent = CTX.api ? CTX.api.errorMessage(x, '연결') : '연결하지 못했습니다.'; }
  });
}

/* ---------- 11. 시작 ---------- */
async function boot(){
  if (!LINK.cid){            // 단독 체험 모드 — 기존 동작 그대로 (저장하지 않음)
    if (LINK.role === 'student' || LINK.role === 'parent') startSurvey(LINK.role); else renderIntro();
    detectAdminForLink();
    return;
  }
  let api;
  try { api = await loadApi(); }
  catch(e){ console.error(e); return renderFlowError('페이지 구성 요소를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.', boot); }
  // 이미 마친 상담 (완료 후 새로고침) — 방문자 세션은 종료되었으므로 완료 화면만 표시
  const p = api.pointer.get(LINK.s);
  if (isVisitFlow() && p && p.done && p.cid === LINK.cid){ CTX.name = ''; return renderDone({ generic:true }); }
  renderLoading('상담 기록을 불러오는 중…');
  let session;
  try { session = await api.openSession({ allowVisitor: isVisitFlow() }); }
  catch(e){ console.error(e); return renderFlowError(api.errorMessage(e, '연결'), boot); }
  if (!session) return renderGate();
  CTX.session = session;
  let rec;
  try { rec = await api.loadConsult(session, LINK.cid); }
  catch(e){ console.error(e); return renderFlowError(api.errorMessage(e, '상담 기록 불러오기'), boot); }
  if (!rec) return renderFlowError('상담 기록을 찾을 수 없습니다. 상담신청서부터 다시 진행해 주세요.', null);
  CTX.record = rec; CTX.name = rec.studentName || '';

  if (isVisitFlow()){
    api.pointer.set({ cid: LINK.cid }, LINK.s);
    prefetchVideo();
    if (rec.parentSurvey && rec.parentSurvey.status === 'completed'){
      // 이미 완료된 학부모 설문은 처음부터 다시 하지 않고 저장된 결과를 보여줌
      if (await showSavedResult('parent')) return;
      return renderSavedSummary(rec);
    }
    return startSurvey('parent', { resume:true });
  }
  const role = LINK.role === 'student' || LINK.role === 'parent' ? LINK.role : null;
  if (!role) return renderIntro();
  renderConfirm(role);
}
/* 응답 원본을 다시 그릴 수 없을 때(문항 변경 등) 저장된 요약만 표시 */
function renderSavedSummary(rec){
  setSteps(3);
  const s = rec.parentSurvey || {};
  show(`<div class="res-head"><p class="eyebrow gold">OBSERVED PROFILE</p>
      <p class="res-who">${esc(CTX.name)} · 학부모 응답</p>
      <div class="code">${String(s.code || '').split('').map(c => `<span>${esc(c)}</span>`).join('')}</div>
      <h1 class="type-name">${esc(s.typeName || '')}</h1>
      <p class="res-sub">${esc(fmtTime(s.at))}에 저장된 학부모 설문 결과입니다.</p></div>
    <div class="res-actions">
      <button class="cta full" id="toVideo">다음 단계로 · 안내 영상<span class="arw">${ARROW}</span></button>
      <div class="row"><button class="ghost" id="redo">${RETRY}설문 다시 하기</button></div>
    </div>`);
  $('#toVideo').addEventListener('click', () => renderVideo());
  $('#redo').addEventListener('click', () => startSurvey('parent'));
}

boot();
</script>
</body>
</html>
