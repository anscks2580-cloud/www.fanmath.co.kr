<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>송우찬수학학원 평촌관 - 홍보영상</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; background:#000; overflow:hidden;
    font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;
  }
  #stage { position:fixed; inset:0; background:#000; }
  #player-wrap { position:absolute; inset:0; }
  iframe { width:100%; height:100%; border:0; display:block; }

  #start-overlay {
    position:fixed; inset:0; background:#0a0a0a; color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:24px; z-index:50; cursor:pointer;
  }
  #start-overlay h1 { font-size:28px; font-weight:700; letter-spacing:-0.5px; }
  #start-overlay p { font-size:15px; color:#999; }
  #start-btn {
    padding:16px 40px; font-size:18px; font-weight:600; color:#111;
    background:#f0c040; border:none; border-radius:10px; cursor:pointer;
  }

  #status-bar {
    position:fixed; bottom:0; left:0; right:0; padding:10px 18px;
    font-size:12px; color:rgba(255,255,255,0.45); background:linear-gradient(transparent, rgba(0,0,0,0.6));
    display:flex; justify-content:space-between; z-index:10; pointer-events:none;
  }

  #empty-msg {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    color:#888; font-size:16px; text-align:center; padding:40px;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="player-wrap"></div>
  <div id="status-bar">
    <span id="status-title"></span>
    <span id="status-count"></span>
  </div>
</div>

<div id="start-overlay">
  <h1>📺 송우찬수학학원 평촌관 홍보영상</h1>
  <p>TV 화면에 <b style="color:#f0c040;">전체화면으로</b> 자동 반복 재생을 시작합니다. 한 번만 눌러주세요.</p>
  <button id="start-btn">▶ 재생 시작</button>
</div>

<script src="https://player.vimeo.com/api/player.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD_eYNKzfa-aT41E3Dqt_HyJc6UeSR5ErA",
  authDomain: "songmath.firebaseapp.com",
  projectId: "songmath",
  storageBucket: "songmath.firebasestorage.app",
  messagingSenderId: "936295436575",
  appId: "1:936295436575:web:d1e201508719850cfbe02a"
};
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

let videos = [];
let currentIndex = 0;
let player = null;
let started = false;

async function loadVideos() {
  const snap = await getDocs(query(collection(db, 'promoVideos'), orderBy('order', 'asc')));
  const list = [];
  snap.forEach(d => {
    const v = d.data();
    if (v.active !== false) list.push(v);
  });
  return list;
}

function buildPlayerFor(vimeoId) {
  const wrap = document.getElementById('player-wrap');
  wrap.innerHTML = `<iframe id="vimeo-frame"
      src="https://player.vimeo.com/video/${vimeoId}?autoplay=1&muted=0&controls=0&background=0&loop=0&title=0&byline=0&portrait=0&playsinline=1"
      allow="autoplay; fullscreen" allowfullscreen></iframe>`;
  const iframe = document.getElementById('vimeo-frame');
  player = new Vimeo.Player(iframe);
  player.on('ended', playNext);
  player.on('error', playNext);
  player.play().catch(() => { /* 무음 재생 필요 시 브라우저가 자동으로 처리 */ });
}

function updateStatusBar() {
  const v = videos[currentIndex];
  document.getElementById('status-title').textContent = v ? v.title : '';
  document.getElementById('status-count').textContent = videos.length ? `${currentIndex+1} / ${videos.length}` : '';
}

function playCurrent() {
  if (!videos.length) return;
  updateStatusBar();
  buildPlayerFor(videos[currentIndex].vimeoId);
}

function playNext() {
  if (!videos.length) return;
  currentIndex = (currentIndex + 1) % videos.length;
  playCurrent();
}

async function init() {
  try {
    videos = await loadVideos();
  } catch (e) {
    document.getElementById('stage').innerHTML =
      `<div id="empty-msg">영상을 불러오지 못했습니다.<br>Firestore 접근 권한(보안 규칙)을 확인해주세요.<br><span style="color:#555;font-size:13px;">${e.message}</span></div>`;
    return;
  }
  if (!videos.length) {
    document.getElementById('stage').innerHTML =
      `<div id="empty-msg">등록된 홍보영상이 없습니다.<br>관리부 페이지 &gt; 📺 홍보영상 탭에서 영상을 등록해주세요.</div>`;
    return;
  }
  currentIndex = 0;
  playCurrent();
}

function requestFullscreenSafe() {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  if (req) {
    req.call(el).catch(() => { /* 브라우저가 거부해도 재생은 계속 진행 */ });
  }
}

document.getElementById('start-overlay').addEventListener('click', () => {
  if (started) return;
  started = true;
  requestFullscreenSafe();
  document.getElementById('start-overlay').style.display = 'none';
  init();
});

// 20분마다 목록을 새로 불러와 새 영상이 추가되면 다음 루프부터 반영
setInterval(async () => {
  try {
    const fresh = await loadVideos();
    videos = fresh;
    if (currentIndex >= videos.length) currentIndex = 0;
  } catch (e) { /* 무시하고 기존 목록 유지 */ }
}, 20 * 60 * 1000);

// 전체화면이 실수로(Esc 등) 풀렸을 경우 자동 재요청
document.addEventListener('fullscreenchange', () => {
  if (started && !document.fullscreenElement) {
    setTimeout(requestFullscreenSafe, 500);
  }
});
</script>
</body>
</html>
