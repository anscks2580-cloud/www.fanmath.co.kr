<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>중간고사 학습 유형 자가진단 | 송우찬수학학원 평촌관</title>
<meta name="description" content="3개의 질문으로 알아보는 나의 중간고사 학습 유형 — 송우찬수학학원 평촌관">
<meta name="theme-color" content="#F4F0E8">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

<script>
/* =====================================================================
   ★ 콘텐츠 설정 — 이 영역의 값만 바꾸면 됩니다 (디자인 코드는 수정 불필요)
   ===================================================================== */

/* 브랜드 / 링크 */
const BRAND = {
  watermarkLogo: 'assets/logo-watermark.png',   // 배경 워터마크 + 상단 로고 (파일만 교체)
  instagram: '',                                 // 예: 'https://www.instagram.com/계정'
  blog: '',                                      // 예: 'https://blog.naver.com/아이디'
  youtube: '',                                   // 예: 'https://www.youtube.com/@채널'

  // 유형 영상 뒤에 이어서 재생할 공통 마무리 구간 (원장님 상담 안내)
  // 사용하지 않으려면 videoOutro: null
  videoOutro: { url: 'assets/type-video.mp4', start: 103.3, end: null }
};

/* 8가지 유형 콘텐츠
   - title / number : 유형명·번호 (test.html 기준 — 변경 금지)
   - description    : 결과 화면의 짧은 설명
   - solution       : 솔루션 키워드
   - videoUrl       : mp4 경로 또는 Vimeo / YouTube 주소
   - videoStart/End : 한 영상 안에서 해당 유형 구간만 재생할 때 (초). 유형별 개별 영상이면 0 / null */
const TYPE_CONTENTS = {
  type1: { number: '01', title: '완벽주의 갓생러',      description: '개념 이해부터 시간 배분까지 깔끔한 완벽주의형',
           solution: ['킬러 문항', '서술형 대비'],     videoUrl: 'assets/type-video.mp4', videoStart: 6.5,  videoEnd: 17.2 },
  type2: { number: '02', title: '타임어택형',           description: '공부 습관은 탄탄하지만 시간 관리가 필요한 유형',
           solution: ['실전 모의고사', '타임어택'],    videoUrl: 'assets/type-video.mp4', videoStart: 17.2, videoEnd: 30.2 },
  type3: { number: '03', title: '수동적 성적 턱걸이형', description: '학원이나 인강의 가이드를 잘 따라가는 수동 학습형',
           solution: ['메타인지', '복습 시스템'],      videoUrl: 'assets/type-video.mp4', videoStart: 30.2, videoEnd: 41.9 },
  type4: { number: '04', title: '요령파 라이징스타',    description: '타고난 센스는 좋지만 빈틈없는 개념 정리가 필요한 감각형',
           solution: ['개념 공백', '고난도 응용'],     videoUrl: 'assets/type-video.mp4', videoStart: 41.9, videoEnd: 52.0 },
  type5: { number: '05', title: '억울한 유리멘탈형',    description: '평소 실력은 충분하지만 시험에서 긴장하는 실전 취약형',
           solution: ['오답 분석', '실전 멘탈 케어'],  videoUrl: 'assets/type-video.mp4', videoStart: 52.0, videoEnd: 66.9 },
  type6: { number: '06', title: '전략 미스 모범생형',   description: '성실하게 공부하지만 학습 전략이 아쉬운 노력형',
           solution: ['기출 패턴', '출제 포인트'],     videoUrl: 'assets/type-video.mp4', videoStart: 66.9, videoEnd: 79.0 },
  type7: { number: '07', title: '벼락치기 연금술사형',  description: '시험 직전 놀라운 집중력을 발휘하는 막판 집중형',
           solution: ['1:1 밀착', '순공 시간 확보'],   videoUrl: 'assets/type-video.mp4', videoStart: 79.0, videoEnd: 90.2 },
  type8: { number: '08', title: '미루기 대마왕형',      description: '공부 시작 전 온갖 핑계를 만들어내는 시작 지연형',
           solution: ['기초 체력', '주차별 목표'],     videoUrl: 'assets/type-video.mp4', videoStart: 90.2, videoEnd: 103.3 }
};

/* 질문 분기 구조 (test.html 기준 — 문구·분기 변경 금지)
   desc 는 질문 아래의 짧은 안내 문구 (자유롭게 수정 가능) */
const QUESTIONS = {
  q1:  { step: 1, label: '시험 결과', text: '이번 중간고사 성적,<br>마음에 드시나요?',
         desc: '이번 시험 결과에 대한 지금의 만족도를 떠올려 보세요.', yes: 'q2a', no: 'q2b' },
  q2a: { step: 2, label: '학습 방식', text: '유사유형 문제를<br>직접 찾아서 공부했나요?',
         desc: '수업 교재 밖의 문제까지 스스로 찾아 풀었는지 생각해 보세요.', yes: 'q3a', no: 'q3b' },
  q2b: { step: 2, label: '학습 방식', text: '시험 대비 평소 공부량이<br>충분했나요?',
         desc: '시험 직전이 아닌, 평소의 공부량을 기준으로 답해 보세요.', yes: 'q3c', no: 'q3d' },
  q3a: { step: 3, label: '실전 습관', text: '시험 볼 때<br>시간이 남았나요?',
         desc: '검토까지 마칠 여유가 있었는지 떠올려 보세요.', yes: 'type1', no: 'type2' },
  q3b: { step: 3, label: '실전 습관', text: '학원/인강 수업에만<br>전적으로 의존했나요?',
         desc: '수업 외에 혼자 공부한 시간이 있었는지 생각해 보세요.', yes: 'type3', no: 'type4' },
  q3c: { step: 3, label: '실전 습관', text: '시험 문제만 보면<br>당황하거나 실수가 많나요?',
         desc: '아는 문제를 틀린 경험이 있었는지 떠올려 보세요.', yes: 'type5', no: 'type6' },
  q3d: { step: 3, label: '실전 습관', text: '시험 3일 전<br>벼락치기를 했나요?',
         desc: '시험 직전에 공부가 몰렸는지 솔직하게 답해 보세요.', yes: 'type7', no: 'type8' }
};
</script>

<style>
/* =========================================================
   TOKENS
   ========================================================= */
:root{
  --bg:#F4F0E8;
  --bg-2:#EEE8DC;
  --paper:#FBF9F4;
  --ink:#1E1733;
  --ink-2:#5A5370;
  --ink-3:#8E879E;
  --line:rgba(37,28,64,.12);
  --hair:rgba(37,28,64,.09);
  --purple:#2D2350;
  --purple-deep:#251C40;
  --purple-night:#1A1230;
  --purple-soft:#6B5A9E;
  --gold:#C9A24A;
  --gold-bright:#F0C040;
  --ease:cubic-bezier(.2,.7,.2,1);
  --serif:'Cormorant Garamond', 'Times New Roman', serif;
  --sans:'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  --pad-x:clamp(20px,4.4vw,72px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  position:relative;
  font-family:var(--sans);background:var(--bg);color:var(--ink);
  min-height:100vh;min-height:100svh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;word-break:keep-all;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--purple-soft);outline-offset:3px}

/* =========================================================
   BACKGROUND · WATERMARK
   ========================================================= */
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg::before{content:"";position:absolute;width:1000px;height:1000px;right:-340px;top:-420px;background:radial-gradient(closest-side,rgba(107,90,158,.13),transparent)}
.bg::after{content:"";position:absolute;width:900px;height:900px;left:-360px;bottom:-460px;background:radial-gradient(closest-side,rgba(201,162,74,.16),transparent)}
.bg-rings{position:absolute;left:var(--ring-x,50%);top:var(--ring-y,40%);transition:left 1s var(--ease),top 1s var(--ease)}
.bg-rings span{position:absolute;left:0;top:0;border-radius:50%;border:1px solid rgba(37,28,64,.06);transform:translate(-50%,-50%);transition:width 1s var(--ease),height 1s var(--ease)}
.bg-rings span:nth-child(1){width:calc(var(--ring-d,220px) * 1.9);height:calc(var(--ring-d,220px) * 1.9)}
.bg-rings span:nth-child(2){width:calc(var(--ring-d,220px) * 2.9);height:calc(var(--ring-d,220px) * 2.9);border-color:rgba(37,28,64,.045)}
.bg-rings span:nth-child(3){width:calc(var(--ring-d,220px) * 4.2);height:calc(var(--ring-d,220px) * 4.2);border-color:rgba(201,162,74,.12);border-style:dashed}

/* 워터마크: 화면마다 위치가 부드럽게 이동 (오브젝트·콘텐츠보다 뒤) */
.watermark{
  position:fixed;z-index:0;pointer-events:none;user-select:none;
  width:min(92vh,980px);aspect-ratio:1;left:50%;top:50%;
  transform:translate(-50%,-50%) rotate(-8deg);
  opacity:.035;filter:grayscale(.25) blur(.4px);
  transition:left 1.2s var(--ease),top 1.2s var(--ease),width 1.2s var(--ease),transform 1.2s var(--ease),opacity 1.2s ease;
}
.watermark[src=""],.watermark:not([src]){display:none}
body[data-screen="question"] .watermark{left:86%;top:62%;width:min(110vh,1100px);transform:translate(-50%,-50%) rotate(-14deg);opacity:.045}
body[data-screen="result"] .watermark{left:12%;top:82%;width:min(100vh,1000px);transform:translate(-50%,-50%) rotate(10deg);opacity:.04}
body[data-screen="more"] .watermark{left:84%;top:26%;width:min(96vh,960px);transform:translate(-50%,-50%) rotate(-6deg);opacity:.04}

/* =========================================================
   HEADER · FOOTER
   ========================================================= */
.top{
  position:absolute;left:0;right:0;top:0;z-index:5;
  display:flex;align-items:center;justify-content:space-between;
  padding:22px var(--pad-x) 0;pointer-events:none;
}
.top > *{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;letter-spacing:-.02em}
.brand img{width:34px;height:34px;object-fit:contain}
.brand b{font-weight:800}
.brand span{font-weight:500;color:var(--ink-2)}
.top-tag{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink-3);letter-spacing:.02em}

.foot{
  position:fixed;left:var(--pad-x);right:var(--pad-x);bottom:22px;z-index:1;pointer-events:none;
  display:flex;align-items:center;gap:20px;font-size:10.5px;font-weight:600;letter-spacing:.26em;color:var(--ink-3);
  transition:opacity .6s ease;
}
.foot::before{content:"";order:1;flex:1;height:1px;background:var(--hair)}
.foot span:last-child{order:2;color:var(--gold)}
body[data-screen="result"] .foot,body[data-screen="more"] .foot{opacity:0}

/* =========================================================
   ORB (CSS 3D) — 각 화면의 .orb-slot 위치로 이동
   ========================================================= */
.visual{
  position:absolute;z-index:3;left:50%;top:30%;width:220px;height:220px;pointer-events:none;
  --orb:220px;
  transition:left .95s var(--ease),top .95s var(--ease),width .95s var(--ease),height .95s var(--ease);
}
.visual.no-anim{transition:none}
.orb-scene{position:absolute;inset:0;perspective:900px}
.orb-tilt{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s ease-out}
.orb-body{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s var(--ease)}
.orb-body.pulse{animation:pulse .62s var(--ease)}
@keyframes pulse{0%{transform:scale(1)}28%{transform:scale(.92)}62%{transform:scale(1.05)}100%{transform:scale(1)}}
.halo{position:absolute;inset:20%;border-radius:50%;box-shadow:0 34px 60px -24px rgba(37,28,64,.55);transition:box-shadow .9s var(--ease)}
.core{
  position:absolute;inset:20%;border-radius:50%;
  background:
    radial-gradient(circle at 34% 28%, rgba(255,255,255,.22) 0, rgba(255,255,255,0) 22%),
    radial-gradient(circle at 38% 34%, #6B5A9E 0%, #3A2E5C 30%, #251C40 62%, #140E26 100%);
  box-shadow:inset -12px -16px 34px rgba(0,0,0,.38), inset 6px 8px 18px rgba(255,255,255,.07);
}
.core::after{content:"";position:absolute;inset:-1px;border-radius:50%;background:radial-gradient(circle at 70% 82%, rgba(201,162,74,.38), transparent 46%);opacity:.55}
.core-mark-wrap{position:absolute;inset:0;display:grid;place-items:center;z-index:2}
.core-mark{
  font-family:var(--serif);font-style:italic;color:#E9D49A;
  font-size:calc(var(--orb) * .2);line-height:1;letter-spacing:.01em;
  transition:opacity .35s ease,transform .5s var(--ease),filter .35s ease;
}
.core-mark.swap{opacity:0;transform:translateY(8px) scale(.9);filter:blur(3px)}
.core-mark svg{width:calc(var(--orb) * .3);height:calc(var(--orb) * .3);display:block;stroke:#E9D49A;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.ring{position:absolute;inset:0;border-radius:50%;transform-style:preserve-3d;transform:rotateX(var(--rx,72deg)) rotateY(var(--ry,0deg)) scale(var(--s,1));transition:transform 1.05s var(--ease)}
.ring i{position:absolute;inset:0;border-radius:50%;border:1.2px solid rgba(37,28,64,.32);animation:spin 22s linear infinite}
.ring.r2 i{animation-duration:30s;animation-direction:reverse;border-color:rgba(37,28,64,.2)}
.ring.r3 i{animation-duration:38s;border-color:rgba(201,162,74,.75);border-width:1.4px}
.ring i::after{content:"";position:absolute;left:50%;top:-4px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--purple);box-shadow:0 0 0 3px rgba(244,240,232,.9)}
.ring.r3 i::after{background:var(--gold-bright);box-shadow:0 0 12px rgba(240,192,64,.7)}
.ring.r2 i::after{width:5px;height:5px;top:-2.5px;margin-left:-2.5px;background:var(--ink-3)}
@keyframes spin{to{transform:rotateZ(360deg)}}
.orb-shadow{position:absolute;left:14%;right:14%;bottom:-16%;height:14%;border-radius:50%;background:radial-gradient(closest-side,rgba(37,28,64,.28),transparent);filter:blur(6px);transition:transform .9s var(--ease),opacity .9s var(--ease)}
.visual.is-result .halo{box-shadow:0 34px 70px -18px rgba(37,28,64,.6),0 0 0 10px rgba(201,162,74,.08),0 0 60px rgba(201,162,74,.24)}
.visual.is-result .orb-shadow{transform:scale(1.15);opacity:.8}
.orb-slot{flex:none;aspect-ratio:1;width:var(--slot,220px)}

/* =========================================================
   APP · SCREEN TRANSITIONS
   ========================================================= */
.app{position:relative;z-index:2;min-height:100vh;min-height:100svh;display:flex}
.screen{flex:1;display:flex;transition:opacity .34s ease,transform .5s var(--ease),filter .34s ease}
.screen.out-yes{opacity:0;transform:translateX(-40px) scale(.985);filter:blur(4px)}
.screen.out-no{opacity:0;transform:translateX(40px) scale(.985);filter:blur(4px)}
.screen.out-up{opacity:0;transform:translateY(-18px) scale(.985);filter:blur(4px)}
.screen.in-yes{opacity:0;transform:translateX(40px);filter:blur(4px);transition:none}
.screen.in-no{opacity:0;transform:translateX(-40px);filter:blur(4px);transition:none}
.screen.in-up{opacity:0;transform:translateY(22px);filter:blur(4px);transition:none}
.rise{opacity:0;transform:translateY(14px);animation:rise .7s var(--ease) forwards;animation-delay:var(--d,0ms)}
@keyframes rise{to{opacity:1;transform:none}}

/* =========================================================
   COMMON UI
   ========================================================= */
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.28em;color:var(--purple-soft)}
.eyebrow::before,.eyebrow::after{content:"";width:18px;height:1px;background:currentColor;opacity:.45}
.eyebrow.left::after{display:none}
.eyebrow.gold{color:var(--gold)}
.cta{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:14px;
  height:62px;padding:0 14px 0 32px;border-radius:999px;
  background:var(--purple-deep);color:#F4F0E8;font-size:17px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;
  box-shadow:0 14px 30px -14px rgba(37,28,64,.7), inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .3s var(--ease),box-shadow .3s var(--ease),background .3s;
}
.cta .arw{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(240,192,64,.14);color:var(--gold-bright);transition:transform .35s var(--ease),background .3s;flex:none}
.cta .arw svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.cta.sm{height:54px;font-size:15.5px;padding:0 10px 0 24px}
.cta.sm .arw{width:34px;height:34px}
@media (hover:hover){
  .cta:hover{transform:translateY(-2px);box-shadow:0 22px 40px -16px rgba(37,28,64,.75), inset 0 1px 0 rgba(255,255,255,.1);background:var(--purple)}
  .cta:hover .arw{transform:translateX(3px);background:rgba(240,192,64,.22)}
}
.cta:active{transform:scale(.97)}
.ghost{
  display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;
  font-size:14px;font-weight:600;color:var(--ink-2);border:1px solid var(--line);background:rgba(251,249,244,.6);
  transition:border-color .3s,color .3s,transform .3s var(--ease);white-space:nowrap;
}
.ghost svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
@media (hover:hover){.ghost:hover{border-color:rgba(37,28,64,.35);color:var(--ink)}}
.ghost:active{transform:scale(.97)}

/* =========================================================
   3-COLUMN STAGE (INTRO · QUESTION)
   ========================================================= */
.stage{
  flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.55fr) minmax(0,1fr);
  align-items:center;gap:clamp(24px,3vw,56px);
  padding:96px var(--pad-x) 84px;
}
.col-center{display:flex;flex-direction:column;align-items:center;text-align:center;--slot:clamp(170px,27vh,250px)}
.col-center .orb-slot{margin-bottom:clamp(20px,4vh,40px)}
.side{align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:22px;min-width:0}
.side.right{align-items:flex-end;text-align:right}
.side-rule{width:1px;flex:0 0 clamp(40px,8vh,90px);background:linear-gradient(var(--hair),transparent)}
.side.right .side-rule{align-self:flex-end}

/* intro sides */
.side-kicker{font-size:11px;font-weight:700;letter-spacing:.3em;color:var(--gold)}
.side-title{font-size:clamp(22px,1.9vw,28px);font-weight:750;letter-spacing:-.04em;line-height:1.35;color:var(--ink)}
.side-title small{display:block;margin-top:6px;font-size:14px;font-weight:500;letter-spacing:-.01em;color:var(--ink-3)}
.facts{list-style:none;display:flex;flex-direction:column;gap:0;border-top:1px solid var(--hair)}
.facts li{display:flex;align-items:baseline;justify-content:space-between;gap:24px;padding:12px 0;border-bottom:1px solid var(--hair);font-size:13px;color:var(--ink-3);min-width:200px}
.facts b{font-family:var(--serif);font-weight:500;font-size:26px;color:var(--purple);line-height:1}

/* type index (right) */
.tindex-label{font-size:11px;font-weight:700;letter-spacing:.3em;color:var(--ink-3)}
.tindex{display:grid;grid-template-columns:repeat(4,44px);gap:8px}
.tindex span{
  height:44px;border-radius:12px;display:grid;place-items:center;position:relative;
  font-family:var(--serif);font-size:19px;color:var(--purple);
  border:1px solid rgba(45,35,80,.16);background:rgba(251,249,244,.55);
  transition:opacity .6s var(--ease),transform .6s var(--ease),border-color .6s,background .6s,color .6s;
}
.tindex span.off{opacity:.28;transform:scale(.9);background:transparent}
.tindex span.off::after{content:"";position:absolute;left:10px;right:10px;top:50%;height:1px;background:var(--ink-3);transform:rotate(-20deg)}
.tindex span.hit{border-color:var(--gold);background:rgba(201,162,74,.1)}
.tindex-note{font-size:13px;color:var(--ink-3)}
.tindex-note b{font-family:var(--serif);font-weight:500;font-size:20px;color:var(--purple)}

/* question left */
.q-big{font-family:var(--serif);font-weight:500;font-size:clamp(120px,13vw,210px);line-height:.8;color:transparent;-webkit-text-stroke:1px rgba(45,35,80,.32);letter-spacing:-.02em}
.q-big-sub{font-family:var(--serif);font-size:20px;color:var(--ink-3);letter-spacing:.06em;margin-top:-6px}
.vsteps{list-style:none;display:flex;flex-direction:column;gap:0;position:relative;padding-left:2px}
.vsteps li{display:flex;align-items:center;gap:14px;height:38px;font-size:13.5px;color:var(--ink-3);position:relative;transition:color .5s}
.vsteps li i{width:9px;height:9px;border-radius:50%;border:1.3px solid rgba(37,28,64,.35);flex:none;transition:all .5s var(--ease);position:relative;z-index:1;background:var(--bg)}
.vsteps li:not(:last-child)::before{content:"";position:absolute;left:4px;top:24px;height:28px;width:1.3px;background:rgba(37,28,64,.14)}
.vsteps li.done{color:var(--ink-2)}
.vsteps li.done i{background:var(--gold);border-color:var(--gold)}
.vsteps li.done:not(:last-child)::before{background:var(--gold)}
.vsteps li.now{color:var(--ink);font-weight:700}
.vsteps li.now i{background:var(--purple);border-color:var(--purple);box-shadow:0 0 0 5px rgba(45,35,80,.1)}
.vsteps li em{font-style:normal;font-family:var(--serif);font-size:15px;width:20px}
.back{
  align-self:flex-start;height:36px;padding:0 14px 0 10px;border-radius:999px;margin-left:-10px;
  display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--ink-3);
  transition:color .3s,background .3s;
}
.back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
@media (hover:hover){.back:hover{color:var(--ink);background:rgba(37,28,64,.05)}}

/* intro center */
.intro h1{margin-top:18px;font-size:clamp(28px,3vw,46px);font-weight:750;line-height:1.36;letter-spacing:-.045em}
.intro h1 em{font-style:normal;color:var(--purple);background:linear-gradient(transparent 64%,rgba(201,162,74,.3) 64%,rgba(201,162,74,.3) 92%,transparent 92%)}
.intro .lead{margin-top:18px;font-size:clamp(15px,1.25vw,18px);line-height:1.7;color:var(--ink-2)}
.intro .cta{margin-top:36px}
.intro .meta{margin-top:16px;font-size:13px;color:var(--ink-3);letter-spacing:.02em;display:none}

/* question center */
.q-head{display:none;flex-direction:column;align-items:center;gap:12px}
.steps{display:flex;align-items:center}
.steps .dot{width:9px;height:9px;border-radius:50%;border:1.3px solid rgba(37,28,64,.35);transition:all .5s var(--ease)}
.steps .dot.done{background:var(--gold);border-color:var(--gold)}
.steps .dot.now{background:var(--purple);border-color:var(--purple);box-shadow:0 0 0 5px rgba(45,35,80,.1)}
.steps .bar{width:42px;height:1.3px;background:rgba(37,28,64,.15);position:relative;overflow:hidden}
.steps .bar::after{content:"";position:absolute;inset:0;background:var(--gold);transform:scaleX(var(--f,0));transform-origin:left;transition:transform .7s var(--ease)}
.q-text{font-size:clamp(28px,3.1vw,48px);font-weight:750;line-height:1.34;letter-spacing:-.045em}
.q-desc{margin-top:14px;font-size:clamp(14px,1.1vw,16px);color:var(--ink-3);line-height:1.6}
.answers{margin-top:clamp(28px,4.6vh,46px);display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;max-width:580px}
.ans{
  position:relative;height:90px;border-radius:22px;background:var(--paper);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 26px;text-align:left;
  box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 10px 24px -18px rgba(37,28,64,.35);
  transition:transform .32s var(--ease),box-shadow .32s var(--ease),border-color .32s,background .32s,opacity .32s;
}
.ans .en{font-family:var(--serif);font-size:32px;font-weight:500;letter-spacing:.04em;color:var(--purple);line-height:1;transition:color .3s}
.ans .ko{display:block;margin-top:6px;font-size:13px;font-weight:600;color:var(--ink-3);transition:color .3s}
.ans .mk{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:all .32s var(--ease);flex:none}
.ans .mk::after{content:"";width:7px;height:7px;border-radius:50%;background:rgba(37,28,64,.25);transition:all .32s var(--ease)}
@media (hover:hover){
  .ans:hover{transform:translateY(-3px) scale(1.012);border-color:rgba(45,35,80,.42);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 22px 36px -20px rgba(37,28,64,.45)}
  .ans:hover .mk{border-color:var(--purple);background:var(--purple)}
  .ans:hover .mk::after{background:var(--gold-bright)}
}
.ans:active{transform:scale(.97)}
.ans.picked{background:var(--purple-deep);border-color:var(--purple-deep);transform:scale(.975);box-shadow:0 18px 34px -18px rgba(37,28,64,.8)}
.ans.picked .en{color:#F4F0E8}
.ans.picked .ko{color:rgba(244,240,232,.6)}
.ans.picked .mk{background:var(--gold-bright);border-color:var(--gold-bright);transform:scale(1.08)}
.ans.picked .mk::after{background:var(--purple-deep)}
.ans.dim{opacity:.45;transform:scale(.98)}
.m-back{display:none}

/* =========================================================
   RESULT — LEFT 50% / RIGHT 50%
   ========================================================= */
.result{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:100vh;min-height:100svh}
.res-left{position:relative;display:flex;align-items:center;padding:110px clamp(28px,4vw,64px) 80px var(--pad-x);gap:clamp(16px,2.4vw,40px)}
.res-text{flex:1;min-width:0}
.res-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;max-width:560px}
.res-head .orb-slot{--slot:clamp(140px,12.5vw,200px);margin-bottom:-10px}
.type-no{margin-top:14px;font-family:var(--serif);font-weight:500;font-size:clamp(110px,11vw,180px);line-height:.82;color:var(--purple);letter-spacing:-.01em}
.type-no small{font-size:.16em;letter-spacing:.24em;color:var(--gold);font-style:italic;margin-left:10px;vertical-align:.3em}
.type-name{margin-top:22px;font-size:clamp(32px,3.2vw,52px);font-weight:800;letter-spacing:-.05em;line-height:1.2}
.type-desc{margin-top:16px;font-size:clamp(15px,1.25vw,18px);line-height:1.65;color:var(--ink-2);max-width:440px}
.res-rule{width:44px;height:1px;background:var(--gold);margin-top:28px}
.sol{margin-top:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sol .lbl{font-size:11px;font-weight:700;letter-spacing:.24em;color:var(--gold);margin-right:8px}
.sol .chip{font-size:13.5px;font-weight:650;color:var(--purple);padding:7px 14px;border-radius:999px;background:rgba(45,35,80,.06);border:1px solid rgba(45,35,80,.1)}
.res-actions{margin-top:30px;display:flex;gap:10px;flex-wrap:wrap}

.res-right{
  position:relative;display:flex;align-items:center;justify-content:center;
  padding:100px var(--pad-x) 70px clamp(28px,3vw,56px);
  background:linear-gradient(180deg,rgba(238,232,220,.85),rgba(238,232,220,.55));
  border-left:1px solid var(--hair);
}
.res-right::before{ /* 얇은 골드 라인 장식 */
  content:"";position:absolute;left:-1px;top:18%;height:120px;width:1px;background:linear-gradient(transparent,var(--gold),transparent);opacity:.8;
}
.vstage{display:flex;align-items:center;gap:clamp(24px,3vw,48px);max-width:100%}
.vstage.landscape{flex-direction:column;align-items:stretch;width:100%;max-width:760px}

.vframe{
  position:relative;flex:none;overflow:hidden;cursor:pointer;
  height:min(calc(100svh - 190px),780px);aspect-ratio:var(--ar,9/16);
  border-radius:28px;background:var(--purple-night);
  box-shadow:0 0 0 1px rgba(255,255,255,.7) inset,0 0 0 10px rgba(251,249,244,.75),0 0 0 11px rgba(37,28,64,.08),0 50px 90px -40px rgba(26,18,48,.6);
}
.vstage.landscape .vframe{height:auto;width:100%}
.vframe video,.vframe iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0;display:block;background:var(--purple-night)}
.v-tag{position:absolute;left:16px;top:16px;z-index:2;font-size:10.5px;font-weight:700;letter-spacing:.22em;color:#F4F0E8;padding:6px 10px;border-radius:999px;background:rgba(26,18,48,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.v-sound{
  position:absolute;right:14px;top:14px;z-index:3;height:34px;padding:0 13px 0 10px;border-radius:999px;
  display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--purple-deep);
  background:rgba(251,249,244,.92);box-shadow:0 8px 20px -10px rgba(0,0,0,.4);transition:transform .3s var(--ease),background .3s;
}
.v-sound svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.v-sound.on{background:rgba(26,18,48,.6);color:#F4F0E8}
.v-sound:active{transform:scale(.95)}
.v-play{
  position:absolute;inset:0;z-index:2;display:grid;place-items:center;
  background:radial-gradient(closest-side,rgba(26,18,48,.35),rgba(26,18,48,.1));
  opacity:0;pointer-events:none;transition:opacity .35s ease;
}
.v-play span{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:rgba(251,249,244,.94);color:var(--purple-deep);box-shadow:0 18px 40px -16px rgba(0,0,0,.5)}
.v-play svg{width:28px;height:28px;fill:currentColor}
.vframe.paused .v-play{opacity:1}
.v-bar{position:absolute;left:18px;right:18px;bottom:16px;z-index:2;height:3px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden}
.v-bar i{position:absolute;inset:0;background:var(--gold-bright);transform:scaleX(0);transform-origin:left}
.vframe.is-embed .v-bar,.vframe.is-embed .v-sound,.vframe.is-embed .v-play{display:none}
.v-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:rgba(244,240,232,.7);font-size:14px;line-height:1.6}

.vside{width:220px;display:flex;flex-direction:column;gap:16px}
.vstage.landscape .vside{width:auto;flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap}
.vside-k{font-size:11px;font-weight:700;letter-spacing:.28em;color:var(--gold)}
.vside-t{font-size:22px;font-weight:800;letter-spacing:-.04em;line-height:1.35}
.vside-t span{display:block;font-size:13.5px;font-weight:500;color:var(--ink-3);letter-spacing:-.01em;margin-top:6px}
.vside-hint{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;color:var(--purple);opacity:0;transform:translateY(6px);transition:opacity .5s ease,transform .5s var(--ease);height:0;overflow:visible}
.vside-hint i{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(201,162,74,.18);flex:none}
.vstage.ended .vside-hint{opacity:1;transform:none;height:auto}
.next-btn{align-self:flex-start}
.vstage.ended .next-btn{animation:nudge 2.4s var(--ease) infinite}
.vstage.ended .next-btn::after{content:"";position:absolute;inset:-6px;border-radius:999px;border:1.5px solid rgba(201,162,74,.6);animation:ringOut 2.4s var(--ease) infinite}
@keyframes nudge{0%,100%{transform:none}12%{transform:translateY(-3px)}24%{transform:none}}
@keyframes ringOut{0%{opacity:.9;transform:scale(1)}60%,100%{opacity:0;transform:scale(1.12)}}

/* =========================================================
   MORE (SECOND PAGE)
   ========================================================= */
.more{flex:1;display:flex;flex-direction:column;justify-content:center;padding:110px var(--pad-x) 70px;gap:clamp(40px,7vh,72px)}
.more-head{display:grid;grid-template-columns:minmax(0,1.2fr) auto minmax(0,1fr);align-items:end;gap:clamp(24px,4vw,64px)}
.more-type{margin-top:16px;font-size:clamp(40px,4.8vw,76px);font-weight:800;letter-spacing:-.055em;line-height:1.12}
.more-type .q{color:var(--gold);font-weight:400;font-family:var(--serif)}
.more-type small{display:block;font-family:var(--serif);font-weight:500;font-size:.32em;letter-spacing:.14em;color:var(--purple-soft);margin-bottom:10px}
.more-copy{font-size:clamp(15px,1.25vw,18px);line-height:1.8;color:var(--ink-2);padding-bottom:6px}
.more-copy b{color:var(--ink);font-weight:700}
.more-head .orb-slot{--slot:clamp(120px,10vw,160px);align-self:center}

.channels{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid rgba(45,35,80,.14);border-radius:28px;overflow:hidden;background:rgba(251,249,244,.55);backdrop-filter:blur(2px)}
.ch{
  position:relative;display:flex;flex-direction:column;min-height:clamp(230px,32vh,300px);padding:28px 30px 26px;
  transition:background .45s var(--ease),color .45s;
}
.ch + .ch{border-left:1px solid rgba(45,35,80,.12)}
.ch-top{display:flex;align-items:center;justify-content:space-between}
.ch-k{font-size:12px;font-weight:700;letter-spacing:.28em;color:var(--purple);transition:color .45s}
.ch-no{font-family:var(--serif);font-size:18px;color:var(--ink-3);transition:color .45s}
.ch-ic{margin-top:auto;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;border:1px solid rgba(45,35,80,.16);color:var(--purple);transition:all .45s var(--ease)}
.ch-ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ch-t{margin-top:18px;font-size:clamp(17px,1.4vw,20px);font-weight:750;letter-spacing:-.035em;line-height:1.45}
.ch-t span{display:block;font-size:14px;font-weight:500;color:var(--ink-3);letter-spacing:-.01em;margin-top:4px;transition:color .45s}
.ch-go{margin-top:22px;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.24em;color:var(--purple);transition:color .45s}
.ch-go::after{content:"";height:1px;width:28px;background:currentColor;transition:width .45s var(--ease)}
.ch-go svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;margin-left:-6px;transition:transform .45s var(--ease)}
.ch-go .soon{font-weight:600;letter-spacing:.02em;color:var(--ink-3);font-size:12px}
@media (hover:hover){
  .ch:hover{background:var(--purple-deep);color:#F4F0E8}
  .ch:hover .ch-k{color:var(--gold-bright)}
  .ch:hover .ch-no,.ch:hover .ch-t span{color:rgba(244,240,232,.55)}
  .ch:hover .ch-ic{border-color:rgba(240,192,64,.4);color:var(--gold-bright);transform:translateY(-4px)}
  .ch:hover .ch-go{color:#F4F0E8}
  .ch:hover .ch-go::after{width:46px}
  .ch:hover .ch-go svg{transform:translateX(6px)}
}
.ch.disabled{cursor:default}
.more-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.more-foot .left{display:flex;gap:10px;flex-wrap:wrap}
.more-foot .sign{font-size:12px;color:var(--ink-3);letter-spacing:.02em}

.toast{position:fixed;left:50%;bottom:32px;z-index:30;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:12px 20px;border-radius:999px;background:var(--purple-deep);color:#F4F0E8;font-size:14px;font-weight:600;box-shadow:0 18px 40px -16px rgba(26,18,48,.6);transition:opacity .35s ease,transform .45s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* =========================================================
   RESPONSIVE
   ========================================================= */
/* 태블릿 이하: 질문 화면은 중앙 집중형 */
@media (max-width:1099px){
  .stage{grid-template-columns:1fr;padding:92px var(--pad-x) 60px}
  .side{display:none}
  .q-head{display:flex}
  .col-center .orb-slot{margin-bottom:clamp(16px,3vh,32px)}
  .q-text{margin-top:clamp(18px,3.4vh,32px);font-size:clamp(26px,4.8vw,40px)}
  .intro h1{font-size:clamp(26px,4.6vw,40px)}
  .intro .meta{display:block}
  .m-back{display:inline-flex;position:absolute;left:var(--pad-x);top:70px}
  .foot{display:none}
  .more-head{grid-template-columns:1fr auto}
  .more-copy{grid-column:1 / -1}
}
/* 결과 화면: 900px 미만 세로 전환 */
@media (max-width:899px){
  .result{grid-template-columns:1fr;min-height:0}
  .res-left{align-items:stretch;text-align:center;padding:78px var(--pad-x) 8px}
  .res-head{flex-direction:column-reverse;align-items:center;max-width:none;gap:10px}
  .res-head .orb-slot{--slot:clamp(110px,26vw,150px);margin:0}
  .type-no{font-size:clamp(72px,18vw,110px);margin-top:10px}
  .type-name{margin-top:12px;font-size:clamp(28px,7vw,40px)}
  .type-desc{margin:12px auto 0}
  .res-rule{margin:22px auto 0}
  .sol{justify-content:center}
  .res-actions{display:none}
  .res-right{background:none;border:0;padding:24px var(--pad-x) 36px}
  .res-right::before{display:none}
  .vstage{flex-direction:column;align-items:center;width:100%;gap:22px}
  .vframe{height:auto;width:min(100%,calc(66svh * var(--arn,0.5625)));max-height:66svh}
  .vside{width:100%;max-width:420px;align-items:center;text-align:center;gap:14px}
  .vside-k,.vside-t{display:none}
  .vside-hint{justify-content:center}
  .next-btn{align-self:center;width:100%;justify-content:space-between}
  .vside .ghost{align-self:center}
}
@media (max-width:820px){
  .more{padding-top:84px;gap:34px}
  .channels{grid-template-columns:1fr;border-radius:22px}
  .ch{min-height:0;padding:22px 22px 20px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;column-gap:16px}
  .ch + .ch{border-left:0;border-top:1px solid rgba(45,35,80,.12)}
  .ch-top{grid-column:1 / -1;margin-bottom:14px}
  .ch-ic{margin-top:0;grid-row:2 / 4;align-self:start}
  .ch-t{margin-top:0}
  .ch-go{margin-top:12px}
}
@media (max-width:560px){
  .top{padding-top:16px}
  .brand{font-size:14px;gap:8px}
  .brand img{width:28px;height:28px}
  .top-tag{font-size:13px}
  .stage{padding:78px var(--pad-x) 30px}
  .col-center{--slot:clamp(112px,19vh,160px)}
  .eyebrow{font-size:11px;letter-spacing:.22em}
  .answers{gap:10px}
  .ans{height:78px;padding:0 14px 0 18px;border-radius:18px}
  .ans .en{font-size:27px}
  .ans .mk{width:30px;height:30px}
  .cta{height:58px;font-size:16px;padding:0 12px 0 26px;width:100%;max-width:360px;justify-content:space-between}
  .m-back{top:60px}
  .more-head{grid-template-columns:1fr}
  .more-head .orb-slot{display:none}
  .more-foot{flex-direction:column;align-items:stretch}
  .more-foot .left{justify-content:center}
  .more-foot .sign{text-align:center}
  .watermark{width:130vw !important;opacity:.045 !important}
}
@media (max-height:640px) and (max-width:560px){
  .col-center{--slot:100px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

/* =========================================================

/* =========================================================
   STATE · DOM
   ========================================================= */
const TOTAL_STEPS = 3;
const state = { screen: 'intro', current: null, history: [], result: null, busy: false };
const $ = (s, el = document) => el.querySelector(s);
const screenEl = $('#screen');
const visual = $('#visual'), orbBody = $('#orbBody'), orbTilt = $('#orbTilt'), coreMark = $('#coreMark');
const rings = [...document.querySelectorAll('.ring')];
const bgRings = $('#bgRings');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const T = reduceMotion ? 0 : 1;
const wait = ms => new Promise(r => setTimeout(r, ms * T));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

if (BRAND.watermarkLogo){ $('#watermark').src = BRAND.watermarkLogo; $('#brandLogo').src = BRAND.watermarkLogo; }
else { $('#brandLogo').remove(); }

/* =========================================================
   ORB
   ========================================================= */
const RING_INTRO = [ {rx:72, ry:0, s:1}, {rx:72, ry:60, s:1.08}, {rx:72, ry:-60, s:1.16} ];
let ringAngles = RING_INTRO.map(r => ({...r}));
function applyRings(){
  rings.forEach((el, i) => {
    const a = ringAngles[i];
    el.style.setProperty('--rx', a.rx + 'deg'); el.style.setProperty('--ry', a.ry + 'deg'); el.style.setProperty('--s', a.s);
  });
}
function turnRings(dir){
  ringAngles[0].ry += 52 * dir;
  ringAngles[1].rx += 34; ringAngles[1].ry -= 38 * dir;
  ringAngles[2].ry += 74 * dir; ringAngles[2].rx -= 18;
  applyRings();
}
function pulse(){ orbBody.classList.remove('pulse'); void orbBody.offsetWidth; orbBody.classList.add('pulse'); }
async function setMark(html){
  coreMark.classList.add('swap'); await wait(260);
  coreMark.innerHTML = html; coreMark.classList.remove('swap');
}
const qMark = n => `<span style="font-style:normal">Q</span>${n}`;

/* 오브젝트를 현재 화면의 .orb-slot 으로 이동 */
function placeOrb(instant){
  const slot = screenEl.querySelector('.orb-slot');
  if (!slot || slot.offsetParent === null){ visual.style.opacity = 0; return; }
  visual.style.opacity = 1;
  const r = slot.getBoundingClientRect();
  if (instant) visual.classList.add('no-anim');
  visual.style.left = (r.left + window.scrollX) + 'px';
  visual.style.top = (r.top + window.scrollY) + 'px';
  visual.style.width = visual.style.height = r.width + 'px';
  visual.style.setProperty('--orb', r.width + 'px');
  if (instant){ void visual.offsetWidth; visual.classList.remove('no-anim'); }
  syncRings();
}
function syncRings(){
  const slot = screenEl.querySelector('.orb-slot');
  if (!slot || slot.offsetParent === null) return;
  const r = slot.getBoundingClientRect();
  bgRings.style.setProperty('--ring-x', (r.left + r.width / 2) + 'px');
  bgRings.style.setProperty('--ring-y', (r.top + r.height / 2) + 'px');
  bgRings.style.setProperty('--ring-d', r.width + 'px');
}
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => placeOrb(true), 60); }, { passive: true });
window.addEventListener('scroll', syncRings, { passive: true });

if (window.matchMedia('(hover:hover) and (pointer:fine)').matches && !reduceMotion){
  window.addEventListener('mousemove', e => {
    const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
    orbTilt.style.transform = `rotateY(${x * 16}deg) rotateX(${-y * 12}deg)`;
  }, { passive: true });
}

/* =========================================================
   SCREEN TRANSITION
   ========================================================= */
async function transition(dir, render){
  screenEl.classList.add('out-' + dir);
  await wait(340);
  render();
  screenEl.className = 'screen';
  window.scrollTo(0, 0);
  placeOrb(false);
  screenEl.classList.add('in-' + dir);
  void screenEl.offsetWidth;
  screenEl.classList.remove('in-' + dir);
}
function setScreen(name){ state.screen = name; document.body.dataset.screen = name; }

/* 분기 트리에서 남은 유형 계산 */
function leavesOf(id){
  if (id.startsWith('type')) return [id];
  const q = QUESTIONS[id]; return [...leavesOf(q.yes), ...leavesOf(q.no)];
}
function typeIndexHtml(alive, hit){
  return Object.keys(TYPE_CONTENTS).map(k =>
    `<span class="${alive.includes(k) ? '' : 'off'} ${hit === k ? 'hit' : ''}">${TYPE_CONTENTS[k].number}</span>`).join('');
}

/* =========================================================

   ========================================================= */

  const q = QUESTIONS[id];

  state.current = id;

/* ---------- 영상 플레이어 ---------- */
let player = null;
function isEmbed(url){ return /vimeo\.com|youtu\.?be/.test(url); }
function embedSrc(url, start){
  let m = url.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/(\w+))?/);
  if (m) return `https://player.vimeo.com/video/${m[1]}?autoplay=1&muted=1&playsinline=1&title=0&byline=0&portrait=0${m[2] ? '&h=' + m[2] : ''}${start ? '#t=' + Math.floor(start) + 's' : ''}`;
  m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  if (m) return `https://www.youtube.com/embed/${m[1]}?autoplay=1&mute=1&playsinline=1&rel=0&enablejsapi=1${start ? '&start=' + Math.floor(start) : ''}`;
  return url;
}

function setupVideo(typeId){
  destroyVideo();
  const t = TYPE_CONTENTS[typeId];
  const frame = $('#vframe'), stage = $('#vstage');
  if (!t.videoUrl){
    frame.classList.remove('paused');
    frame.insertAdjacentHTML('beforeend', '<div class="v-empty">유형 해설 영상을 준비하고 있습니다.</div>');
    return;
  }

  /* Vimeo / YouTube */
  if (isEmbed(t.videoUrl)){
    frame.classList.add('is-embed'); frame.classList.remove('paused');
    stage.classList.add('landscape'); frame.style.setProperty('--ar', '16/9');
    const ifr = document.createElement('iframe');
    ifr.src = embedSrc(t.videoUrl, t.videoStart);
    ifr.allow = 'autoplay; fullscreen; picture-in-picture'; ifr.allowFullscreen = true; ifr.title = t.title + ' 해설 영상';
    frame.appendChild(ifr);
    const onMsg = e => {   // Vimeo 종료 감지
      if (!/vimeo\.com$/.test(new URL(e.origin).hostname)) return;
      let d = e.data; try { d = typeof d === 'string' ? JSON.parse(d) : d; } catch(_) { return; }
      if (d.event === 'ready') ifr.contentWindow.postMessage(JSON.stringify({ method: 'addEventListener', value: 'ended' }), '*');
      if (d.event === 'ended') onVideoEnded();
    };
    window.addEventListener('message', onMsg);
    player = { destroy(){ window.removeEventListener('message', onMsg); ifr.src = 'about:blank'; } };
    requestAnimationFrame(() => placeOrb(true));
    return;
  }

  /* mp4 (구간 재생 + 공통 마무리 구간) */
  const segs = [{ url: t.videoUrl, start: t.videoStart || 0, end: t.videoEnd || null }];
  const o = BRAND.videoOutro;
  if (o && o.url) segs.push({ url: o.url, start: o.start || 0, end: o.end || null });

  frame.insertAdjacentHTML('beforeend', `
    <video playsinline muted autoplay preload="auto"></video>
    <button class="v-play" aria-label="재생"><span>${ICON.play}</span></button>
    <button class="v-sound" aria-label="소리 켜기">${ICON.muted}소리 켜기</button>
    <div class="v-bar"><i></i></div>`);
  const v = $('video', frame), bar = $('.v-bar i', frame), snd = $('.v-sound', frame), playIc = $('.v-play span', frame);
  v.muted = true; v.defaultMuted = true; v.setAttribute('muted', '');
  let seg = 0, ended = false;

  const segLen = s => (s.end || v.duration || 0) - s.start;
  const load = i => {
    seg = i; const s = segs[i];
    const sameFile = v.getAttribute('src') === s.url;
    if (!sameFile){ v.setAttribute('src', s.url + (s.start ? '#t=' + s.start : '')); }
    else { v.currentTime = s.start; }
  };
  const tryPlay = () => {
    const p = v.play();
    if (p && p.catch) p.catch(() => frame.classList.add('paused'));
  };

  v.addEventListener('loadedmetadata', () => {
    if (v.videoWidth && v.videoHeight){
      const ar = v.videoWidth / v.videoHeight;
      frame.style.setProperty('--ar', `${v.videoWidth}/${v.videoHeight}`);
      frame.style.setProperty('--arn', ar);
      stage.classList.toggle('landscape', ar > 1.05);
      requestAnimationFrame(() => placeOrb(true));
    }
    if (Math.abs(v.currentTime - segs[seg].start) > .5) v.currentTime = segs[seg].start;
    tryPlay();
  });
  v.addEventListener('play', () => frame.classList.remove('paused'));
  v.addEventListener('pause', () => frame.classList.add('paused'));
  v.addEventListener('timeupdate', () => {
    const s = segs[seg]; const end = s.end || v.duration;
    // 전체 진행률 (유형 구간 + 마무리 구간)
    const total = segs.reduce((a, x) => a + Math.max(0, segLen(x)), 0) || 1;
    const before = segs.slice(0, seg).reduce((a, x) => a + Math.max(0, segLen(x)), 0);
    bar.style.transform = `scaleX(${Math.min(1, (before + Math.max(0, v.currentTime - s.start)) / total)})`;
    if (s.end && v.currentTime >= end - 0.05){
      if (seg < segs.length - 1){ load(seg + 1); tryPlay(); }
      else finish();
    }
  });
  v.addEventListener('ended', finish);   // 파일 끝까지 재생된 경우
  function finish(){
    if (ended) return; ended = true;
    v.pause(); bar.style.transform = 'scaleX(1)';
    playIc.innerHTML = ICON.replay;
    onVideoEnded();
  }
  frame.addEventListener('click', e => {
    if (e.target.closest('.v-sound')) return;
    if (ended){ ended = false; playIc.innerHTML = ICON.play; $('#vstage').classList.remove('ended'); load(0); tryPlay(); return; }
    v.paused ? tryPlay() : v.pause();
  });
  snd.addEventListener('click', () => {
    v.muted = !v.muted;
    snd.classList.toggle('on', !v.muted);
    snd.innerHTML = v.muted ? `${ICON.muted}소리 켜기` : `${ICON.sound}소리 끄기`;
    if (v.paused && !ended) tryPlay();
  });

  load(0);
  player = { destroy(){ v.pause(); v.removeAttribute('src'); v.load(); } };
}
function destroyVideo(){ if (player){ player.destroy(); player = null; } }

/* 영상 종료 → 강제 이동 없이 다음 버튼 강조 */
function onVideoEnded(){
  const st = $('#vstage'); if (st) st.classList.add('ended');
  document.dispatchEvent(new CustomEvent('typevideoended', { detail: { type: state.result } }));
}

/* =========================================================
   MORE (두 번째 페이지)
   ========================================================= */
const CHANNELS = [
  { key: 'instagram', label: 'INSTAGRAM', title: '송우찬수학학원 인스타그램', sub: '학원 소식과 학습 콘텐츠 보기' },
  { key: 'blog',      label: 'BLOG',      title: '송우찬수학학원 블로그',     sub: '수학 학습법과 입시 정보 보기' },
  { key: 'youtube',   label: 'YOUTUBE',   title: '송우찬수학학원 유튜브',     sub: '수학 학습 콘텐츠와 영상 보기' }
];
function renderMore(){
  const t = TYPE_CONTENTS[state.result];
  setScreen('more');
  screenEl.innerHTML = `
  <div class="more">
    <div class="more-head">
      <div>
        <p class="eyebrow left rise" style="--d:150ms">MY LEARNING TYPE</p>
        <h2 class="more-type rise" style="--d:300ms"><small>TYPE ${esc(t.number)}</small><span class="q">「</span>${esc(t.title)}<span class="q">」</span></h2>
      </div>
      <div class="orb-slot"></div>
      <p class="more-copy rise" style="--d:480ms">이번 시험에서 드러난 나의 학습 유형을 이해했다면,<br><b>이제 더 자세한 학습 방법과<br>수학 공부에 필요한 정보</b>를 확인해보세요.</p>
    </div>
    <div class="channels rise" style="--d:620ms">
      ${CHANNELS.map((c, i) => {
        const url = BRAND[c.key];
        const attrs = url ? `href="${esc(url)}" target="_blank" rel="noopener"` : `href="#" data-soon`;
        return `<a class="ch ${url ? '' : 'disabled'}" ${attrs}>
          <div class="ch-top"><span class="ch-k">${c.label}</span><span class="ch-no">0${i + 1}</span></div>
          <span class="ch-ic">${ICON[c.key]}</span>
          <p class="ch-t">${c.title}<span>${c.sub}</span></p>
          <span class="ch-go">VIEW${ICON.arrow}</span>
        </a>`;
      }).join('')}
    </div>
    <div class="more-foot rise" style="--d:760ms">
      <div class="left">
        <button class="ghost" id="backResult">${ICON.back}결과 다시 보기</button>
        <button class="ghost" data-retry>${ICON.retry}다시 진단하기</button>
      </div>
      <span class="sign">송우찬수학학원 평촌관 · SINCE 2013</span>
    </div>
  </div>`;
  screenEl.querySelectorAll('[data-soon]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); toast('링크를 준비하고 있습니다'); }));
  $('[data-retry]', screenEl).addEventListener('click', restart);
  $('#backResult').addEventListener('click', backToResult);
}

let toastT;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2000);
}

/* =========================================================
   FLOW
   ========================================================= */
async function start(){
  if (state.busy) return; state.busy = true;
  pulse(); turnRings(1); setMark(qMark(1));
  await transition('up', () => renderQuestion('q1'));
  state.busy = false;
}

async function answer(a, btn){
  if (state.busy) return; state.busy = true;
  const dir = a === 'yes' ? 1 : -1;
  const q = QUESTIONS[state.current], next = q[a];

  btn.classList.add('picked');
  screenEl.querySelectorAll('.ans').forEach(b => { if (b !== btn) b.classList.add('dim'); });
  const bars = screenEl.querySelectorAll('.steps .bar');
  if (bars[q.step - 1]) bars[q.step - 1].style.setProperty('--f', 1);
  // 오른쪽 유형 인덱스 즉시 좁히기
  const alive = leavesOf(next), ti = $('#tindex');
  if (ti){ ti.innerHTML = typeIndexHtml(alive, alive.length === 1 ? alive[0] : null); $('#aliveN').textContent = alive.length; }

  pulse(); turnRings(dir);
  await wait(220);
  state.history.push(state.current);

  if (next.startsWith('type')) await showResult(next, dir);
  else { setMark(qMark(QUESTIONS[next].step)); await transition(a, () => renderQuestion(next)); }
  state.busy = false;
}

async function showResult(typeId, dir){
  screenEl.classList.add('out-up');
  visual.classList.add('is-result');
  ringAngles = [
    { rx: 74, ry: ringAngles[0].ry + 40 * dir, s: 1.12 },
    { rx: 66, ry: ringAngles[1].ry - 70 * dir, s: 1.26 },
    { rx: 80, ry: ringAngles[2].ry + 90 * dir, s: 1.42 }
  ];
  applyRings();
  setMark(GLYPHS[typeId]);
  await wait(380);
  renderResult(typeId);
  screenEl.className = 'screen';
  window.scrollTo(0, 0);
  placeOrb(false);
  screenEl.classList.add('in-up'); void screenEl.offsetWidth; screenEl.classList.remove('in-up');
}

async function goMore(){
  if (state.busy) return; state.busy = true;
  destroyVideo(); pulse();
  try { history.pushState({ s: 'more' }, ''); } catch(_) {}
  await transition('yes', renderMore);
  state.busy = false;
}
async function backToResult(fromPop){
  if (state.busy) return; state.busy = true;
  if (fromPop !== true){ try { history.back(); } catch(_) {} state.busy = false; return; }
  pulse();
  await transition('no', () => renderResult(state.result));
  state.busy = false;
}
window.addEventListener('popstate', () => { if (state.screen === 'more') backToResult(true); });

async function goBack(){
  if (state.busy) return; state.busy = true;
  const prev = state.history.pop();
  turnRings(-1); pulse();
  if (prev){ setMark(qMark(QUESTIONS[prev].step)); await transition('no', () => renderQuestion(prev)); }
  else { resetOrb(); await transition('no', renderIntro); }
  state.busy = false;
}
function resetOrb(){
  visual.classList.remove('is-result');
  ringAngles = RING_INTRO.map(r => ({...r})); applyRings(); setMark('?');
}
async function restart(){
  if (state.busy) return; state.busy = true;
  destroyVideo();
  if (state.screen === 'more'){ try { history.replaceState(null, ''); } catch(_) {} }
  state.history = []; state.current = null; state.result = null;
  pulse(); resetOrb();
  await transition('up', renderIntro);
  state.busy = false;
}

/* =========================================================
   INIT
   ========================================================= */
applyRings();
renderIntro();
placeOrb(true);
visual.style.opacity = 0;
requestAnimationFrame(() => { placeOrb(true); visual.style.transition = 'opacity .9s ease'; visual.style.opacity = 1; setTimeout(() => visual.style.transition = '', 950); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => placeOrb(true));
</script>
