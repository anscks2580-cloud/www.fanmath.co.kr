<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 2학기 중간고사 대비 All in one project | 평촌 학원 연합</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF7F0;
    --paper-soft:#F3EDDF;
    --ink:#1E1B16;
    --ink-soft:#79715F;
    --line:#E3D9C1;
    --blue:#2E5EFF;
    --coral:#E8583C;
    --sun:#FFC23A;
    --green:#2FA36B;
    --card:#FFFFFF;
    --gold:#B08D3E;
    --gold-soft:#E4D3AC;
    --charcoal:#15130F;
    --charcoal-deep:#0C0B08;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Pretendard','Noto Sans KR',sans-serif;
    line-height:1.6;
  }
  h1,h2,h3,.serif{font-family:'Nanum Myeongjo',serif;}
  a{color:inherit;}

  header{
    padding:20px 6vw;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  .brand{
    font-weight:700;
    font-size:1rem;
    letter-spacing:0.01em;
    color:var(--ink);
  }
  nav a{
    margin-left:26px;
    font-size:0.92rem;
    text-decoration:none;
    color:var(--ink-soft);
  }
  nav a:hover{color:var(--ink);}

  .hero{
    padding:36px 0vw 28px;
    background:
      radial-gradient(900px 380px at 18% -10%, rgba(176,141,62,0.10), transparent 60%),
      radial-gradient(700px 320px at 88% 0%, rgba(176,141,62,0.08), transparent 60%),
      var(--paper);
    border-bottom:1px solid var(--line);
  }
  .hero-inner{
    max-width:1600px;
    margin:0 auto;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    justify-items:center;
    row-gap:8px;
    column-gap:100px;
  }
  .hero-row-full{grid-column:1/-1;}
  .title-block{
    grid-column:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .dday-widget.side-left{grid-column:1;justify-self:end;align-self:center;}
  .dday-widget.side-right{grid-column:3;justify-self:start;align-self:center;}
  .hero .tag{
    display:inline-block;
    font-size:0.88rem;
    font-weight:600;
    color:var(--gold);
    background:rgba(176,141,62,0.08);
    border:1px solid rgba(176,141,62,0.3);
    border-radius:20px;
    padding:6px 18px;
  }
  .hero h1{
    font-size:clamp(2.8rem,5.6vw,4.2rem);
    line-height:1.24;
    margin:0;
    font-weight:800;
    color:var(--ink);
    text-align:center;
  }
  .hero h1 .accent{color:var(--gold);}
  .hero .tagline{
    font-family:'Nanum Myeongjo',serif;
    font-style:italic;
    font-weight:700;
    font-size:clamp(1.4rem,2.1vw,1.9rem);
    color:var(--gold);
    margin:2px 0 0;
    letter-spacing:0.03em;
    display:inline-flex;
    align-items:center;
    gap:14px;
    white-space:nowrap;
  }
  .hero .tagline::after{
    content:"";
    display:inline-block;
    width:56px;
    height:1px;
    background:var(--gold);
    opacity:0.6;
  }

  .collab-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:24px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .collab-item{
    display:flex;
    align-items:center;
    gap:9px;
  }
  .logo-slot{
    width:56px;height:56px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;
    font-size:1.1rem;
    color:#fff;
    flex-shrink:0;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .logo-slot img{width:100%;height:100%;object-fit:cover;}
  .collab-name{
    font-weight:800;
    font-size:1.35rem;
    color:var(--ink);
  }
  .collab-x{
    font-size:1.2rem;
    color:#8A8271;
    font-weight:400;
  }
  .hero .note{
    font-size:0.85rem;
    color:#8A8271;
    margin-top:6px;
  }

  .dday-strip{
    margin:36px auto 0;
    display:inline-flex;
    align-items:baseline;
    gap:10px;
    background:var(--ink);
    color:#fff;
    padding:12px 26px;
    border-radius:30px;
    font-size:0.95rem;
  }
  .dday-strip strong{
    font-family:'Nanum Myeongjo',serif;
    font-size:1.3rem;
    color:var(--sun);
  }

  .filter-bar{
    max-width:1180px;
    margin:0 auto;
    padding:24px 6vw 0;
  }
  .filter-bar h2{
    font-size:1.5rem;
    margin:0 0 4px;
  }
  .filter-bar .sub{
    color:var(--ink-soft);
    font-size:0.94rem;
    margin-bottom:22px;
  }
  .filters{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .filters select, .filters input{
    font-family:inherit;
    font-size:0.9rem;
    padding:10px 14px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--paper-soft);
    color:var(--ink);
  }
  .filters input{flex:1;min-width:180px;}

  .school-dday-grid{display:none;}
  .school-card{display:none;}

  /* ---- 히어로 안에 들어가는 D-DAY 위젯 (지역별 페이지) ---- */
  .dday-widget{
    width:340px;
    flex-shrink:0;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px 12px;
  }
  .dday-widget-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .dday-widget-head .label{
    font-size:0.74rem;
    color:var(--ink-soft);
    font-weight:600;
  }
  .dday-widget-head .level-badge{
    font-size:0.66rem;
    font-weight:700;
    color:#fff;
    background:var(--gold);
    padding:2px 9px;
    border-radius:20px;
  }
  .dday-carousel{
    position:relative;
    overflow:hidden;
    height:225px;
  }
  .dday-slide-track{
    display:flex;
    align-items:flex-start;
    transition:transform .5s ease;
    height:100%;
  }
  .dday-page{
    flex:0 0 100%;
    box-sizing:border-box;
    height:100%;
    overflow:hidden;
  }
  .dday-page .region-title{
    font-size:0.7rem;
    color:var(--gold);
    font-weight:700;
    margin-bottom:6px;
  }
  .dday-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:6px;
    padding:5px 0;
    border-bottom:1px solid var(--paper-soft);
  }
  .dday-row:last-child{border-bottom:none;}
  .dday-row .school-name{
    font-size:0.76rem;
    font-weight:600;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .dday-row .dday-num{
    font-family:'Nanum Myeongjo',serif;
    font-weight:800;
    font-size:0.82rem;
    color:var(--gold);
    white-space:nowrap;
  }
  .dday-row.tbd .dday-num{
    font-size:0.68rem;
    color:var(--ink-soft);
    font-family:'Pretendard';
    font-weight:500;
  }
  .dday-dots{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-top:12px;
  }
  .dday-dots span{
    width:6px;height:6px;
    border-radius:50%;
    background:var(--line);
  }
  .dday-dots span.active{background:var(--gold);}
  @media (max-width:1080px){
    .hero-inner{grid-template-columns:1fr;}
    .title-block{grid-column:1;}
    .dday-widget.side-left,.dday-widget.side-right{
      grid-column:1;
      justify-self:center;
      width:100%;
      max-width:420px;
    }
  }

  .subject-nav{
    max-width:1180px;
    margin:0 auto;
    padding:16px 6vw 0;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .subject-pill{
    border:1px solid var(--line);
    padding:9px 18px;
    border-radius:30px;
    font-size:0.88rem;
    font-weight:600;
    cursor:pointer;
    background:var(--paper);
    color:var(--ink-soft);
  }
  .subject-pill.active{
    color:#fff;
    border-color:transparent;
  }

  .materials{
    max-width:1180px;
    margin:0 auto;
    padding:30px 6vw 100px;
  }
  .subject-group{
    margin-bottom:44px;
    border-radius:18px;
    padding:26px 26px 22px;
  }
  .subject-group .head{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:18px;
  }
  .subject-group .head .logo-slot{
    width:40px;height:40px;
    font-size:0.85rem;
  }
  .subject-group .head .titles{
    display:flex;
    flex-direction:column;
  }
  .subject-group .head .subj{
    font-family:'Nanum Myeongjo',serif;
    font-weight:700;
    font-size:1.25rem;
  }
  .subject-group .head .school{
    font-size:0.86rem;
    color:var(--ink-soft);
  }
  .subject-group .head .count{
    margin-left:auto;
    font-size:0.8rem;
    color:var(--ink-soft);
    background:rgba(255,255,255,0.6);
    padding:4px 10px;
    border-radius:20px;
  }
  .card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:12px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 16px 14px;
    display:flex;
    flex-direction:column;
    gap:8px;
    text-decoration:none;
    transition:transform .15s, box-shadow .15s;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(0,0,0,0.06);
  }
  .card .grade-tag{
    font-size:0.74rem;
    color:var(--ink-soft);
    align-self:flex-start;
    background:var(--paper-soft);
    padding:2px 9px;
    border-radius:20px;
  }
  .card .title{
    font-weight:600;
    font-size:0.97rem;
    line-height:1.4;
  }
  .card .meta{
    font-size:0.78rem;
    color:var(--ink-soft);
  }

  .empty-state{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
    border:1px dashed var(--line);
    border-radius:14px;
    font-size:0.95rem;
  }

  .upload-cta{
    background:var(--paper-soft);
    border-top:1px solid var(--line);
    padding:56px 6vw;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:30px;
    flex-wrap:wrap;
  }
  .upload-cta h3{
    margin:0 0 8px;
    font-size:1.3rem;
  }
  .upload-cta p{
    margin:0;
    color:var(--ink-soft);
    max-width:52ch;
    font-size:0.94rem;
  }
  .btn-primary{
    background:var(--coral);
    color:#fff;
    padding:14px 28px;
    border-radius:30px;
    text-decoration:none;
    font-weight:700;
    font-size:0.94rem;
    white-space:nowrap;
  }

  footer{
    padding:26px 6vw;
    font-size:0.82rem;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }

  @media (max-width:760px){
    .collab-row{flex-direction:column;gap:14px;}
    .collab-x{display:none;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">평촌 학원 연합 · 중간고사 대비</div>
  <nav>
    <a href="#materials">자료실</a>
    <a href="#ddayMiddleWidget">학교별 D-DAY</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-inner">
    <div class="collab-row hero-row-full" id="collabRow"></div>
    <div class="note hero-row-full">나머지 참여 학원 로고는 추후 실제 로고 이미지로 교체 예정입니다</div>

    <div class="tag hero-row-full">2026학년도 2학기 중간고사 대비 자료 허브</div>

    <div class="dday-widget side-left" id="ddayMiddleWidget">
      <div class="dday-widget-head">
        <span class="label">중간고사 기간</span>
        <span class="level-badge">중등</span>
      </div>
      <div class="dday-carousel" id="ddayCarouselMiddle">
        <div class="dday-slide-track" id="ddaySlideTrackMiddle"></div>
      </div>
      <div class="dday-dots" id="ddayDotsMiddle"></div>
    </div>

    <div class="title-block">
      <h1>2026년 2학기<br><span class="accent">중간고사</span> 대비</h1>
      <div class="tagline">All in one project</div>
    </div>

    <div class="dday-widget side-right" id="ddayHighWidget">
      <div class="dday-widget-head">
        <span class="label">중간고사 기간</span>
        <span class="level-badge">고등</span>
      </div>
      <div class="dday-carousel" id="ddayCarouselHigh">
        <div class="dday-slide-track" id="ddaySlideTrackHigh"></div>
      </div>
      <div class="dday-dots" id="ddayDotsHigh"></div>
    </div>
  </div>
</section>

<div class="subject-nav" id="subjectNav"></div>

<div class="filter-bar" id="materials">
  <h2>과목별 대비 자료실</h2>
  <div class="sub">담당 학원별로 올라온 자료를 과목 단위로 모아뒀습니다. 학년으로 좁혀서 확인하세요.</div>
  <div class="filters">
    <select id="filterGrade"><option value="">전체 학년</option></select>
    <input id="filterKeyword" type="text" placeholder="자료명 검색">
  </div>
</div>

<div class="materials" id="materialsContainer">
  <div class="empty-state">자료를 불러오는 중입니다…</div>
</div>

<footer>
  <div>평촌 학원 연합 · 중간고사 대비 자료실</div>
  <div>문의: 송우찬수학학원 평촌관 원장 송문찬</div>
</footer>

  }

  // 가나다순으로 정렬 후 PAGE_SIZE개씩 페이지로 분할
  const pages = [];
  for(let i = 0; i < schools.length; i += PAGE_SIZE){
    pages.push(schools.slice(i, i + PAGE_SIZE));
  }

  pages.forEach(pageSchools=>{
    const page = document.createElement('div');
    page.className = 'dday-page';
    const rows = pageSchools.map(s=>{
      const period = s.period || '일정 확인 중';
      return `
        <div class="dday-row${!s.period ? ' tbd' : ''}">
          <span class="school-name">${s.name}</span>
          <span class="dday-num">${period}</span>
        </div>
      `;
    }).join('');
    page.innerHTML = rows;
    track.appendChild(page);

    const dot = document.createElement('span');
    dotsEl.appendChild(dot);
  });

  let index = 0;
  function update(){
    track.style.transform = `translateX(-${index * 100}%)`;
    [...dotsEl.children].forEach((d,i)=>d.classList.toggle('active', i === index));
  }
  update();

  if(pages.length > 1){
    setInterval(()=>{
      index = (index + 1) % pages.length;
      update();
    }, 4000);
  }
}

function calcSchoolDday(dateStr){
  if(!dateStr) return null;
  const today = new Date();
  today.setHours(0,0,0,0);
  const target = new Date(dateStr);
  return Math.ceil((target - today) / (1000*60*60*24));
}

makeRegionPager('ddaySlideTrackMiddle', 'ddayDotsMiddle', '중학교');
makeRegionPager('ddaySlideTrackHigh', 'ddayDotsHigh', '고등학교');

function renderSubjectNav(){
  const nav = document.getElementById('subjectNav');
  const all = document.createElement('div');
  all.className = 'subject-pill active';
  all.textContent = '전체 과목';
  all.dataset.subject = '';
  all.style.background = 'var(--ink)';
  nav.appendChild(all);

  ACADEMIES.forEach(a=>{
    const pill = document.createElement('div');
    pill.className = 'subject-pill';
    pill.textContent = a.subject;
    pill.dataset.subject = a.subject;
    nav.appendChild(pill);
  });

  nav.addEventListener('click', (e)=>{
    if(!e.target.classList.contains('subject-pill')) return;
    [...nav.children].forEach(p=>{
      p.classList.remove('active');
      p.style.background = 'var(--paper)';
      p.style.color = 'var(--ink-soft)';
    });
    e.target.classList.add('active');
    const subj = e.target.dataset.subject;
    const academy = ACADEMIES.find(a=>a.subject === subj);
    e.target.style.background = academy ? academy.color : 'var(--ink)';
    e.target.style.color = '#fff';
    currentSubjectFilter = subj;
    renderMaterials();
  });
}
let currentSubjectFilter = '';
renderSubjectNav();

function parseCSV(text){
  const rows = text.trim().split(/\r?\n/).map(r=>{
    const result = [];
    let cur = '', inQuotes = false;
    for(let i=0;i<r.length;i++){
      const c = r[i];
      if(c === '"'){ inQuotes = !inQuotes; }
      else if(c === ',' && !inQuotes){ result.push(cur); cur=''; }
      else{ cur += c; }
    }
    result.push(cur);
    return result.map(v=>v.trim());
  });
  const header = rows.shift();
  return rows.filter(r=>r.length>1 && r[0]).map(r=>{
    const obj = {};
    header.forEach((h,i)=>obj[h.trim()] = r[i] || '');
    return obj;
  });
}

let ALL_ITEMS = [];

function renderFilterGrade(items){
  const grades = [...new Set(items.map(i=>i['학년']).filter(Boolean))];
  const sel = document.getElementById('filterGrade');
  grades.forEach(g=>{
    const opt = document.createElement('option');
    opt.value = g; opt.textContent = g;
    sel.appendChild(opt);
  });
}

function renderMaterials(){
  const grade = document.getElementById('filterGrade').value;
  const keyword = document.getElementById('filterKeyword').value.trim().toLowerCase();

  let items = ALL_ITEMS.filter(i=>{
    if(currentSubjectFilter && i['과목'] !== currentSubjectFilter) return false;
    if(grade && i['학년'] !== grade) return false;
    if(keyword && !(i['자료명']||'').toLowerCase().includes(keyword)) return false;
    return true;
  });

  const container = document.getElementById('materialsContainer');
  container.innerHTML = '';

  const subjectsToShow = currentSubjectFilter
    ? ACADEMIES.filter(a=>a.subject === currentSubjectFilter)
    : ACADEMIES;

  let anyRendered = false;

  subjectsToShow.forEach(academy=>{
    const subjectItems = items.filter(i=>i['과목'] === academy.subject);
    if(subjectItems.length === 0) return;
    anyRendered = true;

    const group = document.createElement('div');
    group.className = 'subject-group';
    group.style.background = hexToSoft(academy.color);

    const head = document.createElement('div');
    head.className = 'head';
    head.innerHTML = `
      <div class="logo-slot" style="background:${academy.color}">
        ${academy.logo ? `<img src="${academy.logo}" alt="${academy.school} 로고">` : academy.initial}
      </div>
      <div class="titles">
        <div class="subj">${academy.subject}</div>
        <div class="school">${academy.school}</div>
      </div>
      <div class="count">${subjectItems.length}개 자료</div>
    `;
    group.appendChild(head);

    const grid = document.createElement('div');
    grid.className = 'card-grid';
    subjectItems.forEach(item=>{
      const a = document.createElement('a');
      a.className = 'card';
      a.href = item['링크'] || '#';
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML = `
        <span class="grade-tag">${item['학년']||''}</span>
        <div class="title">${item['자료명']||'(제목 없음)'}</div>
        <div class="meta">${item['업로드일']||''}</div>
      `;
      grid.appendChild(a);
    });
    group.appendChild(grid);
    container.appendChild(group);
  });

  if(!anyRendered){
    container.innerHTML = '<div class="empty-state">조건에 맞는 자료가 아직 없습니다. 조건을 바꿔서 다시 확인해 보세요.</div>';
  }
}

function hexToSoft(hex){
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},0.06)`;
}

document.getElementById('filterGrade').addEventListener('change', renderMaterials);
document.getElementById('filterKeyword').addEventListener('input', renderMaterials);

async function loadData(){
  const container = document.getElementById('materialsContainer');
  if(SHEET_CSV_URL.includes('여기에_입력')){
    container.innerHTML = '<div class="empty-state">SHEET_CSV_URL이 아직 설정되지 않았습니다. 스크립트 상단에 구글시트 게시 CSV 링크를 입력해 주세요.</div>';
    return;
  }
  try{
    const res = await fetch(SHEET_CSV_URL);
    const text = await res.text();
    ALL_ITEMS = parseCSV(text);
    renderFilterGrade(ALL_ITEMS);
    renderMaterials();
  }catch(e){
    container.innerHTML = '<div class="empty-state">자료를 불러오지 못했습니다. 시트 공개 설정을 확인해 주세요.</div>';
  }
}
loadData();
