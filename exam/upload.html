<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>자료 올리기 (선생님 전용) | 2026 2학기 기말고사 대비 · 평촌 학원 연합</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tus-js-client@4.1.0/dist/tus.min.js"></script>
<style>
  :root{
    --paper:#0E1420;
    --paper-soft:#171F2F;
    --ink:#F1EFE8;
    --ink-soft:#9CA3B5;
    --line:#2B3348;
    --coral:#E8583C;
    --green:#2FA36B;
    --card:#161E2E;
    --gold:#D2AF6E;
    --gold-soft:#E4D3AC;
    --charcoal-deep:#0C0B08;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Pretendard','Noto Sans KR',sans-serif;line-height:1.6;}
  a{color:inherit;}
  header{padding:18px 6vw;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);}
  .brand{font-weight:700;font-size:0.92rem;text-decoration:none;}
  .brand .brand-sub{display:block;font-size:0.62rem;font-weight:600;letter-spacing:0.18em;color:var(--gold);margin-bottom:3px;}
  .head-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:0.85rem;color:var(--ink-soft);}
  .ghost-btn{border:1px solid var(--line);background:transparent;color:var(--ink-soft);padding:7px 14px;border-radius:30px;font-size:0.8rem;cursor:pointer;text-decoration:none;}
  .ghost-btn:hover{border-color:var(--gold);color:var(--gold);}

  /* 로그인 게이트 */
  .auth-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .auth-card{width:100%;max-width:360px;text-align:center;padding:36px 30px;background:var(--paper-soft);border:1px solid var(--line);border-radius:10px;}
  .auth-title{font-family:'Nanum Myeongjo',serif;font-size:1.3rem;font-weight:700;margin-bottom:8px;}
  .auth-sub{font-size:0.84rem;color:var(--ink-soft);margin-bottom:22px;}
  .auth-card input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font-size:1rem;margin-bottom:14px;text-align:center;letter-spacing:0.2em;}
  .auth-btn{width:100%;padding:12px;border:none;border-radius:6px;background:var(--gold);color:var(--charcoal-deep);font-weight:700;font-size:0.9rem;cursor:pointer;}
  .auth-btn:hover{background:var(--gold-soft);}
  .auth-error{color:var(--coral);font-size:0.82rem;margin-top:10px;min-height:1.2em;}

  main{max-width:860px;margin:0 auto;padding:40px 5vw 70px;}
  .eyebrow{font-size:0.7rem;font-weight:700;letter-spacing:0.3em;color:var(--gold);margin-bottom:6px;}
  h1{font-family:'Nanum Myeongjo',serif;font-size:1.5rem;margin:0 0 6px;}
  .lead{color:var(--ink-soft);font-size:0.88rem;margin:0 0 26px;}

  .box{background:var(--paper-soft);border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:28px;}
  .kind-switch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
  .kind-btn{padding:16px 10px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink-soft);cursor:pointer;text-align:center;font-size:1rem;font-weight:700;}
  .kind-btn small{display:block;font-size:0.74rem;font-weight:500;margin-top:4px;}
  .kind-btn.on{border-color:var(--gold);color:var(--gold);background:rgba(210,175,110,0.08);}

  .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;}
  @media (max-width:640px){.row{grid-template-columns:1fr;}}
  label{display:block;font-size:0.76rem;color:var(--ink-soft);margin-bottom:4px;}
  input[type=text], select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font-size:0.92rem;font-family:inherit;}
  .field{margin-bottom:12px;}

  .src-tabs{display:flex;gap:6px;margin-bottom:10px;}
  .src-tab{padding:6px 14px;border:1px solid var(--line);border-radius:30px;background:transparent;color:var(--ink-soft);font-size:0.8rem;cursor:pointer;}
  .src-tab.on{border-color:var(--gold);color:var(--gold);}

  .drop{border:2px dashed var(--line);border-radius:10px;padding:26px 14px;text-align:center;color:var(--ink-soft);font-size:0.88rem;cursor:pointer;}
  .drop.over, .drop:hover{border-color:var(--gold);color:var(--gold);}
  .drop b{color:var(--ink);}
  .prog{height:8px;background:var(--paper);border-radius:6px;overflow:hidden;margin-top:12px;display:none;}
  .prog div{height:100%;width:0;background:var(--gold);transition:width .2s;}
  .msg{font-size:0.82rem;margin-top:10px;min-height:1.2em;}
  .msg.err{color:var(--coral);} .msg.ok{color:var(--green);}
  .submit{width:100%;margin-top:14px;padding:13px;border:none;border-radius:8px;background:var(--gold);color:var(--charcoal-deep);font-weight:800;font-size:0.95rem;cursor:pointer;}
  .submit:disabled{opacity:0.5;cursor:default;}
  .notice{font-size:0.76rem;color:var(--ink-soft);margin-top:10px;}

  .list-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .list-head h2{font-size:1.05rem;margin:0;}
  .filter{display:flex;gap:6px;}
  .item{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin-bottom:8px;}
  .badge{flex-shrink:0;font-size:0.68rem;font-weight:700;border-radius:20px;padding:2px 9px;}
  .badge.video{background:rgba(91,127,255,0.15);color:#8FA6FF;}
  .badge.pdf{background:rgba(210,175,110,0.15);color:var(--gold);}
  .item-main{flex:1;min-width:0;}
  .item-title{font-weight:700;font-size:0.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .item-meta{font-size:0.72rem;color:var(--ink-soft);}
  .item-pair{margin-top:5px;font-size:0.74rem;color:var(--ink-soft);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .item-pair select{width:auto;max-width:100%;padding:4px 8px;font-size:0.74rem;}
  .item.sub{margin-left:26px;border-style:dashed;}
  .item a, .item button{flex-shrink:0;font-size:0.76rem;border:1px solid var(--line);background:transparent;color:var(--ink-soft);border-radius:20px;padding:4px 11px;cursor:pointer;text-decoration:none;}
  .item a:hover{border-color:var(--gold);color:var(--gold);}
  .item button:hover{border-color:var(--coral);color:var(--coral);}
  .item button.dl:hover{border-color:var(--gold);color:var(--gold);}
  .empty{text-align:center;color:var(--ink-soft);font-size:0.86rem;padding:20px 0;}
</style>
</head>
<body>

<!-- ── 입장: 학원별 업로드 인증번호 ── -->
<div class="auth-gate" id="authGate">
  <div class="auth-card">
    <div style="font-size:0.62rem;font-weight:600;letter-spacing:0.18em;color:var(--gold);margin-bottom:10px;">TEAM I:DEA</div>
    <div class="auth-title">기말고사 자료 올리기</div>
    <div class="auth-sub">연합 학원 선생님 전용 화면입니다.<br>학원별 업로드 인증번호를 입력해주세요.</div>
    <input type="password" id="codeInput" placeholder="인증번호" autocomplete="off" inputmode="numeric">
    <button class="auth-btn" id="enterBtn">입장하기</button>
    <div class="auth-error" id="authError"></div>
  </div>
</div>

<div id="site" style="display:none;">
<header>
  <a href="materials.html" class="brand"><span class="brand-sub">TEAM I:DEA</span>평촌 학원 연합 · 기말고사 자료 올리기</a>
  <div class="head-right">
    <span id="welcome"></span>
    <a class="ghost-btn" href="materials.html" target="_blank" rel="noopener">자료실 보기</a>
    <button class="ghost-btn" id="logoutBtn">나가기</button>
  </div>
</header>

<main>
  <div class="eyebrow">TEACHER UPLOAD</div>
  <h1>자료 올리기</h1>
  <p class="lead" id="leadText"></p>

  <div class="box">
    <div class="kind-switch">
      <button class="kind-btn on" data-kind="video">🎬 영상<small>학생·선생님 모두 보임</small></button>
      <button class="kind-btn" data-kind="pdf">📄 PDF<small id="pdfKindSub">선생님만 보임·다운로드</small></button>
    </div>

    <div class="field">
      <label>자료명</label>
      <input type="text" id="title" maxlength="120" placeholder="예) 평촌고 고1 기말 대비 1회 해설">
    </div>
    <div class="row">
      <div>
        <label>학년</label>
        <select id="grade">
          <option value="">학년 선택</option>
          <option>중1</option><option>중2</option><option>중3</option>
          <option>고1</option><option>고2</option><option>고3</option>
        </select>
      </div>
      <div id="typeWrap">
        <label>자료 유형</label>
        <select id="mtype"></select>
      </div>
      <div id="yearWrap" style="display:none;">
        <label>기출 연도</label>
        <select id="year"><option value="2025">2025년</option><option value="2024">2024년</option></select>
      </div>
    </div>

    <div id="dlWrap" class="field" style="display:none;">
      <label>자료실에서 학생 다운로드 (저작권 확인 후 선택)</label>
      <div class="src-tabs" style="margin:0;">
        <button class="src-tab" data-dl="yes">다운로드 허용</button>
        <button class="src-tab" data-dl="no">목록만 보기 (다운로드 불가)</button>
      </div>
    </div>
    <div id="folderLine" class="notice" style="margin:0 0 10px;color:var(--gold);"></div>
    <div id="videoSrcTabs" class="src-tabs">
      <button class="src-tab on" data-src="file">영상 파일 올리기 (비메오)</button>
      <button class="src-tab" data-src="link">유튜브·비메오 링크</button>
    </div>

    <div id="fileArea">
      <div class="drop" id="drop">
        <div id="dropText">여기를 눌러 <b>영상 파일</b>을 고르거나 끌어다 놓으세요</div>
      </div>
      <input type="file" id="fileInput" style="display:none;">
    </div>
    <div id="linkArea" style="display:none;">
      <input type="text" id="linkInput" placeholder="https://youtu.be/... 또는 https://vimeo.com/...">
    </div>

    <!-- 영상과 함께 올릴 PDF → 자동 연결 -->
    <div id="attachWrap" class="field" style="margin-top:14px;">
      <label>함께 올릴 PDF (선택) — 올리면 이 영상과 자동으로 연결돼요</label>
      <div class="drop" id="attachDrop" style="padding:14px;"><div id="attachText">여기를 눌러 <b>PDF</b>를 고르세요</div></div>
      <input type="file" id="attachInput" accept="application/pdf,.pdf" style="display:none;">
      <button type="button" id="attachClear" class="ghost-btn" style="display:none;margin-top:6px;">PDF 빼기</button>
    </div>
    <!-- PDF만 올릴 때 이미 올린 영상과 연결 -->
    <div id="pairWrap" class="field" style="display:none;margin-top:14px;">
      <label>연결할 영상 (선택)</label>
      <select id="pairSel"><option value="">연결 안 함</option></select>
    </div>

    <div class="prog" id="prog"><div id="progBar"></div></div>
    <div class="msg" id="msg"></div>
    <button class="submit" id="submitBtn">올리기</button>
    <div class="notice" id="sizeNotice">영상 파일은 비메오의 우리 학원 폴더로 바로 올라가요. 올리는 중에는 창을 닫지 마세요.</div>
  </div>

  <div class="list-head">
    <h2 id="listTitle">우리 학원이 올린 자료</h2>
    <div class="filter">
      <button class="src-tab on" data-f="">전체</button>
      <button class="src-tab" data-f="video">영상</button>
      <button class="src-tab" data-f="pdf">PDF</button>
    </div>
  </div>
  <div id="list"><div class="empty">불러오는 중…</div></div>
</main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js";

// 이 화면은 학원 홈페이지의 선생님·관리자 페이지와 연결되지 않은 기말고사 전용 업로드 화면입니다.
// (로그인 계정 없음 — 아래 학원별 업로드 인증번호로만 입장)
const firebaseConfig = {
  apiKey: "AIzaSyD_eYNKzfa-aT41E3Dqt_HyJc6UeSR5ErA",
  authDomain: "songmath.firebaseapp.com",
  projectId: "songmath",
  storageBucket: "songmath.firebasestorage.app",
  messagingSenderId: "936295436575",
  appId: "1:936295436575:web:d1e201508719850cfbe02a"
};
const app = initializeApp(firebaseConfig, 'examUpload');
const db = getFirestore(app);
const storage = getStorage(app);
// 영상 파일은 서버 함수(examVimeo)를 거쳐 비메오 「2026년 2학기 기말고사 › 학원」 폴더로 바로 올라감
const vimeoCall = httpsCallable(getFunctions(app, 'asia-northeast3'), 'examVimeo', { timeout: 120000 });
const vimeoApi = async (action, data = {}) => (await vimeoCall({ action, code: uploadCode, ...data })).data;
let uploadCode = '';

// ── 학원별 업로드 인증번호 (자료실 입장 번호와 별개, 값만 바꾸면 바로 변경됨) ──
const UPLOAD_CODES = {
  "3868899": "송우찬수학학원",
  "3853466": "인어스수학학원",
  "01041881096": "대치레몬학원",
  "01055140374": "에이펙스영어학원",
};
const SUBJECT = { "송우찬수학학원": "수학", "인어스수학학원": "수학", "대치레몬학원": "영어", "에이펙스영어학원": "영어" };
const MAX_PDF = 3 * 1024 * 1024 * 1024;
const MAX_VIDEO = 20 * 1024 * 1024 * 1024;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sizeText = (b) => b >= 1024 ** 3 ? (b / 1024 ** 3).toFixed(2) + 'GB' : Math.max(1, Math.round(b / 1048576)) + 'MB';

let academy = null;
let kind = 'video';      // video | pdf
let videoSrc = 'file';   // file | link
let pickedFile = null;
let busy = false;
let items = [];
let listFilter = '';
let dlChoice = '';
let attachPdf = null;  // 영상과 함께 올릴 PDF   // 영어 PDF: yes(학생 다운로드 허용) | no(목록만)

// ── 입장 ──
function enter(code) {
  const name = UPLOAD_CODES[String(code || '').trim()];
  if (!name) return false;
  academy = name;
  uploadCode = String(code).trim();
  sessionStorage.setItem('examUploadCode', String(code).trim());
  $('authGate').style.display = 'none';
  $('site').style.display = 'block';
  $('welcome').textContent = `${academy} 선생님`;
  $('listTitle').textContent = `${academy}이 올린 자료`;
  setupTypes();
  loadList();
  showFolder();
  return true;
}
$('enterBtn').onclick = () => { if (!enter($('codeInput').value)) $('authError').textContent = '인증번호가 올바르지 않습니다.'; };
$('codeInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('enterBtn').click(); });
$('logoutBtn').onclick = () => { sessionStorage.removeItem('examUploadCode'); location.reload(); };
{ const saved = sessionStorage.getItem('examUploadCode'); if (saved) enter(saved); }

async function showFolder() {
  const el = $('folderLine');
  el.textContent = '비메오 폴더 확인 중...';
  try {
    let r;
    try { r = await vimeoApi('folder'); } catch (e1) { await new Promise((ok) => setTimeout(ok, 1500)); r = await vimeoApi('folder'); }
    el.textContent = `영상 올라갈 비메오 폴더: ${r.folderName}`;
  } catch (e) { el.style.color = 'var(--coral)'; el.textContent = '비메오 폴더 확인 실패: ' + errText(e); }
}
const errText = (e) => ((e && e.message) || String(e)).replace(/^FirebaseError:\s*/, '');

// ── 자료 유형 (자료실 분류와 동일) — 수학은 유형, 영어는 학년으로만 구분 ──
function setupTypes() {
  const eng = SUBJECT[academy] === '영어';
  $('leadText').innerHTML = eng
    ? '올린 자료는 기말고사 자료실에 바로 올라갑니다. <b style="color:var(--ink)">영상은 학생·선생님 모두</b> 볼 수 있고, <b style="color:var(--ink)">PDF는 올릴 때 학생 다운로드 허용 / 목록만 보기</b>를 골라주세요. 선생님은 언제든 내려받을 수 있어요.'
    : '올린 자료는 기말고사 자료실에 바로 올라갑니다. <b style="color:var(--ink)">영상은 학생·선생님 모두</b>, <b style="color:var(--ink)">PDF는 선생님 화면에만</b> 보이고 내려받을 수 있어요.';
  $('pdfKindSub').textContent = eng ? '학생 다운로드 허용 여부 선택' : '선생님만 보임·다운로드';
  if (eng) { $('typeWrap').style.display = 'none'; $('mtype').innerHTML = '<option value=""></option>'; return; }
  const types = ['고1 기출문제', '고2 기출문제', '유형정리', `${academy} 보충`];
  $('mtype').innerHTML = '<option value="">유형 선택</option>' + types.map((t) => `<option>${esc(t)}</option>`).join('');
}
$('mtype').addEventListener('change', () => {
  const t = $('mtype').value;
  $('yearWrap').style.display = /기출문제/.test(t) ? '' : 'none';
  const g = (t.match(/^(고[1-3])/) || [])[1];
  if (g) $('grade').value = g;
});

// ── 영상 / PDF 선택 ──
document.querySelectorAll('.kind-btn').forEach((b) => b.onclick = () => {
  if (busy) return;
  kind = b.dataset.kind;
  document.querySelectorAll('.kind-btn').forEach((x) => x.classList.toggle('on', x === b));
  $('videoSrcTabs').style.display = kind === 'video' ? '' : 'none';
  $('attachWrap').style.display = kind === 'video' ? '' : 'none';
  $('pairWrap').style.display = kind === 'pdf' ? '' : 'none';
  updateDlWrap();
  if (kind === 'pdf') setSrc('file');
  clearFile();
});
document.querySelectorAll('#videoSrcTabs .src-tab').forEach((b) => b.onclick = () => { if (!busy) setSrc(b.dataset.src); });
function updateDlWrap() {
  $('dlWrap').style.display = SUBJECT[academy] === '영어' && (kind === 'pdf' || (kind === 'video' && attachPdf)) ? '' : 'none';
}
// 함께 올릴 PDF 고르기
function setAttach(f) {
  if (f && !(f.type === 'application/pdf' || /\.pdf$/i.test(f.name))) { setMsg('PDF 파일만 함께 올릴 수 있어요.', 'err'); return; }
  if (f && f.size >= MAX_PDF) { setMsg('PDF가 3GB를 넘어요.', 'err'); return; }
  attachPdf = f || null;
  $('attachInput').value = '';
  $('attachText').innerHTML = attachPdf ? `<b>${esc(attachPdf.name)}</b> · ${sizeText(attachPdf.size)}` : '여기를 눌러 <b>PDF</b>를 고르세요';
  $('attachClear').style.display = attachPdf ? '' : 'none';
  updateDlWrap();
}
$('attachDrop').onclick = () => { if (!busy) $('attachInput').click(); };
$('attachInput').onchange = (e) => setAttach(e.target.files[0]);
$('attachClear').onclick = () => { if (!busy) setAttach(null); };
$('attachDrop').addEventListener('dragover', (e) => { e.preventDefault(); $('attachDrop').classList.add('over'); });
$('attachDrop').addEventListener('dragleave', () => $('attachDrop').classList.remove('over'));
$('attachDrop').addEventListener('drop', (e) => { e.preventDefault(); $('attachDrop').classList.remove('over'); if (!busy) setAttach(e.dataTransfer.files[0]); });

document.querySelectorAll('#dlWrap .src-tab').forEach((b) => b.onclick = () => {
  if (busy) return;
  dlChoice = b.dataset.dl;
  document.querySelectorAll('#dlWrap .src-tab').forEach((x) => x.classList.toggle('on', x === b));
});
function setSrc(s) {
  videoSrc = s;
  document.querySelectorAll('#videoSrcTabs .src-tab').forEach((x) => x.classList.toggle('on', x.dataset.src === s));
  $('fileArea').style.display = s === 'file' ? '' : 'none';
  $('linkArea').style.display = s === 'link' ? '' : 'none';
}

// ── 파일 고르기 ──
function clearFile() {
  pickedFile = null;
  $('fileInput').value = '';
  $('fileInput').accept = kind === 'pdf' ? 'application/pdf,.pdf' : 'video/*,.mp4,.mov,.m4v,.avi,.mkv,.wmv,.webm';
  $('dropText').innerHTML = `여기를 눌러 <b>${kind === 'pdf' ? 'PDF 파일' : '영상 파일'}</b>을 고르거나 끌어다 놓으세요`;
  setMsg('');
}
function isOkFile(f) {
  if (kind === 'pdf') return f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
  return f.type.startsWith('video/') || /\.(mp4|mov|m4v|avi|mkv|wmv|webm)$/i.test(f.name);
}
function pick(f) {
  if (!f) return;
  if (!isOkFile(f)) { setMsg(kind === 'pdf' ? 'PDF 파일만 올릴 수 있어요.' : '영상 파일만 올릴 수 있어요.', 'err'); return; }
  if (f.size >= (kind === 'pdf' ? MAX_PDF : MAX_VIDEO)) { setMsg(kind === 'pdf' ? 'PDF가 3GB를 넘어요.' : '영상이 20GB를 넘어요. 용량을 줄여서 올려주세요.', 'err'); return; }
  pickedFile = f;
  $('dropText').innerHTML = `<b>${esc(f.name)}</b> · ${sizeText(f.size)}<br><span style="font-size:0.76rem">다른 파일로 바꾸려면 다시 누르세요</span>`;
  if (!$('title').value.trim()) $('title').value = f.name.replace(/\.[^.]+$/, '').replace(/_+/g, ' ').trim();
  setMsg('');
}
$('drop').onclick = () => { if (!busy) $('fileInput').click(); };
$('fileInput').onchange = (e) => pick(e.target.files[0]);
$('drop').addEventListener('dragover', (e) => { e.preventDefault(); $('drop').classList.add('over'); });
$('drop').addEventListener('dragleave', () => $('drop').classList.remove('over'));
$('drop').addEventListener('drop', (e) => { e.preventDefault(); $('drop').classList.remove('over'); if (!busy) pick(e.dataTransfer.files[0]); });
clearFile();

function setMsg(t, type) { $('msg').textContent = t; $('msg').className = 'msg' + (type ? ' ' + type : ''); }
function setProg(p) { $('prog').style.display = p == null ? 'none' : 'block'; $('progBar').style.width = (p || 0) + '%'; }

// 유튜브·비메오 링크 확인
function parseLink(url) {
  const u = String(url || '').trim();
  let m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  if (m) return { source: 'youtube', url: `https://www.youtube.com/watch?v=${m[1]}` };
  m = u.match(/vimeo\.com\/(?:.*\/)?(\d{6,})(?:\/([0-9a-f]{6,}))?/);
  if (m) return { source: 'vimeo', url: `https://vimeo.com/${m[1]}${m[2] ? '/' + m[2] : ''}` };
  return null;
}

// ── 올리기 ──
$('submitBtn').onclick = async () => {
  if (busy) return;
  const title = $('title').value.replace(/\s+/g, ' ').trim();
  const grade = $('grade').value;
  const subject = SUBJECT[academy];
  const materialType = subject === '영어' ? '' : $('mtype').value;
  const year = /기출문제/.test(materialType) ? $('year').value : '';
  if (!title) return setMsg('자료명을 입력해주세요.', 'err');
  if (!grade) return setMsg('학년을 선택해주세요.', 'err');
  if (subject !== '영어' && !materialType) return setMsg('자료 유형을 선택해주세요.', 'err');
  const withPdf = kind === 'video' ? attachPdf : null;
  if ((kind === 'pdf' || withPdf) && subject === '영어' && !dlChoice) return setMsg('PDF의 학생 다운로드 허용 / 목록만 보기 중 하나를 골라주세요.', 'err');

  const base = { academy, subject, kind, title, grade, materialType, year, createdAt: new Date().toISOString() };
  // PDF: 수학은 선생님만(학생 다운로드 불가), 영어는 고른 대로
  const pdfBase = { ...base, kind: 'pdf', downloadable: subject === '영어' && dlChoice === 'yes' };

  // 영상이 등록된 뒤 함께 고른 PDF를 올려 그 영상과 연결
  const afterVideo = async (videoDocId, okText) => {
    if (!withPdf) return done(okText);
    try {
      await uploadPdf(withPdf, pdfBase, videoDocId, '함께 올린 PDF ');
      done(okText + ' PDF도 함께 올려 영상과 연결했어요.');
    } catch (e) {
      console.error(e);
      done(okText);
      setMsg('영상은 올라갔지만 PDF는 올리지 못했어요. PDF만 다시 올리면서 이 영상을 연결해주세요.', 'err');
    }
  };

  if (kind === 'video' && videoSrc === 'link') {
    const link = parseLink($('linkInput').value);
    if (!link) return setMsg('유튜브나 비메오 영상 주소를 확인해주세요.', 'err');
    busy = true; $('submitBtn').disabled = true; setMsg('등록 중...');
    try {
      const r = await addDoc(collection(db, 'examUploads'), { ...base, source: link.source, url: link.url, storagePath: '', size: 0 });
      await afterVideo(r.id, '올렸습니다! 자료실에 바로 반영됐어요.');
    } catch (e) { fail(e); }
    return;
  }

  if (!pickedFile) return setMsg(kind === 'pdf' ? 'PDF 파일을 골라주세요.' : '영상 파일을 골라주세요.', 'err');
  const f = pickedFile;

  if (kind === 'video') {
    if (!window.tus) return setMsg('업로드 도구를 불러오지 못했어요. 새로고침 후 다시 해주세요.', 'err');
    busy = true; $('submitBtn').disabled = true; setProg(0); setMsg('비메오 업로드 준비 중...');
    let vimeoId = '';
    window.onbeforeunload = () => '업로드 중입니다';
    try {
      const r = await vimeoApi('createUpload', { title, size: f.size });
      vimeoId = r.vimeoId;
      await new Promise((ok, no) => {
        new window.tus.Upload(f, {
          uploadUrl: r.uploadLink,
          chunkSize: 64 * 1024 * 1024,
          retryDelays: [0, 2000, 5000, 10000, 20000, 30000],
          onProgress: (sent, total) => {
            const p = Math.round((sent / total) * 100);
            setProg(p); setMsg(`비메오로 올리는 중 ${p}% (${sizeText(sent)} / ${sizeText(total)})`);
          },
          onSuccess: ok, onError: no,
        }).start();
      });
      setMsg('자료실에 등록 중...');
      const fin = await vimeoApi('finalize', { vimeoId, title, grade, materialType, year });
      vimeoId = '';
      await afterVideo(fin.id, '비메오에 올렸습니다! 자료실에 바로 반영됐어요. (비메오 변환이 끝나기까지 몇 분 걸릴 수 있어요)');
    } catch (e) {
      if (vimeoId) vimeoApi('cancel', { vimeoId }).catch(() => {});
      fail({ message: errText(e) });
    } finally { window.onbeforeunload = null; }
    return;
  }

  // PDF만 올리기 (고른 영상이 있으면 연결)
  busy = true; $('submitBtn').disabled = true;
  window.onbeforeunload = () => '업로드 중입니다';
  try {
    await uploadPdf(f, pdfBase, $('pairSel').value, '');
    done();
  } catch (e) { fail(e); }
  finally { window.onbeforeunload = null; }
};
// PDF를 파이어베이스 저장소에 올리고 목록에 등록 (videoDocId 가 있으면 그 영상과 연결)
async function uploadPdf(f, b, videoDocId, label) {
  const safeName = f.name.replace(/[\\/#?\[\]*]/g, '_');
  const path = `examUploads/${academy}/${Date.now()}_${safeName}`;
  setProg(0); setMsg(label + '올리는 중 0%');
  const task = uploadBytesResumable(ref(storage, path), f, { contentType: 'application/pdf' });
  await new Promise((ok, no) => task.on('state_changed', (s) => {
    const p = Math.round((s.bytesTransferred / s.totalBytes) * 100);
    setProg(p); setMsg(`${label}올리는 중 ${p}% (${sizeText(s.bytesTransferred)} / ${sizeText(s.totalBytes)})`);
  }, no, ok));
  const url = await getDownloadURL(task.snapshot.ref);
  const docData = { ...b, kind: 'pdf', source: 'file', url, storagePath: path, size: f.size };
  if (videoDocId) docData.videoDocId = videoDocId;
  await addDoc(collection(db, 'examUploads'), docData);
}
function done(text) {
  busy = false; $('submitBtn').disabled = false; setProg(null);
  $('title').value = ''; $('linkInput').value = '';
  dlChoice = ''; document.querySelectorAll('#dlWrap .src-tab').forEach((x) => x.classList.remove('on'));
  setAttach(null);
  $('pairSel').value = '';
  clearFile();
  setMsg(text || '올렸습니다! 자료실에 바로 반영됐어요.', 'ok');
  loadList();
}
function fail(e) {
  console.error(e);
  busy = false; $('submitBtn').disabled = false; setProg(null);
  setMsg('올리지 못했어요. 잠시 후 다시 시도해주세요. (' + ((e && e.code) || (e && e.message) || e) + ')', 'err');
}

// ── 우리 학원이 올린 자료 목록 ──
async function loadList() {
  try {
    const snap = await getDocs(query(collection(db, 'examUploads'), where('academy', '==', academy)));
    items = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    renderList();
  } catch (e) { console.error(e); $('list').innerHTML = '<div class="empty">목록을 불러오지 못했어요.</div>'; }
}
function renderList() {
  const videos = items.filter((i) => i.kind === 'video');
  const videoIds = new Set(videos.map((v) => v.id));
  const videoOpts = (sel) => '<option value="">영상 연결 안 함</option>' + videos.map((v) => `<option value="${esc(v.id)}"${v.id === sel ? ' selected' : ''}>${esc(v.title)}${v.grade ? ' (' + esc(v.grade) + ')' : ''}</option>`).join('');
  // PDF만 올릴 때 고르는 영상 목록
  const cur = $('pairSel').value;
  $('pairSel').innerHTML = videoOpts(cur).replace('영상 연결 안 함', '연결 안 함');
  // 순서: 영상 바로 아래에 연결된 PDF
  const linked = (i) => i.kind === 'pdf' && i.videoDocId && videoIds.has(i.videoDocId);
  let ordered = [];
  if (!listFilter) {
    items.forEach((i) => {
      if (linked(i)) return;
      ordered.push(i);
      if (i.kind === 'video') items.filter((p) => linked(p) && p.videoDocId === i.id).forEach((p) => ordered.push({ ...p, _sub: true }));
    });
  } else ordered = items.filter((i) => i.kind === listFilter);
  const list = ordered;
  if (!list.length) { $('list').innerHTML = '<div class="empty">아직 올린 자료가 없어요.</div>'; return; }
  $('list').innerHTML = list.map((i) => {
    const dlLabel = i.kind === 'pdf' && i.subject === '영어' ? (i.downloadable ? '학생 다운로드 허용' : '목록만(다운로드 불가)') : '';
    const meta = [dlLabel, i.grade, i.materialType, i.year && i.year + '년', i.kind === 'video' && i.source !== 'file' ? (i.source === 'youtube' ? '유튜브 링크' : i.vimeoId ? '비메오 업로드' + (i.size ? ' ' + sizeText(i.size) : '') : '비메오 링크') : (i.size ? sizeText(i.size) : ''), String(i.createdAt || '').slice(0, 10)].filter(Boolean).join(' · ');
    const pdfCount = i.kind === 'video' ? items.filter((p) => linked(p) && p.videoDocId === i.id).length : 0;
    const pairHtml = i.kind === 'pdf'
      ? `<div class="item-pair">연결된 영상 <select data-pair="${esc(i.id)}">${videoOpts(videoIds.has(i.videoDocId) ? i.videoDocId : '')}</select></div>`
      : (pdfCount ? `<div class="item-pair">📎 연결된 PDF ${pdfCount}개</div>` : '');
    return `<div class="item${i._sub ? ' sub' : ''}">
      <span class="badge ${i.kind}">${i.kind === 'pdf' ? 'PDF' : '영상'}</span>
      <div class="item-main"><div class="item-title">${esc(i.title)}</div><div class="item-meta">${esc(meta)}</div>${pairHtml}</div>
      <a href="${esc(i.url)}" target="_blank" rel="noopener">${i.kind === 'pdf' ? '열기' : '보기'}</a>
      ${i.kind === 'pdf' ? `<button class="dl" data-dl-id="${esc(i.id)}">다운로드</button>` : ''}
      <button data-del="${esc(i.id)}">삭제</button>
    </div>`;
  }).join('');
}
document.querySelectorAll('.filter .src-tab').forEach((b) => b.onclick = () => {
  listFilter = b.dataset.f;
  document.querySelectorAll('.filter .src-tab').forEach((x) => x.classList.toggle('on', x === b));
  renderList();
});
// PDF 내려받기 (파일 이름 = 자료명.pdf)
async function downloadPdf(url, name, btn) {
  const old = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '받는 중...'; }
  try {
    const blob = await (await fetch(url)).blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = String(name || '자료').replace(/[\\/:*?"<>|]/g, '_') + '.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  } catch (err) { window.open(url, '_blank'); }
  finally { if (btn) { btn.disabled = false; btn.textContent = old; } }
}
// 이미 올린 PDF ↔ 영상 연결 바꾸기
$('list').addEventListener('change', async (e) => {
  const id = e.target.dataset && e.target.dataset.pair;
  if (!id) return;
  e.target.disabled = true;
  try {
    await updateDoc(doc(db, 'examUploads', id), { videoDocId: e.target.value });
    const it = items.find((x) => x.id === id);
    if (it) it.videoDocId = e.target.value;
    renderList();
  } catch (err) { console.error(err); alert('연결하지 못했어요. 잠시 후 다시 시도해주세요.'); e.target.disabled = false; }
});
$('list').addEventListener('click', async (e) => {
  const dlId = e.target.dataset && e.target.dataset.dlId;
  if (dlId) { const it = items.find((x) => x.id === dlId); if (it) downloadPdf(it.url, it.title, e.target); return; }
  const id = e.target.dataset && e.target.dataset.del;
  if (!id) return;
  const it = items.find((x) => x.id === id);
  if (!it || !confirm(`「${it.title}」을(를) 삭제할까요?\n자료실에서도 바로 사라집니다.`)) return;
  e.target.disabled = true;
  try {
    if (it.vimeoId) {
      // 비메오에 올린 영상은 서버에서 비메오 영상까지 함께 삭제
      await vimeoApi('delete', { docId: id });
    } else {
      if (it.storagePath) { try { await deleteObject(ref(storage, it.storagePath)); } catch (err) { console.warn(err); } }
      await deleteDoc(doc(db, 'examUploads', id));
    }
    loadList();
  } catch (err) { console.error(err); alert('삭제하지 못했어요.'); e.target.disabled = false; }
});
</script>
