<!DOCTYPE html>

<style>

  :root{
    --paper:#0E1420;
    --paper-soft:#171F2F;
    --ink:#F1EFE8;
    --ink-soft:#9CA3B5;

  body{

  .material-row{

    align-items:center;
    gap:14px;

  .material-row:last-child{border-bottom:none;}

  .material-row .grade-tag{

  .material-row-title{

<script type="module">
// 0) 학원별 인증번호 — 한번 정하면 계속 그대로 씁니다. 값만 바꾸면 코드 수정 없이 변경돼요.
//    선생님용 코드와 학생용 코드를 서로 다른 값으로 따로 관리합니다.
const TEACHER_CODES = {
  "SWC2026teacher": "송우찬수학학원",
  "APEX2026teacher": "에이펙스영어학원",
  "INUS2026teacher": "인어스수학학원",
  "LEMON2026teacher": "대치레몬학원",
};

const STUDENT_CODES = {
  "SWC2026": "송우찬수학학원",
  "APEX2026": "에이펙스영어학원",
  "INUS2026": "인어스수학학원",
  "LEMON2026": "대치레몬학원",
};

function showSite(academyName, role){
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('siteContent').style.display = 'block';
  const roleLabel = role === 'student' ? '학생' : '선생님';
  document.getElementById('authWelcome').textContent = academyName ? `${academyName} ${roleLabel}, 안녕하세요` : '';
}

// 대소문자 구분 없이 매칭하기 위해 코드를 대문자로 정규화한 조회용 맵을 만듭니다.
function normalizeCodes(codes){
  const normalized = {};
  Object.keys(codes).forEach(code=>{
    normalized[code.toUpperCase()] = codes[code];
  });
  return normalized;
}
const TEACHER_CODES_NORMALIZED = normalizeCodes(TEACHER_CODES);
const STUDENT_CODES_NORMALIZED = normalizeCodes(STUDENT_CODES);

// 입력된 코드가 선생님/학생 중 어느 쪽인지 찾아줍니다.
function resolveAuth(rawCode){
  const code = rawCode.trim().toUpperCase();
  if(TEACHER_CODES_NORMALIZED[code]){
    return { academyName: TEACHER_CODES_NORMALIZED[code], role: 'teacher', code };
  }
  if(STUDENT_CODES_NORMALIZED[code]){
    return { academyName: STUDENT_CODES_NORMALIZED[code], role: 'student', code };
  }
  return null;
}

window.tryAuth = function(){
  const input = document.getElementById('authCodeInput');
  const auth = resolveAuth(input.value);
  if(auth){
    sessionStorage.setItem('examAuthCode', auth.code);
    sessionStorage.setItem('examAuthRole', auth.role);
    showSite(auth.academyName, auth.role);
  }else{
    document.getElementById('authError').textContent = '인증번호가 올바르지 않습니다.';
  }
};

document.getElementById('authCodeInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') window.tryAuth();
});

(function checkExistingAuth(){
  const savedCode = sessionStorage.getItem('examAuthCode');
  if(!savedCode) return;
  const savedRole = sessionStorage.getItem('examAuthRole');
  const codes = savedRole === 'student' ? STUDENT_CODES_NORMALIZED : TEACHER_CODES_NORMALIZED;
  const academyName = codes[savedCode.toUpperCase()];
  if(academyName) showSite(academyName, savedRole);
})();

// 2) 자료실 데이터는 이제 admin.html "중간고사 자료" 탭에서 Vimeo 폴더 → examMaterials
//    컬렉션으로 저장해둔 걸 그대로 읽어옵니다. 실제 Vimeo 연동은 admin.html에서 이뤄집니다.
//    (아래 ACADEMIES의 vimeoFolder 값은 admin.html 쪽 학원명과 맞춰두는 용도의 참고용입니다.)

// 3) 학교별 중간고사 시작일

function renderSubjectNav(){
  const nav = document.getElementById('subjectNav');
  const all = document.createElement('div');
  all.className = 'subject-pill active';
  all.textContent = '전체 과목';
  all.dataset.subject = '';
  all.style.background = 'var(--gold)';
  all.style.color = 'var(--charcoal-deep)';
  nav.appendChild(all);

  // 학원별이 아닌 과목별로 중복 없이 표시 (예: 수학, 영어)
  const uniqueSubjects = [...new Set(ACADEMIES.map(a=>a.subject))];
  uniqueSubjects.forEach(subj=>{
    const pill = document.createElement('div');
    pill.className = 'subject-pill';
    pill.textContent = subj;
    pill.dataset.subject = subj;
    nav.appendChild(pill);
  });

  nav.addEventListener('click', (e)=>{
    if(!e.target.classList.contains('subject-pill')) return;
    [...nav.children].forEach(p=>{
      p.classList.remove('active');
      p.style.background = 'var(--paper)';
      p.style.color = 'var(--ink-soft)';
    });
    e.target.classList.add('active');
    const subj = e.target.dataset.subject;
    const academy = ACADEMIES.find(a=>a.subject === subj);
    e.target.style.background = academy ? academy.color : 'var(--gold)';
    e.target.style.color = academy ? '#fff' : 'var(--charcoal-deep)';
    currentSubjectFilter = subj;
    currentTypeFilter = '';
    renderTypeNav();
    renderMaterials();
  });
}
let currentSubjectFilter = '';
renderSubjectNav();

// 과목 하위 분류 — 수학은 자료 유형(기출문제/유형정리/보충) 기준, 영어는 학년 기준으로 나눕니다.
const MATERIAL_TYPES_MATH = ['고1 기출문제', '고2 기출문제', '유형정리', '송우찬수학학원 보충', '인어스수학학원 보충'];
const MATERIAL_TYPES_ENGLISH = ['중1', '중2', '중3', '고1', '고2', '고3'];
function currentTypeField(){
  return currentSubjectFilter === '영어' ? '학년' : '자료유형';
}
function renderTypeNav(){
  const nav = document.getElementById('typeNav');
  nav.innerHTML = '';
  const all = document.createElement('div');
  all.className = 'type-pill active';
  all.textContent = '전체';
  all.dataset.type = '';
  nav.appendChild(all);

  const types = currentSubjectFilter === '영어' ? MATERIAL_TYPES_ENGLISH : MATERIAL_TYPES_MATH;
  types.forEach(t=>{
    const pill = document.createElement('div');
    pill.className = 'type-pill';
    pill.textContent = t;
    pill.dataset.type = t;
    nav.appendChild(pill);
  });

  nav.addEventListener('click', (e)=>{
    if(!e.target.classList.contains('type-pill')) return;
    [...nav.children].forEach(p=>p.classList.remove('active'));
    e.target.classList.add('active');
    currentTypeFilter = e.target.dataset.type;
    renderMaterials();
  });
}
let currentTypeFilter = '';
renderTypeNav();

let ALL_ITEMS = [];

function renderFilterGrade(items){
  const grades = [...new Set(items.map(i=>i['학년']).filter(Boolean))];
  const sel = document.getElementById('filterGrade');
  sel.innerHTML = '<option value="">전체 학년</option>';
  grades.forEach(g=>{
    const opt = document.createElement('option');
    opt.value = g; opt.textContent = g;
    sel.appendChild(opt);
  });
}

// 영상 제목에서 "고1","중2","고3" 같은 학년 표기를 뽑아내 태그로 사용
function extractGrade(title){
  const m = title.match(/(중|고)[1-3]/);
  return m ? m[0] : '';
}

// 학년 정렬 순서 (고1→고2→고3→중1→중2→중3→기타)
const GRADE_ORDER = ['고1','고2','고3','중1','중2','중3'];
function gradeSortIndex(g){
  const i = GRADE_ORDER.indexOf(g);
  return i === -1 ? GRADE_ORDER.length : i;
}

function renderMaterials(){
  const grade = document.getElementById('filterGrade').value;
  const keyword = document.getElementById('filterKeyword').value.trim().toLowerCase();

  let items = ALL_ITEMS.filter(i=>{
    if(currentSubjectFilter && i['과목'] !== currentSubjectFilter) return false;
    if(currentTypeFilter && i[currentTypeField()] !== currentTypeFilter) return false;
    if(grade && i['학년'] !== grade) return false;
    if(keyword && !(i['자료명']||'').toLowerCase().includes(keyword)) return false;
    return true;
  });

  const container = document.getElementById('materialsContainer');
  container.innerHTML = '';

  // 학원 구분 없이 과목 단위로 합쳐서 보여주고, 그 안을 학년으로 나눕니다.
  const uniqueSubjects = [...new Set(ACADEMIES.map(a=>a.subject))];
  const subjectsToShow = currentSubjectFilter
    ? uniqueSubjects.filter(s=>s === currentSubjectFilter)
    : uniqueSubjects;

  let anyRendered = false;

  subjectsToShow.forEach(subject=>{
    const subjectItems = items.filter(i=>i['과목'] === subject);
    if(subjectItems.length === 0) return;
    anyRendered = true;

    const academy = ACADEMIES.find(a=>a.subject === subject);
    const color = academy ? academy.color : 'var(--ink)';

    const group = document.createElement('div');
    group.className = 'subject-group';
    group.style.background = hexToSoft(color);

    const head = document.createElement('div');
    head.className = 'head';
    head.innerHTML = `
      <div class="logo-slot" style="background:${color}">${subject.slice(0,1)}</div>
      <div class="titles">
        <div class="subj">${subject}</div>
      </div>
      <div class="count">${subjectItems.length}개 자료</div>
    `;
    group.appendChild(head);

    // 학년별로 묶기
    const gradesPresent = [...new Set(subjectItems.map(i=>i['학년']||'학년 미지정'))]
      .sort((a,b)=>gradeSortIndex(a)-gradeSortIndex(b));

    gradesPresent.forEach(g=>{
      const gradeItems = subjectItems.filter(i=>(i['학년']||'학년 미지정') === g);

      const gradeBlock = document.createElement('details');
      gradeBlock.className = 'grade-block';

      const gradeHead = document.createElement('summary');
      gradeHead.className = 'grade-block-head';
      gradeHead.innerHTML = `<span>${g}</span><span class="grade-count">${gradeItems.length}개</span>`;
      gradeBlock.appendChild(gradeHead);

      const list = document.createElement('div');
      list.className = 'material-list';
      gradeItems.forEach(item=>{
        const vimeoId = extractVimeoId(item['링크']);
        const isPdf = item['형식'] === 'PDF';
        const rowAcademy = ACADEMIES.find(ac=>ac.school === item['학원명']);
        const rowLogoHtml = rowAcademy && rowAcademy.logo
          ? `<img src="${rowAcademy.logo}" alt="" style="width:16px;height:16px;border-radius:50%;object-fit:${rowAcademy.fit||'cover'};margin-right:5px;vertical-align:-3px;">`
          : rowAcademy
            ? `<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${rowAcademy.color};margin-right:5px;vertical-align:-2px;"></span>`
            : '';
        const formatBadge = isPdf
          ? `<span style="font-size:0.66rem;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:20px;padding:1px 8px;margin-right:6px;vertical-align:1px;">PDF</span>`
          : '';

        if(isPdf){
          // PDF는 클릭하면 바로 열리는 대신, 미리보기(새 탭에서 보기)/다운로드(파일로 저장)를 구분해서 제공합니다.
          const row = document.createElement('div');
          row.className = 'material-row';
          row.innerHTML = `
            <span class="grade-tag">${rowLogoHtml}${item['학원명']||''}</span>
            ${formatBadge}<span class="material-row-title">${item['자료명']||'(제목 없음)'}</span>
            <span class="meta">${item['업로드일']||''}</span>
            <span class="material-row-actions">
              <a class="material-action-btn" href="${item['링크']}" target="_blank" rel="noopener">미리보기</a>
              <a class="material-action-btn download" href="#">다운로드</a>
            </span>
          `;
          const downloadBtn = row.querySelector('.download');
          downloadBtn.addEventListener('click', async (e)=>{
            e.preventDefault();
            try{
              const res = await fetch(item['링크']);
              const blob = await res.blob();
              const blobUrl = URL.createObjectURL(blob);
              const tempA = document.createElement('a');
              tempA.href = blobUrl;
              tempA.download = (item['자료명']||'자료') + '.pdf';
              document.body.appendChild(tempA);
              tempA.click();
              document.body.removeChild(tempA);
              URL.revokeObjectURL(blobUrl);
            }catch(err){
              // 브라우저/네트워크 사정으로 강제 다운로드가 안 되면 새 탭으로라도 열어줍니다.
              window.open(item['링크'], '_blank');
            }
          });
          list.appendChild(row);
          return;
        }

        const a = document.createElement('a');
        a.className = 'material-row';
        a.href = item['링크'] || '#';
        if(vimeoId){
          // 비메오 영상은 새 탭으로 보내지 않고 팝업(모달)로 재생합니다.
          a.addEventListener('click', (e)=>{
            e.preventDefault();
            openVimeoModal(vimeoId, item['자료명']||'');
          });
        }else{
          a.target = '_blank';
          a.rel = 'noopener';
        }
        a.innerHTML = `
          <span class="grade-tag">${rowLogoHtml}${item['학원명']||''}</span>
          ${formatBadge}<span class="material-row-title">${item['자료명']||'(제목 없음)'}</span>
          <span class="meta">${item['업로드일']||''}</span>
        `;
        list.appendChild(a);
      });
      gradeBlock.appendChild(list);
      group.appendChild(gradeBlock);
    });

    container.appendChild(group);
  });

  if(!anyRendered){
    container.innerHTML = '<div class="empty-state">조건에 맞는 자료가 아직 없습니다. 조건을 바꿔서 다시 확인해 보세요.</div>';
  }
}

// 자료 링크에서 Vimeo 영상 ID를 추출합니다. (예: https://vimeo.com/123456789 → 123456789)
function extractVimeoId(url){
  if(!url) return null;
  const m = url.match(/vimeo\.com\/(?:.*\/)?(\d+)/);
  return m ? m[1] : null;
}

// 비메오 영상을 새 탭으로 보내지 않고 팝업(모달)에서 재생합니다.
function openVimeoModal(vimeoId, title){
  const modal = document.getElementById('vimeoModal');
  const frame = document.getElementById('vimeoModalFrame');
  const titleEl = document.getElementById('vimeoModalTitle');
  frame.src = `https://player.vimeo.com/video/${vimeoId}?autoplay=1`;
  titleEl.textContent = title || '';
  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeVimeoModal(){
  const modal = document.getElementById('vimeoModal');
  const frame = document.getElementById('vimeoModalFrame');
  modal.style.display = 'none';
  frame.src = ''; // 닫을 때 재생 중지
  document.body.style.overflow = '';
}
window.closeVimeoModal = closeVimeoModal;

document.getElementById('vimeoModalOverlay').addEventListener('click', closeVimeoModal);
document.getElementById('vimeoModalClose').addEventListener('click', closeVimeoModal);
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') closeVimeoModal();
});

function hexToSoft(hex){
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},0.06)`;
}

document.getElementById('filterGrade').addEventListener('change', renderMaterials);
document.getElementById('filterKeyword').addEventListener('input', renderMaterials);

// ── 자료 불러오기 (Firebase Firestore) ──
// admin.html "중간고사 자료" 탭에서 Vimeo 폴더 → examMaterials 컬렉션으로 저장해둔 자료를
// 그대로 읽어옵니다. 실제 Vimeo 연동/폴더 관리는 admin.html에서 이뤄집니다.
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD_eYNKzfa-aT41E3Dqt_HyJc6UeSR5ErA",
  authDomain: "songmath.firebaseapp.com",
  projectId: "songmath",
  storageBucket: "songmath.firebasestorage.app",
  messagingSenderId: "936295436575",
  appId: "1:936295436575:web:d1e201508719850cfbe02a"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadData(){
  const container = document.getElementById('materialsContainer');
  container.innerHTML = '<div class="empty-state">자료를 불러오는 중입니다…</div>';
  try{
    const snap = await getDocs(query(collection(db, 'examMaterials'), orderBy('order', 'asc')));
    const items = [];
    snap.forEach(d=>{
      const v = d.data();
      if(v.active === false) return;
      // 자료마다 형태가 다릅니다: Vimeo 영상(vimeoId)이 있으면 영상 자료,
      // 없고 pdfUrl이 있으면 PDF 자료(예: 영어 자료실은 PDF만 업로드).
      const isVideo = !!v.vimeoId;
      items.push({
        '학원명': v.academy || '',
        // 예전에 "미정"으로 저장된 자료(주로 인어스수학학원)는 수학으로 취급합니다.
        '과목': (v.subject === '미정' ? '수학' : v.subject) || '',
        '자료유형': v.materialType || '',
        '학년': v.grade || '',
        '자료명': v.title || '(제목 없음)',
        '링크': isVideo ? `https://vimeo.com/${v.vimeoId}` : (v.pdfUrl || v.fileUrl || ''),
        '업로드일': (v.createdAt || '').slice(0,10),
        '썸네일': isVideo ? `https://vumbnail.com/${v.vimeoId}.jpg` : '',
        '형식': isVideo ? '영상' : 'PDF',
      });
    });
    ALL_ITEMS = items;
    renderFilterGrade(ALL_ITEMS);
    renderMaterials();
    if(items.length === 0){
      container.innerHTML = '<div class="empty-state">아직 등록된 자료가 없습니다. admin.html의 "중간고사 자료" 탭에서 Vimeo 폴더 또는 PDF를 불러와 추가해주세요.</div>';
    }
  }catch(e){
    container.innerHTML = '<div class="empty-state">자료를 불러오지 못했습니다.</div>';
    console.error(e);
  }
}
loadData();
</script>
