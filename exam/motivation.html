<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공부하기 싫을때 | 2026 2학기 중간고사 대비 · 평촌 학원 연합</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  :root{
    --paper:#0E1420;
    --paper-soft:#171F2F;
    --ink:#F1EFE8;
    --ink-soft:#9CA3B5;
    --line:#2B3348;
    --blue:#5B7FFF;
    --coral:#E8583C;
    --sun:#FFC23A;
    --green:#2FA36B;
    --card:#161E2E;
    --gold:#D2AF6E;
    --gold-soft:#E4D3AC;
    --charcoal:#15130F;
    --charcoal-deep:#0C0B08;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Pretendard','Noto Sans KR',sans-serif;
    line-height:1.6;
  }
  h1,h2,h3,.serif{font-family:'Nanum Myeongjo',serif;}
  a{color:inherit;}

  header{
    padding:18px 6vw;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  .brand{
    font-weight:700;
    font-size:0.92rem;
    letter-spacing:0.02em;
    color:var(--ink);
    text-decoration:none;
  }
  .brand .brand-sub{
    display:block;
    font-size:0.62rem;
    font-weight:600;
    letter-spacing:0.18em;
    color:var(--gold);
    margin-bottom:3px;
  }
  nav .nav-btn{
    margin-left:12px;
    display:inline-block;
    border:1px solid var(--gold);
    color:var(--gold);
    background:transparent;
    padding:8px 18px;
    border-radius:2px;
    font-size:0.8rem;
    font-weight:700;
    letter-spacing:0.03em;
    transition:background .15s, color .15s;
  }
  nav .nav-btn:hover{background:var(--gold);color:var(--charcoal-deep);}
  nav .nav-btn.solid{
    background:var(--gold);
    color:var(--charcoal-deep);
    border-color:var(--gold);
  }
  nav .nav-btn.solid:hover{background:var(--gold-soft);border-color:var(--gold-soft);}
  .back-home-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:7px 16px;
    border-radius:30px;
    font-size:0.82rem;
    text-decoration:none;
    transition:border-color .15s, color .15s;
    margin-left:12px;
  }
  .back-home-link:hover{border-color:var(--gold);color:var(--gold);}

  .section-eyebrow{
    font-size:0.7rem;
    font-weight:700;
    letter-spacing:0.3em;
    color:var(--gold);
    text-align:center;
    margin-bottom:10px;
  }
  .section-heading{
    font-family:'Nanum Myeongjo',serif;
    font-size:1.5rem;
    font-weight:700;
    text-align:center;
    color:var(--ink);
    margin:0 0 12px;
  }
  .section-sub{
    text-align:center;
    color:var(--ink-soft);
    font-size:0.9rem;
    max-width:560px;
    margin:0 auto 36px;
  }

  .hero-cta{
    display:inline-block;
    border:1px solid var(--gold);
    color:var(--gold);
    background:transparent;
    padding:13px 34px;
    border-radius:2px;
    text-decoration:none;
    font-size:0.86rem;
    font-weight:700;
    letter-spacing:0.08em;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .hero-cta:hover{background:var(--gold);color:var(--charcoal-deep);}
  .hero-cta.solid{
    background:var(--gold);
    color:var(--charcoal-deep);
    border-color:var(--gold);
  }
  .hero-cta.solid:hover{background:var(--gold-soft);border-color:var(--gold-soft);}

  footer{
    padding:26px 6vw;
    font-size:0.82rem;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    border-top:1px solid var(--line);
  }

  /* ── 로그인 게이트 ── */
  .auth-gate{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .auth-card{
    width:100%;
    max-width:360px;
    text-align:center;
    padding:36px 30px;
    background:var(--paper-soft);
    border:1px solid var(--line);
    border-radius:10px;
  }
  .auth-title{
    font-family:'Nanum Myeongjo',serif;
    font-size:1.3rem;
    font-weight:700;
    margin-bottom:8px;
  }
  .auth-sub{
    font-size:0.84rem;
    color:var(--ink-soft);
    margin-bottom:22px;
    line-height:1.6;
  }
  .auth-card input{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--paper);
    color:var(--ink);
    font-size:0.95rem;
    margin-bottom:14px;
    box-sizing:border-box;
  }
  .auth-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:6px;
    background:var(--gold);
    color:var(--charcoal-deep);
    font-weight:700;
    font-size:0.9rem;
    cursor:pointer;
    transition:background .15s;
  }
  .auth-btn:hover{background:var(--gold-soft);}
  .auth-error{
    color:var(--coral);
    font-size:0.82rem;
    margin-top:10px;
    min-height:1.2em;
  }

  /* ── MOTIVATION ── */
  .motivation-section{
    max-width:1180px;
    margin:0 auto;
    padding:56px 6vw 72px;
  }
  .motiv-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:20px;
  }
  .motiv-card{
    display:block;
    text-align:left;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    cursor:pointer;
    text-decoration:none;
    color:inherit;
    transition:transform 0.15s ease, border-color 0.15s ease;
  }
  .motiv-card:hover{
    transform:translateY(-2px);
    border-color:var(--gold);
  }
  .motiv-thumb{
    position:relative;
    width:100%;
    padding-top:56.25%;
    background:#000;
    overflow:hidden;
  }
  .motiv-thumb img{
    position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;
  }
  .motiv-thumb .play-badge{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:2.2rem;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.6);
    background:linear-gradient(rgba(0,0,0,0.05),rgba(0,0,0,0.25));
  }
  .motiv-body{
    padding:12px 14px 14px;
  }
  .motiv-title{
    font-size:0.9rem;
    font-weight:700;
    color:var(--ink);
    margin-bottom:6px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .motiv-meta{
    font-size:0.72rem;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .motiv-delete{
    background:transparent;
    border:none;
    color:var(--ink-soft);
    font-size:0.7rem;
    cursor:pointer;
    text-decoration:underline;
  }
  .motiv-delete:hover{color:var(--coral);}
  .motiv-empty{
    grid-column:1/-1;
    text-align:center;
    color:var(--ink-soft);
    font-size:0.88rem;
    padding:24px 0;
  }

</style>
</head>
<body>

<!-- ── 로그인 게이트 (학원별 인증번호) ── -->
<div class="auth-gate" id="authGate">
  <div class="auth-card">
    <div style="font-size:0.62rem;font-weight:600;letter-spacing:0.18em;color:var(--gold);margin-bottom:10px;">TEAM I:DEA</div>
    <div class="auth-title">2026년 2학기 중간고사 대비</div>
    <div class="auth-sub">연합 학원 선생님·학생만 입장 가능합니다. 인증번호를 입력해주세요.</div>
    <input type="password" id="authCodeInput" placeholder="인증번호" autocomplete="off">
    <button class="auth-btn" onclick="tryAuth()">입장하기</button>
    <div class="auth-error" id="authError"></div>
  </div>
</div>

<!-- ── 유튜브 영상 팝업 모달 ── -->
<div id="youtubeModal" style="display:none;position:fixed;inset:0;z-index:1000;align-items:center;justify-content:center;">
  <div id="youtubeModalOverlay" style="position:absolute;inset:0;background:rgba(12,11,8,0.82);"></div>
  <div style="position:relative;width:min(90vw,1000px);background:#000;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.5);">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--charcoal-deep);">
      <div id="youtubeModalTitle" style="color:#fff;font-size:0.92rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:12px;"></div>
      <button id="youtubeModalClose" aria-label="닫기" style="flex-shrink:0;border:none;background:transparent;color:#fff;font-size:1.4rem;line-height:1;cursor:pointer;padding:4px 8px;">✕</button>
    </div>
    <div style="position:relative;width:100%;padding-top:56.25%;">
      <iframe id="youtubeModalFrame" src="" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>
</div>

<div id="siteContent" style="display:none;">

<header>
  <a href="index.html" class="brand"><span class="brand-sub">TEAM I:DEA</span>평촌 학원 연합 · 중간고사 대비</a>
  <nav>
    <span id="authWelcome" style="margin-right:16px;color:var(--ink-soft);font-size:0.85rem;"></span>
    <a href="index.html" class="back-home-link">← 홈으로</a>
    <a href="materials.html" class="nav-btn solid">자료실</a>
    <a href="qna.html" class="nav-btn">질문 게시판</a>
  </nav>
</header>

<section class="motivation-section" id="motivationSection">
  <div class="section-eyebrow">TAKE A BREAK</div>
  <div class="section-heading">공부하기 싫을때</div>
  <div class="section-sub">잠깐 쉬어가도 괜찮아요. 마음 다잡는 데 도움이 될 영상들을 모아뒀어요.</div>
  <div id="motivationTeacherBar" style="display:none;max-width:640px;margin:0 auto 28px;padding:16px;border:1px solid var(--line);border-radius:8px;background:var(--paper-soft);">
    <div style="font-size:0.8rem;color:var(--ink-soft);margin-bottom:10px;">선생님만 볼 수 있는 업로드 창입니다 — 유튜브 영상 링크를 등록하면 모두에게 바로 노출됩니다.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <input type="text" id="motivTitle" placeholder="영상 제목" style="flex:1;min-width:160px;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);">
      <input type="text" id="motivUrl" placeholder="유튜브 링크 (https://youtube.com/watch?v=...)" style="flex:2;min-width:220px;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);">
      <button class="hero-cta solid" style="padding:9px 20px;font-size:0.82rem;" onclick="addMotivationVideo()">등록</button>
    </div>
    <div id="motivMsg" style="font-size:0.78rem;margin-top:8px;color:var(--gold);"></div>
  </div>
  <div class="motiv-grid" id="motivationList"></div>
</section>

<footer>
  <div>평촌 학원 연합 · 중간고사 대비 자료실</div>
  <div>문의: 송우찬수학학원 평촌관 원장 송문찬</div>
</footer>

</div><!-- /#siteContent -->

<script type="module">
// ── Firebase 초기화 (songmath 프로젝트 공용) — 로그인 확인(checkExistingAuth)보다 먼저 db가 준비되어야 함
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD_eYNKzfa-aT41E3Dqt_HyJc6UeSR5ErA",
  authDomain: "songmath.firebaseapp.com",
  projectId: "songmath",
  storageBucket: "songmath.firebasestorage.app",
  messagingSenderId: "936295436575",
  appId: "1:936295436575:web:d1e201508719850cfbe02a"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 0) 학원별 인증번호 — 다른 페이지(index.html, materials.html, qna.html)와 동일한 값을 사용합니다.
const TEACHER_CODES = {
  "SWC2026teacher": "송우찬수학학원",
  "APEX2026teacher": "에이펙스영어학원",
  "INUS2026teacher": "인어스수학학원",
  "LEMON2026teacher": "대치레몬학원",
};

const STUDENT_CODES = {
  "SWC2026": "송우찬수학학원",
  "APEX2026": "에이펙스영어학원",
  "INUS2026": "인어스수학학원",
  "LEMON2026": "대치레몬학원",
};

let currentRole = null;
let currentAcademyName = null;

function showSite(academyName, role){
  currentRole = role;
  currentAcademyName = academyName;
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('siteContent').style.display = 'block';
  const roleLabel = role === 'student' ? '학생' : '선생님';
  document.getElementById('authWelcome').textContent = academyName ? `${academyName} ${roleLabel}, 안녕하세요` : '';
  if(role === 'teacher'){
    document.getElementById('motivationTeacherBar').style.display = 'block';
  }
  loadMotivationVideos();
}

function normalizeCodes(codes){
  const normalized = {};
  Object.keys(codes).forEach(code=>{
    normalized[code.toUpperCase()] = codes[code];
  });
  return normalized;
}
const TEACHER_CODES_NORMALIZED = normalizeCodes(TEACHER_CODES);
const STUDENT_CODES_NORMALIZED = normalizeCodes(STUDENT_CODES);

function resolveAuth(rawCode){
  const code = rawCode.trim().toUpperCase();
  if(TEACHER_CODES_NORMALIZED[code]){
    return { academyName: TEACHER_CODES_NORMALIZED[code], role: 'teacher', code };
  }
  if(STUDENT_CODES_NORMALIZED[code]){
    return { academyName: STUDENT_CODES_NORMALIZED[code], role: 'student', code };
  }
  return null;
}

window.tryAuth = function(){
  const input = document.getElementById('authCodeInput');
  const auth = resolveAuth(input.value);
  if(auth){
    sessionStorage.setItem('examAuthCode', auth.code);
    sessionStorage.setItem('examAuthRole', auth.role);
    showSite(auth.academyName, auth.role);
  }else{
    document.getElementById('authError').textContent = '인증번호가 올바르지 않습니다.';
  }
};

document.getElementById('authCodeInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') window.tryAuth();
});

(function checkExistingAuth(){
  const savedCode = sessionStorage.getItem('examAuthCode');
  if(!savedCode) return;
  const savedRole = sessionStorage.getItem('examAuthRole');
  const codes = savedRole === 'student' ? STUDENT_CODES_NORMALIZED : TEACHER_CODES_NORMALIZED;
  const academyName = codes[savedCode.toUpperCase()];
  if(academyName) showSite(academyName, savedRole);
})();

// ── 동기부여 영상 관련 함수 ──

// 유튜브 URL/ID 문자열에서 11자리 영상 ID만 뽑아냅니다.
function extractYoutubeId(input){
  if(!input) return null;
  const trimmed = input.trim();
  const patterns = [
    /(?:youtube\.com\/watch\?v=)([\w-]{11})/,
    /(?:youtu\.be\/)([\w-]{11})/,
    /(?:youtube\.com\/shorts\/)([\w-]{11})/,
    /(?:youtube\.com\/embed\/)([\w-]{11})/,
  ];
  for(const p of patterns){
    const m = trimmed.match(p);
    if(m) return m[1];
  }
  if(/^[\w-]{11}$/.test(trimmed)) return trimmed;
  return null;
}

let motivationCache = [];

async function loadMotivationVideos(){
  const el = document.getElementById('motivationList');
  if(!el) return;
  el.innerHTML = '<div class="motiv-empty">불러오는 중...</div>';
  try{
    const snap = await getDocs(query(collection(db, 'motivationVideos'), orderBy('createdAt', 'desc')));
    const list = [];
    snap.forEach(d => list.push({ id: d.id, ...d.data() }));
    motivationCache = list;
    renderMotivationList();
  }catch(e){
    el.innerHTML = `<div class="motiv-empty">불러오기 오류: ${e.message}</div>`;
  }
}

function renderMotivationList(){
  const el = document.getElementById('motivationList');
  if(!el) return;
  if(!motivationCache.length){
    el.innerHTML = '<div class="motiv-empty">아직 등록된 영상이 없습니다. 선생님이 로그인하면 위에서 영상을 등록할 수 있어요.</div>';
    return;
  }
  el.innerHTML = motivationCache.map(v => `
    <div class="motiv-card" onclick="openYoutubeModal('${v.youtubeId}', '${(v.title||'').replace(/'/g,"\\'")}')">
      <div class="motiv-thumb">
        <img src="https://img.youtube.com/vi/${v.youtubeId}/hqdefault.jpg" alt="${(v.title||'').replace(/"/g,'&quot;')}" loading="lazy">
        <div class="play-badge">▶</div>
      </div>
      <div class="motiv-body">
        <div class="motiv-title">${v.title || '(제목 없음)'}</div>
        <div class="motiv-meta">
          <span>${v.academy || ''}</span>
          ${currentRole === 'teacher' ? `<button class="motiv-delete" onclick="event.stopPropagation();deleteMotivationVideo('${v.id}')">삭제</button>` : ''}
        </div>
      </div>
    </div>`).join('');
}

window.addMotivationVideo = async function(){
  const msgEl = document.getElementById('motivMsg');
  const titleInput = document.getElementById('motivTitle');
  const urlInput = document.getElementById('motivUrl');
  const title = titleInput.value.trim();
  const youtubeId = extractYoutubeId(urlInput.value);

  if(!title){ msgEl.textContent = '⚠️ 제목을 입력해주세요.'; return; }
  if(!youtubeId){ msgEl.textContent = '⚠️ 올바른 유튜브 링크를 입력해주세요.'; return; }

  msgEl.textContent = '등록 중...';
  try{
    await addDoc(collection(db, 'motivationVideos'), {
      title, youtubeId,
      academy: currentAcademyName || '',
      createdAt: new Date().toISOString()
    });
    titleInput.value = '';
    urlInput.value = '';
    msgEl.textContent = '✅ 등록 완료';
    await loadMotivationVideos();
  }catch(e){
    msgEl.textContent = '❌ 등록 실패: ' + e.message;
  }
};

window.deleteMotivationVideo = async function(id){
  if(!confirm('이 영상을 삭제하시겠습니까?')) return;
  try{
    await deleteDoc(doc(db, 'motivationVideos', id));
    await loadMotivationVideos();
  }catch(e){
    alert('삭제 오류: ' + e.message);
  }
};

window.openYoutubeModal = function(youtubeId, title){
  const modal = document.getElementById('youtubeModal');
  const frame = document.getElementById('youtubeModalFrame');
  const titleEl = document.getElementById('youtubeModalTitle');
  frame.src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1`;
  titleEl.textContent = title || '';
  modal.style.display = 'flex';
};

function closeYoutubeModal(){
  const modal = document.getElementById('youtubeModal');
  const frame = document.getElementById('youtubeModalFrame');
  modal.style.display = 'none';
  frame.src = '';
}
document.getElementById('youtubeModalOverlay').addEventListener('click', closeYoutubeModal);
document.getElementById('youtubeModalClose').addEventListener('click', closeYoutubeModal);
</script>

</body>
</html>
